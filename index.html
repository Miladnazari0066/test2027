<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alus · پنل مدیریت</title>

<meta name="application-name" content="Alus">
<meta name="theme-color" content="#007AFF">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alus">
<meta name="description" content="Alus — مدیریت هوشمند موجودی و جابه‌جایی مبلمان">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" crossorigin="anonymous">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--purple:#AF52DE;--teal:#5AC8FA;
  --grad:linear-gradient(135deg,#007AFF 0%,#5856D6 55%,#AF52DE 120%);
  --grad-2:linear-gradient(135deg,#007AFF,#5856D6);
  --grad-success:linear-gradient(135deg,#34C759,#00A14B);
  --grad-warn:linear-gradient(135deg,#FF9500,#E67E00);
  --grad-danger:linear-gradient(135deg,#FF3B30,#D70015);
  --grad-info:linear-gradient(135deg,#5AC8FA,#0EA5E9);
  --grad-soft:linear-gradient(135deg,rgba(0,122,255,.15),rgba(175,82,222,.10));
  --g1:rgba(255,255,255,.62);--g2:rgba(255,255,255,.78);--g3:rgba(255,255,255,.92);
  --gb:rgba(255,255,255,.7);
  --ghl:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35);
  --gs:0 8px 32px -8px rgba(15,23,42,.12),0 2px 8px -2px rgba(15,23,42,.06);
  --bg:#eef2f9;--surface:#fff;--surface-2:#f6f8fc;--surface-3:#eef1f8;
  --border:rgba(15,23,42,.08);--border-2:rgba(15,23,42,.14);
  --text:#0a1220;--text-2:#334155;--muted:#64748b;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"]{
  --g1:rgba(30,35,50,.55);--g2:rgba(30,35,50,.75);--g3:rgba(30,35,50,.9);
  --gb:rgba(255,255,255,.09);
  --ghl:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.3);
  --bg:#06070d;--surface:#0f1420;--surface-2:#161d2c;--surface-3:#1e2739;
  --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.14);
  --text:#eef2f8;--text-2:#cbd5e1;--muted:#94a3b8;
}
html,body{height:100%}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(100,116,139,.25);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* ===== ALUS WORDMARK ===== */
.alus-wm{display:inline-block;font-weight:900;letter-spacing:-.7px;line-height:1;color:var(--blue);font-feature-settings:"ss01"}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .alus-wm{background:linear-gradient(120deg,#007AFF 0%,#5856D6 55%,#AF52DE 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  [data-theme="dark"] .alus-wm{background:linear-gradient(120deg,#60a5fa 0%,#818cf8 55%,#c084fc 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
}
.alus-wm.lg{font-size:22px;letter-spacing:-1px}
.alus-wm.xl{font-size:30px;letter-spacing:-1.5px}
.alus-mark{display:inline-grid;place-items:center;background:var(--grad);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -8px rgba(0,122,255,.7)}
.alus-mark svg{stroke:currentColor}

/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(135deg,#007AFF 0%,#5856D6 55%,#AF52DE 120%);
  animation:splashFade 2.2s ease-in forwards}
.splash::before{content:'';position:absolute;inset:0;
  background:radial-gradient(700px 500px at 50% 45%,rgba(255,255,255,.28),transparent 65%),
             radial-gradient(400px 400px at 90% 10%,rgba(255,255,255,.14),transparent 60%),
             radial-gradient(500px 500px at 10% 90%,rgba(255,255,255,.10),transparent 60%);
  pointer-events:none}
.splash-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;
  transform-origin:center center;
  animation:splashIn 2.2s cubic-bezier(.55,0,.35,1) forwards}
.splash-ring{position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  pointer-events:none;animation:splashRing 2.2s ease-out forwards}
.splash-ring.r2{animation-delay:.15s}
.splash-logo{position:relative;width:130px;height:130px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.28),rgba(255,255,255,.08) 60%);
  border:2px solid rgba(255,255,255,.45);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.splash-logo svg{width:64px;height:64px;stroke-width:2.4;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25))}
.splash-wm{font-size:46px;font-weight:900;letter-spacing:-2.2px;color:#fff;line-height:1;
  text-shadow:0 6px 30px rgba(0,0,0,.25)}
.splash-tag{font-size:12px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.8);
  margin-top:-4px}
.splash-dots{display:flex;gap:6px;margin-top:14px}
.splash-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);
  animation:splashDot 1.4s ease-in-out infinite}
.splash-dots span:nth-child(2){animation-delay:.15s}
.splash-dots span:nth-child(3){animation-delay:.3s}

@keyframes splashIn{
  0%{transform:scale(.82);opacity:0;filter:blur(6px)}
  18%{transform:scale(1);opacity:1;filter:blur(0)}
  60%{transform:scale(1.02);opacity:1;filter:blur(0)}
  100%{transform:scale(9);opacity:0;filter:blur(2px)}
}
@keyframes splashFade{
  0%,62%{opacity:1}
  100%{opacity:0}
}
@keyframes splashRing{
  0%{transform:translateX(-50%) scale(.5);opacity:0}
  25%{transform:translateX(-50%) scale(1);opacity:.7}
  55%{transform:translateX(-50%) scale(1.3);opacity:.25}
  100%{transform:translateX(-50%) scale(2.5);opacity:0}
}
@keyframes splashDot{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes spinner{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes confetti{0%{transform:translateY(-20vh) rotate(0);opacity:1}100%{transform:translateY(120vh) rotate(720deg);opacity:0}}
@keyframes circleIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes celebrateOut{to{opacity:0;transform:scale(1.15)}}
@keyframes ripple{to{transform:scale(3);opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes notifIn{from{opacity:0;transform:translateX(-100%)}to{opacity:1;transform:none}}
@keyframes notifOut{to{opacity:0;transform:translateX(-100%)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:100px;font-size:13.5px;font-weight:600;background:var(--g2);color:var(--text);border:1px solid var(--gb);box-shadow:var(--ghl),0 4px 14px -6px rgba(15,23,42,.14);transition:all .28s var(--ease);position:relative;overflow:hidden;white-space:nowrap;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:var(--ghl),0 12px 28px -10px rgba(15,23,42,.24);background:var(--g3)}
.btn:active{transform:translateY(0) scale(.97)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px}
.btn.sm svg{width:13px;height:13px}
.btn.xs{height:28px;padding:0 11px;font-size:11.5px}
.btn.xs svg{width:12px;height:12px}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -8px rgba(0,122,255,.65)}
.btn.success{background:var(--grad-success);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(52,199,89,.65)}
.btn.danger{background:var(--grad-danger);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(255,59,48,.65)}
.btn.warn{background:var(--grad-warn);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(255,149,0,.65)}
.btn.ghost{background:transparent;border:1px solid var(--border-2);box-shadow:none}
.btn.ghost:hover{background:var(--g1)}
.btn.block{width:100%}
.btn .rip{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.6),transparent 70%);transform:scale(0);pointer-events:none;animation:ripple .7s ease-out}
.btn:not(.primary):not(.success):not(.danger):not(.warn) .rip{background:radial-gradient(circle,rgba(0,122,255,.35),transparent 70%)}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:'';position:absolute;top:50%;left:50%;margin:-8px 0 0 -8px;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spinner .7s linear infinite}

.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--g1);border:1px solid var(--gb);box-shadow:var(--ghl);transition:all .25s var(--ease);cursor:pointer;position:relative}
.icon-btn:hover{background:var(--g2);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .pulse{position:absolute;top:5px;left:5px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
.icon-btn .pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--red);animation:ping 1.8s ease-out infinite}

.nav-wrap{position:sticky;top:0;z-index:50;padding:12px 20px 0}
.navbar{height:64px;max-width:1560px;margin:0 auto;background:var(--g2);backdrop-filter:blur(28px) saturate(1.9);-webkit-backdrop-filter:blur(28px) saturate(1.9);border:1px solid var(--gb);border-radius:100px;display:flex;align-items:center;gap:12px;padding:0 12px 0 20px;box-shadow:var(--ghl),var(--gs)}
.nav-brand{display:flex;align-items:center;gap:11px;flex-shrink:0;padding-left:6px}
.brand-logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -8px rgba(0,122,255,.7)}
.brand-logo svg{width:22px;height:22px}
.brand-text{font-weight:700;line-height:1.1}
.brand-text .wm{font-size:19px}
.brand-text small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:0}

.nav-pills{display:flex;align-items:center;gap:3px;background:var(--g1);border:1px solid var(--gb);border-radius:100px;padding:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-pills::-webkit-scrollbar{display:none}
.nav-pill{display:flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:100px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;flex-shrink:0;cursor:pointer;transition:all .3s var(--ease)}
.nav-pill svg{width:15px;height:15px;opacity:.8}
.nav-pill.active{background:var(--grad);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px -8px rgba(0,122,255,.65)}
.nav-pill.active svg{opacity:1}
.nav-pill .kbd{font-size:10px;padding:1px 6px;border-radius:100px;background:rgba(15,23,42,.08);color:var(--muted)}
.nav-pill.active .kbd{background:rgba(255,255,255,.25);color:#fff}
.nav-pill .nbadge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;background:#fff;color:var(--red)}
.nav-pill.active .nbadge{background:rgba(255,255,255,.95)}

.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-btn{display:flex;align-items:center;gap:9px;height:40px;padding:0 14px;background:var(--g1);border:1px solid var(--gb);border-radius:100px;color:var(--muted);font-size:12.5px;min-width:220px;cursor:pointer}
.search-btn svg{width:14px;height:14px}
.search-btn kbd{margin-right:auto;font-size:10.5px;padding:2px 7px;border-radius:100px;background:rgba(15,23,42,.08);color:var(--muted)}
.user-btn{display:flex;align-items:center;gap:9px;height:44px;padding:3px 12px 3px 4px;border-radius:100px;background:var(--g1);border:1px solid var(--gb);cursor:pointer;box-shadow:var(--ghl);transition:transform .25s var(--ease)}
.user-btn:hover{transform:translateY(-1px)}
.user-btn .who-text b{display:block;font-size:12.5px;font-weight:700;line-height:1.2}
.user-btn .who-text span{display:block;font-size:10.5px;color:var(--muted)}
.user-btn svg{width:13px;height:13px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;background:var(--grad-2);flex-shrink:0;position:relative}
.avatar::after{content:'';position:absolute;bottom:0;left:0;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}

@media (max-width:900px){
  .nav-wrap{padding:10px 12px 0}
  .navbar{justify-content:space-between;padding:0 8px 0 12px;height:58px;gap:0}
  .nav-pills{display:none!important}
  .nav-right{margin-right:0!important;margin-left:0!important;gap:6px}
  .search-btn{min-width:38px!important;width:38px!important;padding:0!important;justify-content:center!important}
  .search-btn span,.search-btn kbd{display:none!important}
  .icon-btn{width:38px;height:38px}
  .user-btn{padding:3px;height:40px}
  .user-btn .who-text,.user-btn > svg{display:none}
  .user-btn .avatar{width:34px;height:34px}
  .brand-text .wm{font-size:17px}
  .brand-text small{font-size:9.5px}
  .splash-logo{width:110px;height:110px}
  .splash-logo svg{width:54px;height:54px}
  .splash-wm{font-size:38px}
  .splash-ring{width:110px;height:110px}
}
@media (min-width:901px){.user-btn .who-text{display:block}}

.page{max-width:1560px;margin:0 auto;padding:26px 20px 60px}
@media (max-width:900px){.page{padding:18px 14px 130px}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.7px;line-height:1.15}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:6px}
.page-actions{display:flex;gap:9px;flex-wrap:wrap}

.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.w-3{grid-column:span 3}.w-4{grid-column:span 4}.w-5{grid-column:span 5}
.w-6{grid-column:span 6}.w-7{grid-column:span 7}.w-8{grid-column:span 8}
@media (max-width:1200px){.w-3,.w-4,.w-5{grid-column:span 6}.w-7,.w-8{grid-column:span 12}}
@media (max-width:760px){.bento>*{grid-column:span 12!important}}

.widget{background:var(--g2);border:1px solid var(--gb);border-radius:22px;padding:18px;box-shadow:var(--ghl),var(--gs)}
.w-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.w-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.w-title .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--grad-2)}
.w-title .ic svg{width:14px;height:14px}
.w-title.success .ic{background:var(--grad-success)}
.w-title.warn .ic{background:var(--grad-warn)}
.w-title.danger .ic{background:var(--grad-danger)}
.w-title.info .ic{background:var(--grad-info)}
.w-sub{font-size:11.5px;color:var(--muted);margin-top:3px}

.hero{background:var(--grad);border-radius:28px;padding:28px;color:#fff;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 20px 50px -18px rgba(0,122,255,.6)}
.hero::before{content:'';position:absolute;top:-60%;right:-10%;width:70%;height:180%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 60%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:24px;font-weight:800;margin-bottom:8px}
.hero p{opacity:.92;font-size:13.5px;line-height:1.9;max-width:480px}
.hero-stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.hero-stat .k{font-size:11.5px;opacity:.8;margin-bottom:3px}
.hero-stat .v{font-size:22px;font-weight:800}
.hero-stat .v small{font-size:11px;font-weight:500;opacity:.8;margin-right:3px}
.hero-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hero-quick button{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:100px;background:rgba(255,255,255,.2);color:#fff;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.3);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:background .25s var(--ease)}
.hero-quick button:hover{background:rgba(255,255,255,.3)}
.hero-quick button svg{width:14px;height:14px}

.stat{display:flex;flex-direction:column;padding:18px;background:var(--g2);border:1px solid var(--gb);border-radius:22px}
.stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stat-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.stat-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-2)}
.stat-ic svg{width:17px;height:17px}
.stat.success .stat-ic{background:var(--grad-success)}
.stat.warn .stat-ic{background:var(--grad-warn)}
.stat.info .stat-ic{background:var(--grad-info)}
.stat-value{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:15px;border-radius:18px;background:var(--g1);border:1px solid var(--gb);text-align:right;cursor:pointer;transition:all .3s var(--ease)}
.qa-btn:hover{transform:translateY(-3px)}
.qa-btn .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-2)}
.qa-btn .ic svg{width:18px;height:18px}
.qa-btn.alt-1 .ic{background:var(--grad-success)}
.qa-btn.alt-2 .ic{background:var(--grad-warn)}
.qa-btn.alt-3 .ic{background:var(--grad-info)}
.qa-btn b{font-size:12.5px;font-weight:700}
.qa-btn span{font-size:11px;color:var(--muted)}

.pipe{display:flex;flex-direction:column;gap:8px}
.pipe-step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--g1);border:1px solid var(--gb)}
.pipe-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.pipe-step.active .pipe-num{background:var(--grad);color:#fff;border-color:transparent}
.pipe-step.done .pipe-num{background:var(--grad-success);color:#fff;border-color:transparent}
.pipe-step .lbl{flex:1;font-size:12.5px;font-weight:600}

<script>
/* ===== SAFE ERROR HANDLER ===== */
(function(){
  function isCrossOriginNoise(msg, src) {
    if (!msg) return true;
    var m = String(msg);
    if (m === 'Script error.' || m.indexOf('Script error') === 0) return true;
    if (m === 'ResizeObserver loop limit exceeded') return true;
    if (m === 'ResizeObserver loop completed with undelivered notifications.') return true;
    try {
      if (src) {
        var u = new URL(src, location.href);
        if (u.origin !== location.origin) return true;
      }
    } catch(e) {}
    return false;
  }
  function show(msg, line, col) {
    var e = document.getElementById('err');
    if (!e) return;
    e.style.display = 'block';
    e.textContent = 'ERROR: ' + msg + (line ? ' @ ' + line + ':' + col : '');
    clearTimeout(e._t);
    e._t = setTimeout(function(){ e.style.display = 'none'; }, 8000);
  }
  window.onerror = function(msg, src, line, col, err) {
    if (isCrossOriginNoise(msg, src)) return false;
    if (!line && !col && err && !err.stack) return false;
    show(msg, line, col);
    return false;
  };
  window.addEventListener('unhandledrejection', function(ev) {
    var r = ev.reason;
    if (!r) return;
    if (isCrossOriginNoise(r.message || String(r))) return;
    var txt = (r && (r.message || r.toString())) || 'Unhandled rejection';
    if (txt.indexOf('Script error') >= 0) return;
    show(txt, 0, 0);
  });
  window.addEventListener('error', function(ev) {
    if (ev.target && ev.target !== window && (ev.target.tagName === 'SCRIPT' || ev.target.tagName === 'LINK' || ev.target.tagName === 'IMG')) {
      ev.preventDefault();
    }
  }, true);
})();

    if (document.body) {
      document.body.appendChild(wrap);
    } else {
      document.documentElement.appendChild(wrap);
    }

    // Prevent scroll while splash is active
    try { document.body.style.overflow = 'hidden'; } catch(e) {}

    var removed = false;
    function cleanup() {
      if (removed) return; removed = true;
      if (wrap && wrap.parentNode) wrap.remove();
      try { document.body.style.overflow = ''; } catch(e) {}
    }
    setTimeout(cleanup, 2300);
    wrap.addEventListener('animationend', function(e) {
      if (e.animationName === 'splashFade') cleanup();
    });
    // Failsafe
    setTimeout(cleanup, 3500);
  } catch(e) { /* silent */ }
}

/* ===== PWA INITIALIZER ===== */
var PWA = (function(){
  function drawIcon(size, maskable) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var x = c.getContext('2d');
    if (!x) return null;
    var s = size;
    var pad = maskable ? s * 0.18 : s * 0.06;

    var g = x.createLinearGradient(0, 0, s, s);
    g.addColorStop(0, '#007AFF');
    g.addColorStop(0.55, '#5856D6');
    g.addColorStop(1, '#AF52DE');
    x.fillStyle = g;

    if (maskable) {
      x.fillRect(0, 0, s, s);
    } else {
      var r = s * 0.22;
      x.beginPath();
      x.moveTo(r, 0);
      x.lineTo(s - r, 0);
      x.quadraticCurveTo(s, 0, s, r);
      x.lineTo(s, s - r);
      x.quadraticCurveTo(s, s, s - r, s);
      x.lineTo(r, s);
      x.quadraticCurveTo(0, s, 0, s - r);
      x.lineTo(0, r);
      x.quadraticCurveTo(0, 0, r, 0);
      x.closePath();
      x.fill();
    }

    x.save();
    x.globalCompositeOperation = 'source-atop';
    var hg = x.createRadialGradient(s * 0.75, s * 0.2, 0, s * 0.75, s * 0.2, s * 0.9);
    hg.addColorStop(0, 'rgba(255,255,255,.35)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = hg;
    x.fillRect(0, 0, s, s);
    x.restore();

    var inner = s - pad * 2;
    var w = inner * 0.62;
    var h = inner * 0.70;
    var cx = s / 2;
    var cy = s / 2 + s * 0.01;
    var leftX = cx - w / 2;
    var rightX = cx + w / 2;
    var topY = cy - h / 2;
    var botY = cy + h / 2;

    x.strokeStyle = '#fff';
    x.lineWidth = Math.max(2, inner * 0.085);
    x.lineCap = 'round';
    x.lineJoin = 'round';

    x.beginPath();
    x.moveTo(leftX, botY);
    x.lineTo(cx, topY);
    x.lineTo(rightX, botY);
    x.stroke();

    var barY = cy + h * 0.17;
    x.beginPath();
    x.moveTo(cx - w * 0.24, barY);
    x.lineTo(cx + w * 0.24, barY);
    x.stroke();

    try { return c.toDataURL('image/png'); } catch(e) { return null; }
  }

  function installManifest() {
    var i192 = drawIcon(192, false);
    var i512 = drawIcon(512, false);
    var i192m = drawIcon(192, true);
    var i512m = drawIcon(512, true);
    if (!i192 || !i512 || !i192m || !i512m) return;

    var fav = document.createElement('link');
    fav.rel = 'icon'; fav.type = 'image/png'; fav.href = i192;
    document.head.appendChild(fav);

    var apple = document.createElement('link');
    apple.rel = 'apple-touch-icon'; apple.href = i192;
    document.head.appendChild(apple);

    var manifest = {
      name: 'Alus — پنل مدیریت',
      short_name: 'Alus',
      description: 'مدیریت هوشمند موجودی و جابه‌جایی مبلمان',
      start_url: '.',
      scope: '.',
      display: 'standalone',
      display_override: ['standalone', 'minimal-ui'],
      orientation: 'any',
      background_color: '#007AFF',
      theme_color: '#007AFF',
      dir: 'rtl',
      lang: 'fa-IR',
      categories: ['business', 'productivity'],
      icons: [
        { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: i192m, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
        { src: i512m, sizes: '512x512', type: 'image/png', purpose: 'maskable' }

    };

    var url;
    try {
      var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      url = URL.createObjectURL(blob);
    } catch(e) {
      url = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));

    var link = document.createElement('link');
    link.rel = 'manifest';

  }

  var deferredPrompt = null;
  var installShown = false;

  function showInstallToast() {
    if (installShown || !deferredPrompt) return;
    if (sessionStorage.getItem('alus_install_dismissed') === '1') return;
    if (document.querySelector('.install-toast')) return;
    installShown = true;
    var t = document.createElement('div');
    t.className = 'install-toast';
    t.innerHTML =
      '<div class="alus-mark" style="width:36px;height:36px;border-radius:50%;flex-shrink:0">' + BRAND_A + '</div>' +
      '<div class="txt">نصب Alus<small>برای دسترسی سریع روی صفحه اصلی</small></div>' +
      '<button type="button" data-act="install">' + IC.download + ' نصب</button>' +
      '<button type="button" class="x" data-act="dismiss">' + IC.close + '</button>';
    document.body.appendChild(t);
    t.addEventListener('click', function(e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'install') {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function(){ deferredPrompt = null; });
        }
        t.remove();
      } else if (b.dataset.act === 'dismiss') {
        try { sessionStorage.setItem('alus_install_dismissed', '1'); } catch(e) {}
        t.remove();
      }
    });
    setTimeout(function(){ if (t.parentNode) t.remove(); }, 12000);
  }

  function init() {
    try { installManifest(); } catch(e) {}
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(showInstallToast, 3500);
    });
    window.addEventListener('appinstalled', function() {
      deferredPrompt = null;
      var t = document.querySelector('.install-toast'); if (t) t.remove();
    });
  }

  return { init: init };
})();

function attachRipple(el) {
  if (el._rip) return; el._rip = true;
  el.addEventListener('click', function(e) {
    var r = el.getBoundingClientRect();
    var s = document.createElement('span'); s.className = 'rip';
    var sz = Math.max(r.width, r.height);
    s.style.width = s.style.height = sz + 'px';
    s.style.left = (e.clientX - r.left - sz / 2) + 'px';
    s.style.top = (e.clientY - r.top - sz / 2) + 'px';
    el.appendChild(s);
    setTimeout(function() { if (s.parentNode) s.remove(); }, 700);
  });
}
function attachRippleAll(root) { $$('.btn', root || document).forEach(function(b) { attachRipple(b); }); }

function doApprove(id) {
  openModal({
    title: 'تأیید مرحله',
    desc: 'آیا از تأیید این مرحله مطمئن هستید؟',
    body: '<div class="field"><label>یادداشت (اختیاری)</label><textarea id="ap-note"></textarea></div>',
    actions: [
      { label: 'انصراف', cls: 'ghost', onClick: function(c) { c.remove(); } },
      { label: IC.check + ' تأیید', cls: 'success', onClick: function(c) {
        var btn = c.querySelector('button.success'); if (btn) btn.classList.add('loading');
        var noteBox = c.querySelector('#ap-note'); var note = noteBox ? noteBox.value.trim() : '';
        setTimeout(function() {
          try {
            var db = loadDB();
            var t = null;
            for (var i = 0; i < db.transfers.length; i++) if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
            if (!t) { c.remove(); return; }
            if (!canApprove(App.user, t)) { c.remove(); celebrate('دسترسی ندارید', '', 'error', 1800); return; }
            var step = { userId: App.user.id, userName: App.user.name, at: new Date().toISOString(), note: note };
            var finalized = false;
            if (t.type === 'inbound') {
              if (t.status === 'pending_warehouse') { t.warehouseApproval = step; t.status = 'pending_accountant'; }
              else if (t.status === 'pending_accountant') { t.accountantApproval = step; t.status = 'pending_manager'; }
              else if (t.status === 'pending_manager') {
                t.managerApproval = step;
                var ds = findStock(db, t.productId, t.destinationWarehouseId);
                if (!ds) { ds = { id: uid(), productId: t.productId, warehouseId: t.destinationWarehouseId, quantity: 0, reservedQty: 0, updatedAt: new Date().toISOString() }; db.stocks.push(ds); }
                ds.quantity = (ds.quantity || 0) + t.quantity;
                ds.updatedAt = new Date().toISOString();
                t.status = 'approved'; t.completedAt = new Date().toISOString(); finalized = true;
              }
            } else {
              if (t.status === 'pending_warehouse') { t.warehouseApproval = step; t.status = 'pending_accountant'; }
              else if (t.status === 'pending_accountant') { t.accountantApproval = step; t.status = 'pending_manager'; }
              else if (t.status === 'pending_manager') {
                t.managerApproval = step;
                var srcStock = findStock(db, t.productId, t.sourceWarehouseId);
                if (!srcStock || srcStock.quantity < t.quantity) { c.remove(); celebrate('موجودی کافی نیست', '', 'error', 2000); return; }
                srcStock.quantity -= t.quantity;
                srcStock.reservedQty = Math.max(0, (srcStock.reservedQty || 0) - t.quantity);
                srcStock.updatedAt = new Date().toISOString();
                var dstW = getWh(db, t.destinationWarehouseId);
                if (dstW && dstW.type !== 'customer') {
                  var ds2 = findStock(db, t.productId, t.destinationWarehouseId);
                  if (!ds2) { ds2 = { id: uid(), productId: t.productId, warehouseId: t.destinationWarehouseId, quantity: 0, reservedQty: 0, updatedAt: new Date().toISOString() }; db.stocks.push(ds2); }
                  ds2.quantity = (ds2.quantity || 0) + t.quantity;
                  ds2.updatedAt = new Date().toISOString();
                }
                t.status = 'approved'; t.completedAt = new Date().toISOString(); finalized = true;
              }
            }
            saveDB(db);
            try { c.remove(); } catch(e) {}
            closeNotif();
            if (finalized) celebrate(t.type === 'inbound' ? 'ورود کالا ثبت شد' : 'انتقال قطعی شد', '', 'success', 2000);
            else celebrate('تأیید شد', 'به مرحله بعد منتقل شد', 'success', 1600);
            requestAnimationFrame(function() { requestAnimationFrame(function() { render(); }); });
          } catch(err) {
            try { c.remove(); } catch(e) {}
            celebrate('خطا', err.message || 'عملیات ناموفق', 'error', 2200);
          }
        }, 400);
      } }
    ]
  });
}

function doReject(id) {
  openModal({
    title: 'رد درخواست',
    desc: 'دلیل رد را وارد کنید.',
    body: '<div class="field"><label>دلیل <span class="req">*</span></label><textarea id="rj-reason"></textarea></div>',
    actions: [
      { label: 'انصراف', cls: 'ghost', onClick: function(c) { c.remove(); } },
      { label: IC.x + ' ثبت رد', cls: 'danger', onClick: function(c) {
        var reasonBox = c.querySelector('#rj-reason'); var reason = reasonBox ? reasonBox.value.trim() : '';
        if (!reason) { celebrate('دلیل الزامی است', '', 'warn', 1600); return; }
        var btn = c.querySelector('button.danger'); if (btn) btn.classList.add('loading');
        setTimeout(function() {
          try {
            var db = loadDB();
            var t = null;
            for (var i = 0; i < db.transfers.length; i++) if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
            if (!t) { c.remove(); return; }
            if (!canApprove(App.user, t)) { c.remove(); celebrate('دسترسی ندارید', '', 'error', 1800); return; }
            var stageMap = { pending_warehouse: 'warehouse', pending_accountant: 'accountant', pending_manager: 'manager' };
            var stage = stageMap[t.status];
            if (t.type !== 'inbound') {
              var srcStock = findStock(db, t.productId, t.sourceWarehouseId);
              if (srcStock) { srcStock.reservedQty = Math.max(0, (srcStock.reservedQty || 0) - t.quantity); srcStock.updatedAt = new Date().toISOString(); }
            }
            t.rejection = { userId: App.user.id, userName: App.user.name, at: new Date().toISOString(), reason: reason, stage: stage };
            t.status = 'rejected';
            saveDB(db);
            c.remove(); closeNotif();
            celebrate('درخواست رد شد', '', 'error', 1900);
            requestAnimationFrame(function() { requestAnimationFrame(function() { render(); }); });
          } catch(err) {
            try { c.remove(); } catch(e) {}
            celebrate('خطا', err.message || 'عملیات ناموفق', 'error', 2200);
          }
        }, 400);
      } }
    ]
  });
}

      { label: App.theme === 'light' ? 'حالت تاریک' : 'حالت روشن', icon: App.theme === 'light' ? IC.moon : IC.sun, run: toggleTheme, sec: 'تنظیمات' },
      { label: 'خروج از حساب', icon: IC.logout, run: doLogout, sec: 'تنظیمات' }
    ];
    var all = navItems.concat(acts);
    var f = query ? all.filter(function(c) { return c.label.toLowerCase().indexOf(query) >= 0; }) : all;
    if (!f.length) { list.innerHTML = '<div class="cmd-empty">موردی یافت نشد</div>'; list._f = []; return; }
    var html = ''; var lastSec = null;
    f.forEach(function(c, i) {
      if (c.sec && c.sec !== lastSec) { html += '<div class="cmd-sec">' + c.sec + '</div>'; lastSec = c.sec; }
      html += '<div class="cmd-item ' + (i === sel ? 'sel' : '') + '" data-i="' + i + '">' + c.icon + '<b>' + c.label + '</b>' + (c.kbd ? '<span class="kbd">' + c.kbd + '</span>' : '') + '</div>';
    });
    list.innerHTML = html; list._f = f;
    $$('.cmd-item', list).forEach(function(el) {
      el.addEventListener('click', function() { closeCmd(); f[+el.dataset.i].run(); });
      el.addEventListener('mouseenter', function() { sel = +el.dataset.i; $$('.cmd-item', list).forEach(function(x) { x.classList.toggle('sel', +x.dataset.i === sel); }); });
    });
  }
  build(''); input.focus();
  input.addEventListener('input', function() { sel = 0; build(input.value); });
  input.addEventListener('keydown', function(e) {
    var f = list._f || [];
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, f.length - 1); $$('.cmd-item', list).forEach(function(x) { x.classList.toggle('sel', +x.dataset.i === sel); }); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); $$('.cmd-item', list).forEach(function(x) { x.classList.toggle('sel', +x.dataset.i === sel); }); }
    if (e.key === 'Enter') { e.preventDefault(); var c = f[sel]; if (c) { closeCmd(); c.run(); } }
    if (e.key === 'Escape') closeCmd();
  });
  bd.addEventListener('click', function(e) { if (e.target === bd) closeCmd(); });
}

function openUserMenu(anchor) {
  var old = document.querySelector('.userm'); if (old) old.remove();
  var rect = anchor.getBoundingClientRect();
  var w = 250;
  var left = rect.left;
  if (left + w > window.innerWidth - 10) left = window.innerWidth - w - 10;
  if (left < 10) left = 10;
  var m = document.createElement('div');
  m.className = 'userm';
  m.style.top = (rect.bottom + 8) + 'px';
  m.style.left = left + 'px';
  m.innerHTML =
    '<div class="header">' +
      '<div class="name">' + esc(App.user.name) + '</div>' +
      '<div class="role">' + ROLES[App.user.role] + '</div>' +

    '<div class="sep"></div>' +
    '<button class="menu-i" data-a="logout" style="color:var(--red)">' + IC.logout + ' خروج از حساب</button>';
  document.body.appendChild(m);
  $$('.menu-i', m).forEach(function(b) {
    b.addEventListener('click', function() {
      var a = b.dataset.a;
      m.remove();
      if (a === 'logout') doLogout();

    });

  setTimeout(function() {
    function h(ev) { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener('click', h); } }

  }, 10);
}

          }).join('') +

        '<div class="w-head"><div><div class="w-title"><div class="ic danger">' + IC.clock + '</div>در انتظار تأیید</div><div class="w-sub">' + pending + ' درخواست</div></div><button class="btn xs ghost" data-action="notif">اعلان‌ها</button></div>' +
        (pending ? '<div class="t-list">' + db.transfers.filter(function(t) { return t.status.indexOf('pending') === 0; }).slice(0, 3).map(function(t) { return transferItemHTML(db, t); }).join('') + '</div>' : emptyState('همه‌چیز تأیید شده')) +
      '</div>' +
    '</div>';

  $$('[data-action]', page).forEach(function(b) {
    b.addEventListener('click', function() {
      var a = b.dataset.action;
      if (a === 'newTransfer') go('newTransfer');
      else if (a === 'newInbound') go('newInbound');
      else if (a === 'directCustomer') go('directCustomer');
      else if (a === 'stockInit') go('stockInit');
      else if (a === 'transfers') go('transfers');
      else if (a === 'users') go('users');
      else if (a === 'notif') openNotif();
    });
  });
  $$('[data-tid]', page).forEach(function(el) { el.addEventListener('click', function() { openTransfer(el.dataset.tid); }); });
  $$('[data-count]', page).forEach(function(el) { countUp(el, +el.dataset.count); });
}

function countUp(el, target, dur) {
  dur = dur || 800; var t0 = performance.now();
  function tick(now) {
    var p = Math.min((now - t0) / dur, 1);
    var e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e).toLocaleString('fa-IR');
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function emptyState(title) { return '<div class="empty">' + IC.inbox + '<b>' + esc(title) + '</b></div>'; }
function transferItemHTML(db, t) {
  var st = stOf(t);
  var isIn = t.type === 'inbound';
  var p = getProd(db, t.productId);
  var src = getWh(db, t.sourceWarehouseId);
  var dst = getWh(db, t.destinationWarehouseId);
  var stepsHTML = '';
  for (var i = 1; i <= 4; i++) {
    var cls = '';
    if (t.status === 'rejected') {
      var rMap = { warehouse: 1, accountant: 2, manager: 3 };
      var rS = t.rejection ? rMap[t.rejection.stage] : 0;
      if (i < rS) cls = 'done'; else if (i === rS) cls = 'rejected';
    } else {
      if (i < st.step) cls = 'done'; else if (i === st.step) cls = 'active';
    }
    stepsHTML += '<div class="t-step ' + cls + '"></div>';
  }
  var route = isIn
    ? '<div class="t-route" style="color:#0369a1">' + IC.factory + ' ' + esc(t.supplierName || '—') + ' ' + IC.arrowL + ' ' + esc((dst && dst.name) || '—') + '</div>'
    : '<div class="t-route">' + esc((src && src.name) || '—') + ' ' + IC.arrowL + ' ' + esc((dst && dst.name) || '—') + '</div>';
  return '<div class="t-item" data-tid="' + t.id + '">' +
    '<div class="t-row1">' +
      '<span class="t-code">' + esc(t.code) + '</span>' +
      '<span class="badge ' + st.tone + '"><span class="dot"></span>' + st.label + '</span>' +
      (isIn ? '<span class="badge inbound">' + IC.inbound + ' ورود</span>' : '') +
      '<span class="small muted" style="margin-right:auto">' + relTime(t.createdAt) + '</span>' +
    '</div>' +
    '<div class="t-row2">' +
      route +
      '<span>' + esc((p && p.name) || '') + '</span>' +
      '<span class="t-qty">' + t.quantity + '</span>' +
      '<div class="t-progress">' + stepsHTML + '</div>' +
    '</div>' +
  '</div>';
}

function pageStockInit(page) {

        '</div>' +
        '<div class="field">' +
          '<label>واحد شمارش</label>' +
          '<input id="iu" value="دست" placeholder="دست / عدد / متر" />' +
        '</div>' +
        '<div class="field">' +
          '<label>انبار <span class="req">*</span></label>' +
          '<select id="iw" required>' +
            '<option value="">انتخاب...</option>' +

          '</select>' +
        '</div>' +
        '<div class="field">' +
          '<label>تعداد <span class="req">*</span></label>' +
          '<input id="iq" type="number" min="0" required placeholder="0" />' +
        '</div>' +
        '<div class="full" id="iq-hint"></div>' +
        '<div class="full row" style="justify-content:flex-end;margin-top:6px">' +
          '<button class="btn primary" type="submit" id="if-submit">' + IC.check + ' ثبت موجودی</button>' +
        '</div>' +
      '</form>' +
    '</div>';

  // live feedback: product status
  var pInput = $('#ip');
  var statusBox = document.createElement('div');
  statusBox.className = 'full';
  statusBox.style.marginTop = '-6px';
  pInput.parentNode.appendChild(statusBox);

  function updateProductStatus() {
    var val = pInput.value.trim();
    if (!val) { statusBox.innerHTML = ''; return; }
    var fresh = loadDB();
    var match = findProductByName(fresh, val);
    if (match) {
      var stockList = fresh.stocks.filter(function(s) { return s.productId === match.id && s.quantity > 0; });
      var totalQ = stockList.reduce(function(a, s) { return a + s.quantity; }, 0);
      var whNames = stockList.map(function(s) { var w = getWh(fresh, s.warehouseId); return w ? w.name : ''; }).filter(Boolean);
      statusBox.innerHTML =
        '<div style="padding:10px 14px;background:rgba(52,199,89,.10);border:1px solid rgba(52,199,89,.22);border-radius:14px;font-size:12px;color:#047857;display:flex;align-items:center;gap:8px">' +
          IC.check + ' کالای موجود: <b>' + esc(match.name) + '</b>' +
          (totalQ > 0 ? ' <span class="muted" style="color:inherit;opacity:.8">(موجودی فعلی: ' + totalQ + ' در ' + whNames.length + ' انبار)</span>' : '') +
        '</div>';
    } else {
      statusBox.innerHTML =
        '<div style="padding:10px 14px;background:rgba(0,122,255,.10);border:1px solid rgba(0,122,255,.22);border-radius:14px;font-size:12px;color:var(--blue);display:flex;align-items:center;gap:8px">' +
          IC.plus + ' کالای جدید ساخته می‌شود: <b>' + esc(val) + '</b>' +
        '</div>';
    }
  }
  pInput.addEventListener('input', updateProductStatus);
  pInput.addEventListener('change', updateProductStatus);

  // live feedback: reserved qty
  function updHint() {
    var pid = null;
    var name = pInput.value.trim();
    if (name) {
      var tmp = loadDB();
      var m = findProductByName(tmp, name);
      if (m) pid = m.id;
    }
    var wid = $('#iw').value;
    var box = $('#iq-hint');
    if (!pid || !wid) { box.innerHTML = ''; return; }
    var s = findStock(db, pid, wid);
    var rq = s ? (s.reservedQty || 0) : 0;
    if (rq > 0) {
      box.innerHTML = '<div style="padding:12px 16px;background:rgba(255,149,0,.1);border-radius:16px;font-size:12.5px;color:#b45309">' + IC.alert + ' این کالا ' + rq + ' عدد رزرو دارد. مقدار جدید نباید کمتر از ' + rq + ' باشد.</div>';
    } else {
      box.innerHTML = '';
    }
  }
  $('#iw').addEventListener('change', updHint);
  pInput.addEventListener('input', updHint);

  $('#if').addEventListener('submit', function(e) {
    e.preventDefault();

    var name = pInput.value.trim();
    var unit = ($('#iu').value || '').trim() || 'دست';
    var wid = $('#iw').value;
    var qtyRaw = $('#iq').value;
    var qty = parseInt(qtyRaw, 10);

    if (!name || !wid || isNaN(qty) || qty < 0) {
      celebrate('اطلاعات ناقص', 'نام کالا، انبار و تعداد را وارد کنید', 'error', 1800);
      return;
    }
    if (name.length < 2) {
      celebrate('نام کوتاه است', '', 'warn', 1600);
      return;
    }

    var btn = $('#if-submit'); if (btn) btn.classList.add('loading');

    setTimeout(function() {
      try {
        var fresh = loadDB();

        // find or create product
        var product = findProductByName(fresh, name);
        var created = false;
        if (!product) {
          product = {
            id: uid(),
            name: name,
            code: '',
            unit: unit,
            createdAt: new Date().toISOString()
          };
          fresh.products.push(product);
          created = true;
        } else if (!product.unit) {
          product.unit = unit;
        }

        // check reserved
        var s = findStock(fresh, product.id, wid);
        var rq = s ? (s.reservedQty || 0) : 0;
        if (qty < rq) {
          if (btn) btn.classList.remove('loading');
          celebrate('کمتر از رزرو', 'حداقل مقدار باید ' + rq + ' باشد', 'error', 2000);
          return;
        }

        // upsert stock
        if (s) {
          s.quantity = qty;
          s.updatedAt = new Date().toISOString();
        } else {
          fresh.stocks.push({
            id: uid(),
            productId: product.id,
            warehouseId: wid,
            quantity: qty,
            reservedQty: 0,
            updatedAt: new Date().toISOString()
          });
        }

        saveDB(fresh);

        if (created) {
          celebrate('کالا و موجودی ثبت شد', '«' + product.name + '» — ' + qty + ' ' + unit, 'success', 2100);
        } else {
          celebrate('موجودی به‌روزرسانی شد', product.name + ' — ' + qty + ' ' + unit, 'success', 1900);
        }

        go('stock');
      } catch(err) {
        if (btn) btn.classList.remove('loading');
        celebrate('خطا', err.message || 'عملیات ناموفق', 'error', 2200);
      }
    }, 350);
  });

  setTimeout(function() { pInput.focus(); }, 100);
  attachRippleAll();
}

function openTransfer(id) {
  var db = loadDB();
  var t = null;
  for (var i = 0; i < db.transfers.length; i++) if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
  if (!t) { celebrate('یافت نشد', '', 'error', 1600); return; }
  var st = stOf(t);
  var isIn = t.type === 'inbound';
  var p = getProd(db, t.productId);
  var src = getWh(db, t.sourceWarehouseId);
  var dst = getWh(db, t.destinationWarehouseId);

  var steps = [
    { title: 'ثبت درخواست', done: true, at: t.createdAt, user: t.createdByName, icon: IC.plus },
    { title: 'تأیید انباردار', step: t.warehouseApproval, icon: IC.package },
    { title: 'تأیید حسابدار', step: t.accountantApproval, icon: IC.shield },
    { title: 'تأیید مدیر', step: t.managerApproval, icon: IC.users },

      '<div class="dl-item"><div class="k">کالا</div><div class="v">' + esc((p && p.name) || '—') + '</div></div>' +

function pageNewTransfer(page) {
  var db = loadDB();
  var sources = db.warehouses.filter(function(w) { return ['central', 'paint', 'upholstery'].indexOf(w.type) >= 0; });
  if (!sources.length) {
    page.innerHTML = '<div class="page-head"><div><h1>درخواست جابه‌جایی</h1></div></div>' +
      '<div class="widget"><div class="empty">' + IC.alert + '<b>انباری برای مبدأ یافت نشد</b><p>ابتدا یک انبار مرکزی/رنگ‌کاری/رویه‌کوبی تنظیم کنید</p></div></div>';
    return;
  }
  var state = { step: 1, src: '', dst: '', pid: '', qty: 0, desc: '' };
  page.innerHTML =
    '<div class="page-head"><div><h1>درخواست جابه‌جایی</h1></div></div>' +
    '<div class="widget" style="max-width:760px;margin:0 auto">' +
      '<div class="wiz-steps">' +
        '<div class="wiz-line"><div class="wiz-fill" id="wiz-fill"></div></div>' +
        '<div class="wiz-step active" data-step="1"><div class="num">۱</div><div class="lbl">مسیر</div></div>' +
        '<div class="wiz-step" data-step="2"><div class="num">۲</div><div class="lbl">کالا</div></div>' +
        '<div class="wiz-step" data-step="3"><div class="num">۳</div><div class="lbl">تأیید</div></div>' +
      '</div>' +
      '<div id="wiz-body"></div>' +
      '<div style="display:flex;gap:10px;margin-top:22px;justify-content:space-between">' +
        '<button class="btn ghost" id="wiz-back">قبلی</button>' +
        '<button class="btn primary" id="wiz-next">بعدی</button>' +
      '</div>' +
    '</div>';
  function updateSteps() {
    $$('.wiz-step').forEach(function(el) {
      var s = +el.dataset.step;
      el.classList.toggle('active', s === state.step);
      el.classList.toggle('done', s < state.step);
    });
    $('#wiz-fill').style.width = ((state.step - 1) / 2 * 100) + '%';
  }
  function draw() {
    updateSteps();
    var body = $('#wiz-body'); var back = $('#wiz-back'); var next = $('#wiz-next');
    back.style.visibility = state.step === 1 ? 'hidden' : 'visible';
    next.innerHTML = state.step === 3 ? (IC.check + ' ثبت نهایی') : ('بعدی ' + IC.arrowL);
    if (state.step === 1) {
      var srcW = null;
      for (var i = 0; i < sources.length; i++) if (sources[i].id === state.src) { srcW = sources[i]; break; }
      var allowed = state.src ? allowedDest(srcW && srcW.type) : [];
      var dests = db.warehouses.filter(function(w) { return allowed.indexOf(w.type) >= 0; });
      body.innerHTML = '<div class="form-grid">' +
        '<div class="field"><label>انبار مبدأ <span class="req">*</span></label><select id="w-src"><option value="">انتخاب...</option>' + sources.map(function(w) { return '<option value="' + w.id + '" ' + (state.src === w.id ? 'selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label>انبار مقصد <span class="req">*</span></label><select id="w-dst" ' + (!state.src ? 'disabled' : '') + '><option value="">' + (state.src ? 'انتخاب...' : 'ابتدا مبدأ') + '</option>' + dests.map(function(w) { return '<option value="' + w.id + '" ' + (state.dst === w.id ? 'selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') + '</select></div>' +
      '</div>' +
      '<div style="margin-top:16px" class="muted small">مسیر مجاز: مرکزی ← رنگ‌کاری ← رویه‌کوبی ← فروشگاه/مشتری</div>';
      $('#w-src').addEventListener('change', function(e) { state.src = e.target.value; state.dst = ''; draw(); });
      $('#w-dst').addEventListener('change', function(e) { state.dst = e.target.value; });
    } else if (state.step === 2) {
      var stock = findStock(db, state.pid, state.src);
      var avail = stock ? stock.quantity - (stock.reservedQty || 0) : 0;
      body.innerHTML = '<div class="form-grid">' +
        '<div class="field"><label>کالا <span class="req">*</span></label><select id="w-pid"><option value="">انتخاب...</option>' + db.products.map(function(p) { return '<option value="' + p.id + '" ' + (state.pid === p.id ? 'selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label>تعداد <span class="req">*</span></label><input id="w-qty" type="number" min="1" value="' + (state.qty || '') + '" /></div>' +
        '<div class="full field"><label>توضیحات</label><textarea id="w-desc">' + esc(state.desc) + '</textarea></div>' +
        (state.pid && state.src ? '<div class="full"><div style="padding:14px 18px;background:var(--grad-soft);border-radius:20px;font-size:12.5px">موجودی قابل استفاده: <b style="color:#007AFF;font-size:16px">' + avail + '</b></div></div>' : '') +
      '</div>';
      $('#w-pid').addEventListener('change', function(e) { state.pid = e.target.value; state.qty = 0; draw(); });
      $('#w-qty').addEventListener('input', function(e) { state.qty = +e.target.value; });
      $('#w-desc').addEventListener('input', function(e) { state.desc = e.target.value; });
    } else {
      var srcW2 = getWh(db, state.src); var dstW = getWh(db, state.dst); var p2 = getProd(db, state.pid);
      body.innerHTML = '<div class="dl" style="grid-template-columns:1fr 1fr;display:grid;gap:1px">' +
        '<div class="dl-item"><div class="k">مبدأ</div><div class="v">' + esc((srcW2 && srcW2.name) || '') + '</div></div>' +
        '<div class="dl-item"><div class="k">مقصد</div><div class="v">' + esc((dstW && dstW.name) || '') + '</div></div>' +
        '<div class="dl-item"><div class="k">کالا</div><div class="v">' + esc((p2 && p2.name) || '') + '</div></div>' +
        '<div class="dl-item"><div class="k">تعداد</div><div class="v">' + state.qty + '</div></div>' +
      '</div>' +
      '<div style="margin-top:16px" class="muted small">' + IC.info + ' پس از ثبت، درخواست در انتظار تأیید انباردار قرار می‌گیرد.</div>';
    }
  }
  $('#wiz-back').addEventListener('click', function() { if (state.step > 1) { state.step--; draw(); } });
  $('#wiz-next').addEventListener('click', function() {
    if (state.step === 1) {
      if (!state.src || !state.dst) { celebrate('اطلاعات ناقص', 'مبدأ و مقصد را انتخاب کنید', 'warn', 1600); return; }
      state.step = 2; draw();
    } else if (state.step === 2) {
      if (!state.pid || !state.qty || state.qty <= 0) { celebrate('اطلاعات ناقص', 'کالا و تعداد را وارد کنید', 'warn', 1600); return; }
      var stock = findStock(db, state.pid, state.src);
      var avail = stock ? stock.quantity - (stock.reservedQty || 0) : 0;
      if (state.qty > avail) { celebrate('موجودی کافی نیست', 'قابل استفاده: ' + avail, 'error', 1900); return; }
      state.step = 3; draw();
    } else {
      var btn = $('#wiz-next'); btn.classList.add('loading');
      setTimeout(function() {
        try {
          var fresh = loadDB();
          var srcStock = findStock(fresh, state.pid, state.src);
          if (!srcStock) { btn.classList.remove('loading'); celebrate('کالا یافت نشد', '', 'error', 1600); return; }
          var avail2 = srcStock.quantity - (srcStock.reservedQty || 0);
          if (state.qty > avail2) { btn.classList.remove('loading'); celebrate('موجودی کافی نیست', '', 'error', 1800); return; }
          srcStock.reservedQty = (srcStock.reservedQty || 0) + state.qty;
          srcStock.updatedAt = new Date().toISOString();
          var dstW = getWh(fresh, state.dst);
          var t = {
            id: uid(),
            code: tcode(fresh),
            type: dstW.type === 'customer' ? 'direct-customer' : 'warehouse',
            sourceWarehouseId: state.src,
            destinationWarehouseId: state.dst,
            productId: state.pid,
            quantity: state.qty,
            description: state.desc,
            status: 'pending_warehouse',
            createdBy: App.user.id,
            createdByName: App.user.name,
            createdAt: new Date().toISOString()
          };
          fresh.transfers.unshift(t);
          saveDB(fresh);
          celebrate('ثبت شد', 'در انتظار تأیید انباردار', 'success', 1900);
          go('transfers');
        } catch(err) { btn.classList.remove('loading'); celebrate('خطا', err.message || '', 'error', 2000); }
      }, 400);
    }
  });
  draw();
  attachRippleAll();
}

          db.products.map(function(p, i) {
            return '<tr><td><span class="row-num">' + (i + 1) + '</span></td><td><b style="color:var(--text)">' + esc(p.name) + '</b></td><td>' + (p.code ? '<span class="code-chip">' + esc(p.code) + '</span>' : '—') + '</td><td>' + esc(p.unit || '—') + '</td><td class="date-cell col-sm-hide">' + faDate(p.createdAt) + '</td><td class="actions-cell"><button class="btn xs danger" data-del="' + p.id + '">' + IC.trash + '</button></td></tr>';
          }).join('') + '</tbody></table>'
        : '<div class="table-empty">' + IC.inbox + '<b>کالایی ثبت نشده</b></div>') +
    '</div></div>';
  $('#pf').addEventListener('submit', function(e) {
    e.preventDefault();
    var name = $('#pn').value.trim(); var code = $('#pc').value.trim(); var unit = $('#pu').value.trim() || 'دست';
    if (!name) return;
    var fresh = loadDB();
    if (findProductByName(fresh, name)) { celebrate('تکراری', 'این کالا قبلاً ثبت شده', 'warn', 1800); return; }
    fresh.products.push({ id: uid(), name: name, code: code, unit: unit, createdAt: new Date().toISOString() });
    saveDB(fresh);
    celebrate('افزوده شد', '', 'success', 1700);
    render();
  });
  $$('[data-del]').forEach(function(b) {
    b.addEventListener('click', function() {
      var id = b.dataset.del;
      var fresh = loadDB();
      var used = fresh.stocks.some(function(s) { return s.productId === id && s.quantity > 0; }) || fresh.transfers.some(function(t) { return t.productId === id; });
      if (used) { celebrate('قابل حذف نیست', 'این کالا در موجودی یا انتقال‌ها استفاده شده', 'error', 2000); return; }
      fresh.products = fresh.products.filter(function(p) { return p.id !== id; });
      fresh.stocks = fresh.stocks.filter(function(s) { return s.productId !== id; });
      saveDB(fresh);
      celebrate('حذف شد', '', 'success', 1600);
      render();
    });
  });
  attachRippleAll();
}

function pageUsers(page) {
  var db = loadDB();
  var canEdit = canManageUsers(App.user);
  var assignable = App.user.role === 'admin'
    ? ['warehouse_officer', 'accountant', 'manager', 'admin']
    : ['warehouse_officer', 'accountant', 'manager'];
  page.innerHTML =
    '<div class="page-head"><div><h1>کاربران</h1><div class="sub">' + (canEdit ? 'مدیریت کاربران و تعیین دسترسی' : 'لیست کاربران') + '</div></div></div>' +
    (canEdit ? '<div class="widget" style="margin-bottom:16px;max-width:900px"><form id="uf" class="form-grid">' +
      '<div class="field"><label>نام و نام خانوادگی <span class="req">*</span></label><input id="un" required placeholder="محمد احمدی" /></div>' +
      '<div class="field"><label>نام کاربری <span class="req">*</span></label><input id="uu" required placeholder="m.ahmadi" style="font-family:monospace;direction:ltr;text-align:left" /></div>' +
      '<div class="field"><label>رمز عبور <span class="req">*</span></label><input id="up" required type="password" /></div>' +
      '<div class="field"><label>نقش و دسترسی</label><select id="ur">' + assignable.map(function(r) { return '<option value="' + r + '">' + ROLES[r] + '</option>'; }).join('') + '</select></div>' +
      '<div class="field" style="grid-column:1/-1;flex-direction:row;justify-content:flex-end"><button class="btn primary" type="submit">' + IC.plus + ' افزودن کاربر</button></div>' +
    '</form></div>' : '') +
    '<div class="table-card"><div class="table-toolbar"><div class="w-title" style="font-size:13.5px"><div class="ic">' + IC.users + '</div>کاربران سیستم</div><span style="margin-right:auto;font-size:12px;color:var(--muted)"><b style="color:var(--text-2)">' + db.users.filter(function(u) { return u.isActive; }).length + '</b> فعال · ' + db.users.length + ' کل</span></div><div class="table-scroll">' +
      '<table class="dt"><thead><tr><th>#</th><th>کاربر</th><th>نام کاربری</th><th>نقش و دسترسی</th><th>وضعیت</th><th></th></tr></thead><tbody>' +
        db.users.map(function(u, i) {
          var isSelf = u.id === App.user.id;
          var editable = canEditUser(u);
          var roleCell = editable
            ? '<select class="role-select" data-role="' + u.id + '">' + assignable.map(function(r) { return '<option value="' + r + '" ' + (u.role === r ? 'selected' : '') + '>' + ROLES[r] + '</option>'; }).join('') + '</select>'
            : '<span class="role-badge ' + u.role + '">' + ROLES[u.role] + '</span>';
          var actionCell = isSelf
            ? '<span class="muted small">—</span>'
            : (editable
              ? '<button class="btn xs ' + (u.isActive ? 'warn' : 'success') + '" data-tog="' + u.id + '">' + (u.isActive ? 'غیرفعال' : 'فعال') + '</button>'
              : '<span class="muted small">—</span>');
          return '<tr><td><span class="row-num">' + (i + 1) + '</span></td>' +
            '<td><div class="user-cell"><div class="avatar-sm">' + esc(initials(u.name)) + '</div><div class="info"><b>' + esc(u.name) + '</b><span>' + (isSelf ? 'خودتان' : (u.isActive ? 'فعال' : 'غیرفعال')) + '</span></div></div></td>' +
            '<td><span class="code-chip">' + esc(u.username) + '</span></td>' +
            '<td>' + roleCell + '</td>' +
            '<td>' + (u.isActive ? '<span class="status-pill on"><span class="dot"></span>فعال</span>' : '<span class="status-pill off"><span class="dot"></span>غیرفعال</span>') + '</td>' +
            '<td class="actions-cell">' + actionCell + '</td></tr>';
        }).join('') +
      '</tbody></table>' +
    '</div></div>';

  if (canEdit) {
    $('#uf').addEventListener('submit', function(e) {
      e.preventDefault();
      var name = $('#un').value.trim();
      var username = $('#uu').value.trim();
      var password = $('#up').value;
      var role = $('#ur').value;
      if (!name || !username || !password) return;
      if (!canAssignRole(role)) { celebrate('دسترسی ندارید', 'این نقش قابل تخصیص نیست', 'error', 1800); return; }
      var fresh = loadDB();
      if (fresh.users.some(function(u) { return u.username === username; })) {
        celebrate('تکراری', 'این نام کاربری قبلاً استفاده شده', 'error', 1900);
        return;
      }
      fresh.users.push({ id: uid(), name: name, username: username, password: password, role: role, isActive: true });
      saveDB(fresh);
      celebrate('افزوده شد', '«' + name + '» — ' + ROLES[role], 'success', 1800);
      render();
    });
  }

  $$('[data-tog]').forEach(function(b) {
    b.addEventListener('click', function() {
      var fresh = loadDB();
      var u = fresh.users.filter(function(x) { return x.id === b.dataset.tog; })[0];
      if (!u) return;
      if (!canEditUser(u)) { celebrate('دسترسی ندارید', '', 'error', 1600); render(); return; }
      u.isActive = !u.isActive;
      saveDB(fresh);
      celebrate(u.isActive ? 'فعال شد' : 'غیرفعال شد', u.name, 'success', 1500);
      render();
    });
  });

  $$('[data-role]').forEach(function(sel) {
    sel.addEventListener('change', function() {
      var fresh = loadDB();
      var u = fresh.users.filter(function(x) { return x.id === sel.dataset.role; })[0];
      if (!u) return;
      if (!canEditUser(u)) { celebrate('دسترسی ندارید', '', 'error', 1600); render(); return; }
      var newRole = sel.value;
      if (!canAssignRole(newRole)) { celebrate('دسترسی ندارید', 'این نقش قابل تخصیص نیست', 'error', 1800); render(); return; }
      u.role = newRole;
      saveDB(fresh);
      celebrate('دسترسی تغییر کرد', u.name + ' → ' + ROLES[u.role], 'success', 1700);
      render();
    });
  });

  attachRippleAll();
}

document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); }
  if (e.key === 'Escape') {
    closeCmd(); closeDrawer(); closeNotif(); closeSheet();
    var m = document.querySelector('.modal-bd'); if (m) m.remove();
    var um = document.querySelector('.userm'); if (um) um.remove();
    $$('.celebrate').forEach(function(el) { el.remove(); });
  }
  if (!e.target.matches('input,textarea,select') && !e.metaKey && !e.ctrlKey && App.user) {
    var map = { '1': 'dashboard', '2': 'stock', '3': 'transfers', '4': 'inbounds' };
    if (map[e.key] && NAV.filter(function(n) { return n.key === map[e.key] && n.roles.indexOf(App.user.role) >= 0; }).length) go(map[e.key]);
  }
});

/* ===== BOOT ===== */
try {
  // 1) Splash FIRST (before anything renders)
  showSplash();

  // 2) PWA
  try { PWA.init(); } catch(e) {}

  // 3) App state
  App.user = currentUser();
  if (App.user) App.route = restoreRoute();
  else App.route = { name: 'dashboard', params: {} };

  // 4) Render app behind splash
  render();
} catch(err) {
  var ee = document.getElementById('err');
  if (ee) { ee.style.display = 'block'; ee.textContent = 'BOOT ERROR: ' + (err.message || err) + '\n' + (err.stack || ''); }
}
})();
</script>
</body>
</html>
