function openTransferDrawer(id){
  const db=loadDB();
  const t=db.transfers.find(x=>x.id===id);
  if(!t)return celebrate('درخواست یافت نشد','','error',1600);
  const src=getWh(db,t.sourceWarehouseId),dst=getWh(db,t.destinationWarehouseId),p=getProd(db,t.productId);
  const st=STATUS[t.status];
  const steps=[
    {title:'ثبت درخواست',done:true,at:t.createdAt,user:t.createdByName,icon:IC.plus},
    {title:'تأیید مسئول انبار',step:t.warehouseApproval,key:'warehouse',icon:IC.package},
    {title:'تأیید حسابدار',step:t.accountantApproval,key:'accountant',icon:IC.shield},
    {title:'تأیید مدیر',step:t.managerApproval,key:'manager',icon:IC.users},
    {title:'انتقال قطعی',done:!!t.completedAt,at:t.completedAt,icon:IC.check}
  ];
  const rMap={warehouse:1,accountant:2,manager:3};
  const rStep=t.rejection?rMap[t.rejection.stage]:-1;
  const tlHTML=steps.map((s,i)=>{
    let cls='';
    if(i===0||i===4){cls=s.done?'done':''}else{if(s.step)cls='done';else if(i===rStep)cls='rejected';else if(i===(st.step-1))cls='active'}
    const meta=[];
    if(s.at)meta.push(`<b>${esc(s.user||'')}</b> · ${faDate(s.at)}`);
    if(s.step)meta.push(`<b>${esc(s.step.userName)}</b> · ${faDate(s.step.at)}`);
    if(i===rStep&&t.rejection)meta.push(`<span style="color:var(--ios-red)">رد شد توسط <b>${esc(t.rejection.userName)}</b><br>دلیل: ${esc(t.rejection.reason)}<br>${faDate(t.rejection.at)}</span>`);
    const icon=cls==='done'?IC.check:cls==='rejected'?IC.x:cls==='active'?IC.clock:s.icon;
    return `<li class="${cls}"><div class="tl-node">${icon}</div><div class="tl-title">${s.title}</div>${meta.length?`<div class="tl-meta">${meta.join('<br>')}</div>`:''}</li>`;
  }).join('');
  const body=`
    <div class="dl" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));display:grid;gap:1px;margin-bottom:16px">
      <div class="dl-item"><div class="k">وضعیت</div><div class="v"><span class="badge ${st.tone}"><span class="dot"></span>${st.label}</span></div></div>
      <div class="dl-item"><div class="k">نوع</div><div class="v">${t.type==='direct-customer'?'ارسال مستقیم':'انتقال انبار'}</div></div>
      <div class="dl-item"><div class="k">مبدأ</div><div class="v">${esc(src?.name||'—')}</div></div>
      <div class="dl-item"><div class="k">مقصد</div><div class="v">${esc(dst?.name||'—')}</div></div>
      <div class="dl-item"><div class="k">کالا</div><div class="v">${esc(p?.name||'—')}</div></div>
      <div class="dl-item"><div class="k">تعداد</div><div class="v">${t.quantity} ${esc(p?.unit||'')}</div></div>
    </div>
    ${t.customerName?`<div class="dl" style="grid-template-columns:1fr 1fr;display:grid;gap:1px;margin-bottom:16px"><div class="dl-item"><div class="k">مشتری</div><div class="v">${esc(t.customerName)}</div></div><div class="dl-item"><div class="k">تماس</div><div class="v">${esc(t.customerPhone||'—')}</div></div></div>`:''}
    ${t.description?`<div class="dl" style="margin-bottom:16px"><div class="dl-item"><div class="k">توضیحات</div><div class="v" style="font-weight:400">${esc(t.description)}</div></div></div>`:''}
    <div style="font-size:13.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px"><span style="width:4px;height:14px;border-radius:3px;background:var(--grad-brand)"></span>مراحل تأیید</div>
    <ul class="tl">${tlHTML}</ul>`;
  let foot='';
  if(canApprove(State.user,t))foot=`<button class="btn success" id="d-approve" style="flex:1">${IC.check} تأیید</button><button class="btn danger" id="d-reject">${IC.x} رد</button>`;
  else foot=`<div class="muted small" style="text-align:center;width:100%">اقدامی برای شما در دسترس نیست</div>`;
  drawer({title:`<span style="font-family:ui-monospace,monospace;font-size:13px;color:var(--muted)">${esc(t.code)}</span>`,body,foot});
  $('#d-approve')?.addEventListener('click',()=>{closeDrawer();handleApprove(t.id)});
  $('#d-reject')?.addEventListener('click',()=>{closeDrawer();handleReject(t.id)});
}

function handleApprove(id){
  modal({
    title:'تأیید مرحله',desc:'آیا از تأیید این مرحله مطمئن هستید؟',
    body:`<div class="field"><label>یادداشت (اختیاری)</label><textarea id="ap-note" placeholder="…"></textarea></div>`,
    actions:[
      {label:'انصراف',cls:'ghost',onClick:c=>c.remove()},
      {label:`${IC.check} تأیید`,cls:'success',onClick:c=>{
        const btn=c.querySelector('button.success');btn.classList.add('loading');
        const note=$('#ap-note',c).value.trim();
        setTimeout(()=>{
          const db=loadDB();const t=db.transfers.find(x=>x.id===id);
          if(!t)return c.remove();
          if(!canApprove(State.user,t)){c.remove();return celebrate('دسترسی ندارید','شما مجاز به این عملیات نیستید','error',1800)}
          const step={userId:State.user.id,userName:State.user.name,at:new Date().toISOString(),note};
          if(t.status==='pending_warehouse'){t.warehouseApproval=step;t.status='pending_accountant'}
          else if(t.status==='pending_accountant'){t.accountantApproval=step;t.status='pending_manager'}
          else if(t.status==='pending_manager'){
            t.managerApproval=step;
            const srcStock=findStock(db,t.productId,t.sourceWarehouseId);
            if(!srcStock||srcStock.quantity<t.quantity){c.remove();return celebrate('موجودی کافی نیست','امکان تأیید نهایی وجود ندارد','error',2000)}
            srcStock.quantity-=t.quantity;
            srcStock.reservedQty=Math.max(0,(srcStock.reservedQty||0)-t.quantity);
            srcStock.updatedAt=new Date().toISOString();
            const dstW=getWh(db,t.destinationWarehouseId);
            if(dstW&&dstW.type!=='customer'){
              let ds=findStock(db,t.productId,t.destinationWarehouseId);
              if(!ds){ds={id:uid(),productId:t.productId,warehouseId:t.destinationWarehouseId,quantity:0,reservedQty:0,updatedAt:new Date().toISOString()};db.stocks.push(ds)}
              ds.quantity+=t.quantity;ds.updatedAt=new Date().toISOString();
            }
            t.status='approved';t.completedAt=new Date().toISOString();
          }
          saveDB(db);c.remove();
          if(t.status==='approved')celebrate('انتقال قطعی شد ✓','موجودی مبدأ و مقصد به‌روزرسانی شد','success',2200);
          else celebrate('تأیید شد','به مرحله بعد منتقل شد','success',1800);
          render();
        },550);
      }}
    ]
  });
}
function handleReject(id){
  modal({
    title:'رد درخواست',desc:'دلیل رد را وارد کنید — اثری بر موجودی نخواهد داشت.',
    body:`<div class="field"><label>دلیل <span class="req">*</span></label><textarea id="rj-reason" placeholder="…"></textarea></div>`,
    actions:[
      {label:'انصراف',cls:'ghost',onClick:c=>c.remove()},
      {label:`${IC.x} ثبت رد`,cls:'danger',onClick:c=>{
        const reason=$('#rj-reason',c).value.trim();
        if(!reason)return celebrate('دلیل الزامی است','لطفاً دلیل رد را وارد کنید','warn',1600);
        const btn=c.querySelector('button.danger');btn.classList.add('loading');
        setTimeout(()=>{
          const db=loadDB();const t=db.transfers.find(x=>x.id===id);
          if(!t)return c.remove();
          if(!canApprove(State.user,t)){c.remove();return celebrate('دسترسی ندارید','','error',1800)}
          const stage={pending_warehouse:'warehouse',pending_accountant:'accountant',pending_manager:'manager'}[t.status];
          const srcStock=findStock(db,t.productId,t.sourceWarehouseId);
          if(srcStock){srcStock.reservedQty=Math.max(0,(srcStock.reservedQty||0)-t.quantity);srcStock.updatedAt=new Date().toISOString()}
          t.rejection={userId:State.user.id,userName:State.user.name,at:new Date().toISOString(),reason,stage};
          t.status='rejected';
          saveDB(db);c.remove();
          celebrate('درخواست رد شد','رزرو موجودی آزاد شد','error',2000);
          render();
        },500);
      }}
    ]
  });
}

function pageNewTransfer(page){
  const db=loadDB();
  const sources=db.warehouses.filter(w=>['central','paint','upholstery'].includes(w.type));
  const state={step:1,src:'',dst:'',pid:'',qty:0,desc:''};
  const updateSteps=()=>{$$('.wiz-step').forEach((el,i)=>{el.classList.toggle('active',i+1===state.step);el.classList.toggle('done',i+1<state.step)});$('.wiz-line-fill').style.width=`${((state.step-1)/2)*100}%`};
  page.innerHTML=`
    <div class="page-head"><div><h1>درخواست جابه‌جایی</h1><div class="sub">انتقال کالا با سه مرحله تأیید</div></div></div>
    <div class="widget" style="max-width:760px;margin:0 auto">
      <div class="wiz-steps">
        <div class="wiz-line"><div class="wiz-line-fill"></div></div>
        <div class="wiz-step active"><div class="num">۱</div><div class="lbl">مسیر</div></div>
        <div class="wiz-step"><div class="num">۲</div><div class="lbl">کالا و تعداد</div></div>
        <div class="wiz-step"><div class="num">۳</div><div class="lbl">تأیید نهایی</div></div>
      </div>
      <div id="wiz-body"></div>
      <div style="display:flex;gap:10px;margin-top:22px;justify-content:space-between">
        <button class="btn ghost" id="wiz-back">${IC.arrowR} قبلی</button>
        <button class="btn primary" id="wiz-next">بعدی ${IC.arrowL}</button>
      </div>
    </div>`;
  function draw(){
    updateSteps();
    const body=$('#wiz-body'),back=$('#wiz-back'),next=$('#wiz-next');
    back.style.visibility=state.step===1?'hidden':'visible';
    next.innerHTML=state.step===3?`${IC.check} ثبت نهایی`:`بعدی ${IC.arrowL}`;
    if(state.step===1){
      const allowed=state.src?allowedDest(sources.find(w=>w.id===state.src)?.type):[];
      const dests=db.warehouses.filter(w=>allowed.includes(w.type));
      body.innerHTML=`<div class="form-grid">
        <div class="field"><label>انبار مبدأ <span class="req">*</span></label><select id="w-src"><option value="">انتخاب کنید…</option>${sources.map(w=>`<option value="${w.id}" ${state.src===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>
        <div class="field"><label>انبار مقصد <span class="req">*</span></label><select id="w-dst" ${!state.src?'disabled':''}><option value="">${state.src?'انتخاب کنید…':'ابتدا مبدأ'}</option>${dests.map(w=>`<option value="${w.id}" ${state.dst===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>
      </div>
      <div style="margin-top:16px" class="muted small">مسیر مجاز: مرکزی ← رنگ‌کاری ← رویه‌کوبی ← فروشگاه</div>`;
      $('#w-src').addEventListener('change',e=>{state.src=e.target.value;state.dst='';draw()});
      $('#w-dst').addEventListener('change',e=>{state.dst=e.target.value});
    }else if(state.step===2){
      const stock=findStock(db,state.pid,state.src);
      const avail=stock?stock.quantity-(stock.reservedQty||0):0;
      body.innerHTML=`<div class="form-grid">
        <div class="field"><label>کالا <span class="req">*</span></label><select id="w-pid"><option value="">انتخاب کنید…</option>${db.products.map(p=>`<option value="${p.id}" ${state.pid===p.id?'selected':''}>${esc(p.name)}${p.code?' — '+esc(p.code):''}</option>`).join('')}</select></div>
        <div class="field"><label>تعداد <span class="req">*</span></label><input id="w-qty" type="number" min="1" step="1" value="${state.qty||''}" placeholder="0" /></div>
        <div class="full field"><label>توضیحات</label><textarea id="w-desc" placeholder="…">${esc(state.desc)}</textarea></div>
        ${state.pid&&state.src?`<div class="full"><div style="padding:14px 18px;background:var(--grad-brand-soft);border:1px solid rgba(0,122,255,.2);border-radius:20px;font-size:12.5px">موجودی قابل استفاده: <b style="color:var(--brand-1);font-size:16px">${avail}</b> <span class="muted">(کل ${stock?.quantity||0} — رزرو ${stock?.reservedQty||0})</span></div></div>`:''}
      </div>`;
      $('#w-pid').addEventListener('change',e=>{state.pid=e.target.value;state.qty=0;draw()});
      $('#w-qty').addEventListener('input',e=>{state.qty=+e.target.value});
      $('#w-desc').addEventListener('input',e=>{state.desc=e.target.value});
    }else{
      const srcW=getWh(db,state.src),dstW=getWh(db,state.dst),p=getProd(db,state.pid);
      body.innerHTML=`<div class="dl" style="grid-template-columns:1fr 1fr;display:grid;gap:1px">
        <div class="dl-item"><div class="k">مبدأ</div><div class="v">${esc(srcW?.name||'')}</div></div>
        <div class="dl-item"><div class="k">مقصد</div><div class="v">${esc(dstW?.name||'')}</div></div>
        <div class="dl-item"><div class="k">کالا</div><div class="v">${esc(p?.name||'')}</div></div>
        <div class="dl-item"><div class="k">تعداد</div><div class="v">${state.qty} ${esc(p?.unit||'')}</div></div>
        ${state.desc?`<div class="dl-item" style="grid-column:1/-1"><div class="k">توضیحات</div><div class="v" style="font-weight:400">${esc(state.desc)}</div></div>`:''}
      </div>
      <div style="height:1px;background:var(--border);margin:16px 0"></div>
      <div class="row" style="gap:10px;font-size:12.5px;color:var(--muted)">${IC.info}<span>پس از ثبت، درخواست در انتظار تأیید مسئول انبار قرار می‌گیرد.</span></div>`;
    }
  }
  $('#wiz-back').addEventListener('click',()=>{if(state.step>1){state.step--;draw()}});
  $('#wiz-next').addEventListener('click',()=>{
    if(state.step===1){
      if(!state.src||!state.dst)return celebrate('اطلاعات ناقص','ابتدا مبدأ و مقصد را انتخاب کنید','warn',1600);
      state.step=2;draw();
    }else if(state.step===2){
      if(!state.pid||!state.qty||state.qty<=0)return celebrate('اطلاعات ناقص','کالا و تعداد را وارد کنید','warn',1600);
      const stock=findStock(db,state.pid,state.src);
      const avail=stock?stock.quantity-(stock.reservedQty||0):0;
      if(state.qty>avail)return celebrate('موجودی کافی نیست',`قابل استفاده: ${avail}`,'error',1900);
      state.step=3;draw();
    }else{
      const btn=$('#wiz-next');btn.classList.add('loading');
      setTimeout(()=>{
        const fresh=loadDB();const srcStock=findStock(fresh,state.pid,state.src);
        if(!srcStock){btn.classList.remove('loading');return celebrate('کالا یافت نشد','','error',1600)}
        const avail=srcStock.quantity-(srcStock.reservedQty||0);
        if(state.qty>avail){btn.classList.remove('loading');return celebrate('موجودی کافی نیست','','error',1800)}
        srcStock.reservedQty=(srcStock.reservedQty||0)+state.qty;
        srcStock.updatedAt=new Date().toISOString();
        const dstW=getWh(fresh,state.dst);
        const t={id:uid(),code:tcode(fresh),type:dstW.type==='customer'?'direct-customer':'warehouse',sourceWarehouseId:state.src,destinationWarehouseId:state.dst,productId:state.pid,quantity:state.qty,description:state.desc,status:'pending_warehouse',createdBy:State.user.id,createdByName:State.user.name,createdAt:new Date().toISOString()};
        fresh.transfers.unshift(t);saveDB(fresh);
        celebrate('درخواست ثبت شد','در انتظار تأیید مسئول انبار','success',1900);
        navigate('transfers');
      },550);
    }
  });
  draw();
  attachRippleAll();
}

  const upd=()=>{const pid=$('#dp').value,box=$('#dav');if(!pid){box.innerHTML='';return}const s=findStock(db,pid,uph.id);if(!s){box.innerHTML=`<div style="padding:14px 18px;background:rgba(255,59,48,.1);border:1px solid rgba(255,59,48,.22);border-radius:20px;color:var(--ios-red);font-size:12.5px">این کالا در رویه‌کوبی موجود نیست</div>`;return}const avail=s.quantity-(s.reservedQty||0);box.innerHTML=`<div style="padding:14px 18px;background:var(--grad-brand-soft);border:1px solid rgba(0,122,255,.2);border-radius:20px;font-size:12.5px">موجودی قابل استفاده: <b style="color:var(--brand-1);font-size:16px">${avail}</b></div>`};
  $('#dp').addEventListener('change',upd);
  $('#dcf').addEventListener('submit',e=>{
    e.preventDefault();
    const pid=$('#dp').value,qty=+$('#dq').value,name=$('#dn').value.trim(),phone=$('#dph').value.trim(),desc=$('#dd').value.trim();
    if(!pid||!qty||qty<=0||!name)return celebrate('اطلاعات ناقص','همه فیلدهای لازم را پر کنید','warn',1600);
    const fresh=loadDB();
    const customer=fresh.warehouses.find(w=>w.type==='customer'),uphW=fresh.warehouses.find(w=>w.type==='upholstery');
    const s=findStock(fresh,pid,uphW.id);
    const avail=s?s.quantity-(s.reservedQty||0):0;
    if(!s||qty>avail)return celebrate('موجودی کافی نیست',`قابل استفاده: ${avail}`,'error',1900);
    s.reservedQty=(s.reservedQty||0)+qty;s.updatedAt=new Date().toISOString();
    const t={id:uid(),code:tcode(fresh),type:'direct-customer',sourceWarehouseId:uphW.id,destinationWarehouseId:customer.id,productId:pid,quantity:qty,customerName:name,customerPhone:phone,description:desc,status:'pending_warehouse',createdBy:State.user.id,createdByName:State.user.name,createdAt:new Date().toISOString()};
    fresh.transfers.unshift(t);saveDB(fresh);
    celebrate('درخواست ارسال ثبت شد','در انتظار تأیید مسئول انبار','success',1900);
    navigate('transfers');
  });
  attachRippleAll();
}

function pageProducts(page){
  const db=loadDB();
  page.innerHTML=`
    <div class="page-head"><div><h1>کالاها</h1><div class="sub">تعریف و مدیریت کالاهای سیستم</div></div></div>
    <div class="widget" style="margin-bottom:16px;max-width:840px">
      <div class="w-head"><div><div class="w-title"><div class="ic">${IC.plus}</div>افزودن کالا</div><div class="w-sub">اطلاعات کالای جدید را وارد کنید</div></div></div>
      <form id="pf" class="form-grid">
        <div class="field"><label>نام کالا <span class="req">*</span></label><input id="pn" required placeholder="مبل مدل D" /></div>
        <div class="field"><label>کد کالا</label><input id="pc" placeholder="MB-D" style="font-family:ui-monospace,monospace;direction:ltr;text-align:left" /></div>
        <div class="field"><label>واحد</label><input id="pu" value="دست" /></div>
        <div class="field" style="grid-column:1/-1;flex-direction:row;justify-content:flex-end;gap:10px">
          <button class="btn primary" type="submit">${IC.plus} افزودن کالا</button>
        </div>
      </form>
    </div>
    <div class="table-card">
      <div class="table-toolbar">
        <div style="display:flex;align-items:center;gap:8px"><div class="w-title" style="font-size:13.5px"><div class="ic">${IC.tag}</div>لیست کالاها</div></div>
        <span style="margin-right:auto;font-size:12px;color:var(--muted)"><b style="color:var(--text-2)">${db.products.length}</b> کالا</span>
      </div>
      <div class="table-scroll">
        ${db.products.length?`
          <table class="data-table">
            <thead>
              <tr><th style="width:50px">#</th><th style="width:38%">نام کالا</th><th style="width:18%">کد</th><th style="width:14%">واحد</th><th style="width:20%" class="col-sm-hide">تاریخ ثبت</th><th style="width:60px"></th></tr>
            </thead>
            <tbody>
              ${db.products.map((p,i)=>`
                <tr>
                  <td><span class="row-num">${i+1}</span></td>
                  <td><b style="color:var(--text);font-weight:700">${esc(p.name)}</b></td>
                  <td>${p.code?`<span class="code-chip">${esc(p.code)}</span>`:`<span class="muted small">—</span>`}</td>
                  <td>${esc(p.unit||'—')}</td>
                  <td class="date-cell col-sm-hide">${faDate(p.createdAt)}</td>
                  <td class="actions-cell"><button class="btn xs danger" data-del="${p.id}" title="حذف">${IC.trash}</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `:`<div class="table-empty">${IC.inbox}<b>کالایی ثبت نشده</b><p>با فرم بالا اولین کالا را اضافه کنید</p></div>`}
      </div>
      ${db.products.length?`<div class="table-foot"><span>نمایش <b>${db.products.length}</b> کالا</span></div>`:''}
    </div>`;
  $('#pf').addEventListener('submit',e=>{
    e.preventDefault();
    const name=$('#pn').value.trim(),code=$('#pc').value.trim(),unit=$('#pu').value.trim()||'دست';
    if(!name)return;
    const fresh=loadDB();
    fresh.products.push({id:uid(),name,code,unit,createdAt:new Date().toISOString()});
    saveDB(fresh);celebrate('کالا افزوده شد',`«${name}» به لیست اضافه شد`,'success',1700);render();
  });
  $$('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.del;const fresh=loadDB();
    const used=fresh.stocks.some(s=>s.productId===id&&s.quantity>0)||fresh.transfers.some(t=>t.productId===id);
    if(used)return celebrate('قابل حذف نیست','این کالا در موجودی یا انتقال‌ها استفاده شده','error',2000);
    modal({title:'حذف کالا',desc:'آیا مطمئنید؟ این عملیات قابل بازگشت نیست.',actions:[
      {label:'انصراف',cls:'ghost',onClick:c=>c.remove()},
      {label:'حذف',cls:'danger',onClick:c=>{const f=loadDB();f.products=f.products.filter(p=>p.id!==id);f.stocks=f.stocks.filter(s=>s.productId!==id);saveDB(f);c.remove();celebrate('کالا حذف شد','','success',1600);render()}}
    ]});
  }));
  attachRippleAll();
}

function pageUsers(page){
  const db=loadDB();
  page.innerHTML=`
    <div class="page-head"><div><h1>کاربران</h1><div class="sub">مدیریت کاربران و نقش‌های سیستم</div></div></div>
    <div class="widget" style="margin-bottom:16px;max-width:900px">
      <div class="w-head"><div><div class="w-title"><div class="ic">${IC.plus}</div>افزودن کاربر</div><div class="w-sub">کاربر جدید با نقش و دسترسی مشخص</div></div></div>
      <form id="uf" class="form-grid">
        <div class="field"><label>نام و نام خانوادگی <span class="req">*</span></label><input id="un" required placeholder="مثال: محمد احمدی" /></div>
        <div class="field"><label>نام کاربری <span class="req">*</span></label><input id="uu" required placeholder="m.ahmadi" style="font-family:ui-monospace,monospace;direction:ltr;text-align:left" /></div>
        <div class="field"><label>رمز عبور <span class="req">*</span></label><input id="up" required type="password" placeholder="••••••••" /></div>
        <div class="field"><label>نقش دسترسی</label>
          <select id="ur">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
        </div>
        <div class="field" style="grid-column:1/-1;flex-direction:row;justify-content:flex-end;gap:10px">
          <button class="btn primary" type="submit">${IC.plus} افزودن کاربر</button>
        </div>
      </form>
    </div>
    <div class="table-card">
      <div class="table-toolbar">
        <div style="display:flex;align-items:center;gap:8px"><div class="w-title" style="font-size:13.5px"><div class="ic">${IC.users}</div>لیست کاربران</div></div>
        <span style="margin-right:auto;font-size:12px;color:var(--muted)"><b style="color:var(--text-2)">${db.users.filter(u=>u.isActive).length}</b> فعال · ${db.users.length} کل</span>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr><th style="width:50px">#</th><th style="width:32%">کاربر</th><th style="width:20%">نام کاربری</th><th style="width:20%">نقش</th><th style="width:14%">وضعیت</th><th style="width:120px"></th></tr>
          </thead>
          <tbody>
            ${db.users.map((u,i)=>`
              <tr>
                <td><span class="row-num">${i+1}</span></td>
                <td><div class="user-cell"><div class="avatar-sm">${esc(initials(u.name))}</div><b>${esc(u.name)}</b></div></td>
                <td><span class="code-chip">${esc(u.username)}</span></td>
                <td>${ROLES[u.role]}</td>
                <td>${u.isActive?`<span class="status-pill on"><span class="dot"></span>فعال</span>`:`<span class="status-pill off"><span class="dot"></span>غیرفعال</span>`}</td>
                <td class="actions-cell">
                  ${u.id===State.user.id?`<span class="muted small">(شما)</span>`:`<button class="btn xs ${u.isActive?'warn':'success'}" data-tog="${u.id}">${u.isActive?'غیرفعال':'فعال'}</button>`}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div class="table-foot"><span>مجموع <b>${db.users.length}</b> کاربر</span><span>شما با نقش <b>${ROLES[State.user.role]}</b> وارد شده‌اید</span></div>
    </div>`;
  $('#uf').addEventListener('submit',e=>{
    e.preventDefault();
    const name=$('#un').value.trim(),username=$('#uu').value.trim(),password=$('#up').value,role=$('#ur').value;
    if(!name||!username||!password)return;
    const fresh=loadDB();
    if(fresh.users.some(u=>u.username===username))return celebrate('نام کاربری تکراری','این نام کاربری قبلاً استفاده شده است','error',1900);
    fresh.users.push({id:uid(),name,username,password,role,isActive:true});
    saveDB(fresh);celebrate('کاربر افزوده شد',`«${name}» به سیستم اضافه شد`,'success',1800);render();
  });
  $$('[data-tog]').forEach(b=>b.addEventListener('click',()=>{
    const fresh=loadDB();const u=fresh.users.find(x=>x.id===b.dataset.tog);
    if(!u)return;u.isActive=!u.isActive;saveDB(fresh);
    celebrate(u.isActive?'کاربر فعال شد':'کاربر غیرفعال شد',u.name,'success',1500);render();
  }));
  attachRippleAll();
}

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd()}
  if(e.key==='Escape'){closeCmd();closeDrawer();document.querySelector('.modal-bd')?.remove();document.querySelector('.mob-nav-bd')?.remove();document.querySelector('.mob-nav')?.remove();$$('.celebrate').forEach(el=>el.remove())}
  if(!e.target.matches('input,textarea,select')&&!e.metaKey&&!e.ctrlKey&&State.user){
    const map={'1':'dashboard','2':'stock','3':'transfers'};
    if(map[e.key]&&NAV.find(n=>n.key===map[e.key]&&n.roles.includes(State.user?.role)))navigate(map[e.key]);
  }
});

render();
</script>
</body>
</html>
