<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Furniture · سیستم مدیریت موجودی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<script>
/* ============================================================
   PWA + Logo (SVG data URI + manifest)
   ============================================================ */
(function(){
  const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#007AFF"/>
        <stop offset="55%" stop-color="#5856D6"/>
        <stop offset="100%" stop-color="#AF52DE"/>
      </linearGradient>
      <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001A33" flood-opacity=".35"/>
      </filter>
    </defs>
    <rect width="512" height="512" rx="112" fill="url(#g)"/>
    <rect x="40" y="40" width="432" height="432" rx="84" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <g filter="url(#s)" transform="translate(96 96) scale(13.3333)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/>
      <path d="M2 13a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-4z"/>
      <path d="M5 19v2"/>
      <path d="M19 19v2"/>
    </g>
  </svg>`;
  const iconUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LOGO_SVG);
  const manifest = {
    name: "Furniture — سیستم مدیریت موجودی",
    short_name: "Furniture",
    description: "مدیریت موجودی و جابه‌جایی مبلمان با سه مرحله تأیید",
    start_url: ".",
    scope: ".",
    display: "standalone",
    orientation: "portrait-primary",
    background_color: "#eef2f9",
    theme_color: "#007AFF",
    lang: "fa",
    dir: "rtl",
    icons: [
      { src: iconUri, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
      { src: iconUri, sizes: "512x512", type: "image/svg+xml", purpose: "any" },
      { src: iconUri, sizes: "any", type: "image/svg+xml", purpose: "maskable" }
    ]
  };
  const manifestUri = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
  document.write(`
    <link rel="icon" type="image/svg+xml" href="${iconUri}">
    <link rel="apple-touch-icon" href="${iconUri}">
    <link rel="mask-icon" href="${iconUri}" color="#007AFF">
    <link rel="manifest" href="${manifestUri}">
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Furniture">
    <meta name="application-name" content="Furniture">
  `);
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ios-blue:#007AFF;--ios-indigo:#5856D6;--ios-purple:#AF52DE;--ios-pink:#FF2D55;
  --ios-red:#FF3B30;--ios-orange:#FF9500;--ios-yellow:#FFCC00;--ios-green:#34C759;
  --ios-teal:#5AC8FA;--ios-mint:#00C7BE;
  --brand-1:#007AFF;--brand-2:#5856D6;--brand-3:#AF52DE;
  --grad-brand:linear-gradient(135deg,#007AFF 0%,#5856D6 55%,#AF52DE 120%);
  --grad-brand-2:linear-gradient(135deg,#007AFF,#5856D6);
  --grad-brand-soft:linear-gradient(135deg,rgba(0,122,255,.15),rgba(175,82,222,.10));
  --grad-success:linear-gradient(135deg,#34C759,#00A14B);
  --grad-warn:linear-gradient(135deg,#FF9500,#E67E00);
  --grad-danger:linear-gradient(135deg,#FF3B30,#D70015);
  --grad-info:linear-gradient(135deg,#5AC8FA,#0EA5E9);
  --glass-1:rgba(255,255,255,0.62);--glass-2:rgba(255,255,255,0.78);--glass-3:rgba(255,255,255,0.9);
  --glass-border:rgba(255,255,255,0.7);--glass-border-2:rgba(255,255,255,0.9);
  --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.95),inset 0 -1px 0 rgba(255,255,255,0.35);
  --glass-shadow:0 8px 32px -8px rgba(15,23,42,0.12),0 2px 8px -2px rgba(15,23,42,0.06);
  --bg:#eef2f9;--surface:#fff;--surface-2:#f6f8fc;--surface-3:#eef1f8;
  --border:rgba(15,23,42,0.08);--border-2:rgba(15,23,42,0.14);
  --text:#0a1220;--text-2:#334155;--muted:#64748b;--muted-2:#94a3b8;
  --ring:rgba(0,122,255,.24);
  --s-1:0 1px 2px rgba(15,23,42,.04);
  --s-2:0 6px 20px -8px rgba(15,23,42,.10),0 2px 6px -2px rgba(15,23,42,.05);
  --s-3:0 18px 40px -14px rgba(15,23,42,.16);
  --s-glow:0 14px 30px -12px rgba(0,122,255,.55);
  --r-xs:8px;--r-sm:11px;--r:14px;--r-md:18px;--r-lg:22px;--r-xl:28px;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --nav:68px;
}
[data-theme="dark"]{
  --glass-1:rgba(30,35,50,0.55);--glass-2:rgba(30,35,50,0.72);--glass-3:rgba(30,35,50,0.88);
  --glass-border:rgba(255,255,255,0.09);--glass-border-2:rgba(255,255,255,0.16);
  --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.08),inset 0 -1px 0 rgba(0,0,0,0.3);
  --glass-shadow:0 8px 32px -8px rgba(0,0,0,0.5);
  --bg:#06070d;--surface:#0f1420;--surface-2:#161d2c;--surface-3:#1e2739;
  --border:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.14);
  --text:#eef2f8;--text-2:#cbd5e1;--muted:#94a3b8;--muted-2:#64748b;
  --ring:rgba(0,122,255,.35);
}
html,body{height:100%}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s var(--ease),color .3s var(--ease)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 12% -10%,rgba(0,122,255,.18),transparent 60%),radial-gradient(800px 500px at 95% 5%,rgba(175,82,222,.16),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(90,200,250,.14),transparent 60%);animation:bgFloat 24s ease-in-out infinite alternate}
@keyframes bgFloat{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-2%,2%) scale(1.05)}}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer}
::selection{background:var(--ios-blue);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(100,116,139,.25);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(100,116,139,.45);background-clip:padding-box}
:focus-visible{outline:2px solid var(--ios-blue);outline-offset:2px;border-radius:8px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes springIn{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes springInBig{0%{opacity:0;transform:scale(.3)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes spinner{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes ring{from{stroke-dasharray:0 999}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes hueRotate{to{filter:hue-rotate(360deg)}}
@keyframes confettiFall{0%{transform:translateY(-20vh) rotate(0);opacity:1}100%{transform:translateY(120vh) rotate(720deg);opacity:0}}
@keyframes circleGrow{0%{transform:scale(0);opacity:0}50%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes circleRing{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes iconDraw{0%{stroke-dashoffset:100}100%{stroke-dashoffset:0}}
@keyframes celebrateExit{to{opacity:0;transform:scale(1.15)}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes ripple{to{transform:scale(3);opacity:0}}

/* ============================================================
   ★ SHOP-OPENING ANIMATION (rolling shutter)
   ============================================================ */
.shop-open-overlay{position:fixed;inset:0;z-index:2000;pointer-events:none;overflow:hidden}
.shop-open-shutter{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 12%,transparent 88%,rgba(0,0,0,.5) 100%),
    repeating-linear-gradient(180deg,
      #2b3556 0px,#2b3556 2px,
      #1f2843 2px,#1f2843 26px,
      #172036 26px,#172036 40px,
      #0c1322 40px,#0c1322 42px);
  box-shadow:
    inset 0 -80px 100px -30px rgba(0,0,0,.65),
    inset 0 30px 50px -15px rgba(0,0,0,.35);
  animation:shutterLift 1s cubic-bezier(.72,0,.28,1) .12s forwards;
  transform-origin:top;will-change:transform;
}
.shop-open-shutter::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(120% 40% at 50% 0%,rgba(255,255,255,.06),transparent 60%),
    radial-gradient(60% 30% at 50% 100%,rgba(255,220,150,.22),transparent 70%);
  pointer-events:none;
}
.shop-open-shutter::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:24px;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.85));
  border-top:1px solid rgba(255,255,255,.1);
  border-bottom:2px solid rgba(255,255,255,.14);
  box-shadow:0 -6px 16px rgba(0,0,0,.55);
}
@keyframes shutterLift{
  0%{transform:translateY(0)}
  15%{transform:translateY(-4%)}
  100%{transform:translateY(-105%)}
}
.shop-open-rail{
  position:absolute;top:0;bottom:0;width:16px;z-index:3;
  background:linear-gradient(90deg,#05080f,#1a2235 45%,#05080f);
  box-shadow:inset 0 0 10px rgba(0,0,0,.9),0 0 20px rgba(0,0,0,.5);
  animation:railFade .45s ease 1.05s forwards;
}
.shop-open-rail.left{left:0}
.shop-open-rail.right{right:0}
@keyframes railFade{to{opacity:0}}
.shop-open-light{
  position:absolute;inset:0;z-index:1;
  background:
    radial-gradient(circle at 50% 60%,rgba(255,224,150,.85) 0%,rgba(255,180,80,.35) 22%,transparent 55%),
    radial-gradient(circle at 50% 50%,rgba(0,122,255,.35) 0%,transparent 62%);
  opacity:0;
  animation:lightBurst 1.5s ease .05s forwards;
}
@keyframes lightBurst{
  0%{opacity:0;transform:scale(.7)}
  25%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.25)}
}
.shop-open-badge{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:2100;text-align:center;color:#fff;pointer-events:none;
  opacity:0;
  animation:badgeReveal 1.2s cubic-bezier(.34,1.56,.64,1) .45s forwards;
  will-change:transform,opacity;
}
.shop-open-badge .logo{
  width:104px;height:104px;border-radius:28px;
  display:grid;place-items:center;margin:0 auto 20px;
  background:linear-gradient(135deg,#007AFF 0%,#5856D6 55%,#AF52DE 120%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.55),
    inset 0 -2px 0 rgba(0,0,0,.2),
    0 30px 60px -20px rgba(0,122,255,.85),
    0 0 90px rgba(255,220,150,.55);
}
.shop-open-badge .logo svg{width:56px;height:56px}
.shop-open-badge h3{
  font-size:26px;font-weight:800;letter-spacing:-.6px;margin-bottom:8px;
  text-shadow:0 4px 28px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.4);
}
.shop-open-badge p{
  font-size:14px;opacity:.92;
  text-shadow:0 2px 12px rgba(0,0,0,.55);
}
@keyframes badgeReveal{
  0%{opacity:0;transform:translate(-50%,-42%) scale(.55)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  40%{transform:translate(-50%,-50%) scale(1)}
  72%{opacity:1;transform:translate(-50%,-52%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-62%) scale(.9)}
}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:100px;font-size:13.5px;font-weight:600;background:var(--glass-2);color:var(--text);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight),0 4px 14px -6px rgba(15,23,42,.14);transition:all .28s var(--ease);position:relative;overflow:hidden;white-space:nowrap;user-select:none;transform:translateZ(0)}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--glass-highlight),0 12px 28px -10px rgba(15,23,42,.24);background:var(--glass-3)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px}
.btn.sm svg{width:13px;height:13px}
.btn.xs{height:28px;padding:0 11px;font-size:11.5px;border-radius:100px}
.btn.xs svg{width:12px;height:12px}
.btn.primary{background:var(--grad-brand);background-size:180% auto;color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.15),0 10px 24px -8px rgba(0,122,255,.65),0 4px 10px -2px rgba(88,86,214,.35)}
.btn.primary:hover{background-position:right center;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.15),0 16px 34px -10px rgba(0,122,255,.75),0 6px 14px -2px rgba(88,86,214,.45)}
.btn.success{background:var(--grad-success);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(52,199,89,.65)}
.btn.danger{background:var(--grad-danger);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(255,59,48,.65)}
.btn.warn{background:var(--grad-warn);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(255,149,0,.65)}
.btn.ghost{background:transparent;border:1px solid var(--border-2);box-shadow:none}
.btn.ghost:hover{background:var(--glass-1);box-shadow:var(--glass-highlight),0 8px 20px -8px rgba(15,23,42,.14)}
.btn.block{width:100%}
.btn .ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.65),rgba(255,255,255,0) 70%);transform:scale(0);pointer-events:none;animation:ripple .7s ease-out}
.btn:not(.primary):not(.success):not(.danger):not(.warn) .ripple{background:radial-gradient(circle,rgba(0,122,255,.35),rgba(0,122,255,0) 70%)}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:'';position:absolute;top:50%;left:50%;margin:-8px 0 0 -8px;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spinner .7s linear infinite}
.btn.loading:not(.primary):not(.success):not(.danger):not(.warn)::after{border-color:rgba(0,122,255,.3);border-right-color:transparent}

.nav-icon,.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--glass-1);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight);transition:all .25s var(--ease);position:relative}
.nav-icon:hover,.icon-btn:hover{transform:translateY(-2px) scale(1.05);background:var(--glass-2);box-shadow:var(--glass-highlight),0 10px 20px -8px rgba(0,122,255,.35);color:var(--text)}
.nav-icon:active,.icon-btn:active{transform:scale(.95)}
.nav-icon svg,.icon-btn svg{width:18px;height:18px}
.nav-icon .pulse{position:absolute;top:5px;left:5px;width:10px;height:10px;border-radius:50%;background:var(--ios-red);box-shadow:0 0 0 2px var(--bg)}
.nav-icon .pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--ios-red);animation:ping 1.8s ease-out infinite}

/* NAVBAR */
.nav-wrap{position:sticky;top:0;z-index:50;padding:12px 20px 0}
.navbar{height:var(--nav);max-width:1560px;margin:0 auto;background:var(--glass-2);backdrop-filter:blur(28px) saturate(1.9);-webkit-backdrop-filter:blur(28px) saturate(1.9);border:1px solid var(--glass-border);border-radius:100px;display:flex;align-items:center;gap:12px;padding:0 12px 0 20px;box-shadow:var(--glass-highlight),var(--glass-shadow);transition:box-shadow .35s var(--ease)}
.navbar.scrolled{box-shadow:var(--glass-highlight),0 12px 40px -14px rgba(15,23,42,.2)}
.nav-brand{display:flex;align-items:center;gap:11px;flex-shrink:0;padding-left:6px}
.brand-logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-brand);background-size:180% auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -8px rgba(0,122,255,.7);position:relative;overflow:hidden}
.brand-logo svg{width:21px;height:21px}
.brand-text{font-weight:800;font-size:14.5px;letter-spacing:-.3px;line-height:1.15}
.brand-text small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
@media (max-width:640px){.brand-text{display:none}}
.nav-pills{display:flex;align-items:center;gap:3px;background:var(--glass-1);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-border);border-radius:100px;padding:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-pills::-webkit-scrollbar{display:none}
.nav-pill{display:flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:100px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;flex-shrink:0;transition:all .3s var(--ease);position:relative}
.nav-pill svg{width:15px;height:15px;opacity:.8;transition:transform .3s var(--spring)}
.nav-pill:hover{color:var(--text);transform:translateY(-1px)}
.nav-pill:hover svg{transform:scale(1.12)}
.nav-pill.active{background:var(--grad-brand);background-size:180% auto;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px -8px rgba(0,122,255,.65)}
.nav-pill.active svg{opacity:1}
.nav-pill .kbd{font-size:10px;padding:1px 6px;border-radius:100px;background:rgba(15,23,42,.08);color:var(--muted)}
.nav-pill.active .kbd{background:rgba(255,255,255,.25);color:#fff}
.nav-pill .nav-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;background:#fff;color:var(--ios-red)}
.nav-pill.active .nav-badge{background:rgba(255,255,255,.95)}
@media (max-width:900px){.nav-pills{display:none}}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-trigger{display:flex;align-items:center;gap:9px;height:40px;padding:0 14px;background:var(--glass-1);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-border);border-radius:100px;color:var(--muted);font-size:12.5px;box-shadow:var(--glass-highlight);transition:all .25s var(--ease);min-width:220px}
.search-trigger:hover{border-color:var(--glass-border-2);color:var(--text-2);transform:translateY(-1px)}
.search-trigger svg{width:14px;height:14px}
.search-trigger kbd{margin-right:auto;font-family:inherit;font-size:10.5px;padding:2px 7px;border-radius:100px;background:rgba(15,23,42,.08);color:var(--muted)}
@media (max-width:1100px){.search-trigger{min-width:40px;padding:0;width:40px;justify-content:center}.search-trigger span,.search-trigger kbd{display:none}}
.user-btn{display:flex;align-items:center;gap:9px;height:44px;padding:3px 4px 3px 12px;border-radius:100px;background:var(--glass-1);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight);transition:all .25s var(--ease)}
.user-btn:hover{transform:translateY(-1px);box-shadow:var(--glass-highlight),0 10px 22px -10px rgba(0,122,255,.4)}
.user-btn .avatar{width:34px;height:34px;font-size:12px}
.user-btn .avatar::after{display:none}
.user-btn svg{width:13px;height:13px;color:var(--muted)}
@media (max-width:520px){.user-btn{padding:3px}.user-btn .who-text,.user-btn > svg:last-child{display:none}}
.user-btn .who-text{display:none;text-align:right}
@media (min-width:900px){.user-btn .who-text{display:block}}
.user-btn .who-text b{display:block;font-size:12.5px;font-weight:700;line-height:1.2}
.user-btn .who-text span{display:block;font-size:10.5px;color:var(--muted)}
.mobile-menu-btn{display:none;width:40px;height:40px;border-radius:50%;background:var(--glass-1);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight);color:var(--text-2);place-items:center;transition:all .2s var(--ease)}
.mobile-menu-btn:hover{background:var(--glass-2);color:var(--text)}
.mobile-menu-btn svg{width:20px;height:20px}
@media (max-width:900px){.mobile-menu-btn{display:grid}}

.mob-nav-bd{position:fixed;inset:0;z-index:100;background:rgba(10,15,25,.4);backdrop-filter:blur(8px);animation:fadeIn .25s var(--ease) both}
.mob-nav{position:fixed;top:0;right:0;bottom:0;z-index:101;width:min(340px,88vw);background:var(--glass-3);backdrop-filter:blur(30px) saturate(1.9);-webkit-backdrop-filter:blur(30px) saturate(1.9);border-left:1px solid var(--glass-border);padding:22px;overflow-y:auto;animation:slideInLeft .36s var(--ease) both;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.mob-nav-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.mob-nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:100px;color:var(--text-2);font-size:14px;font-weight:500;transition:all .25s var(--ease);margin-bottom:3px}
.mob-nav a svg{width:18px;height:18px;opacity:.85}
.mob-nav a:hover{background:var(--glass-1);color:var(--text)}
.mob-nav a.active{background:var(--grad-brand);color:#fff;font-weight:600;box-shadow:0 8px 20px -8px rgba(0,122,255,.6)}
.mob-nav a.active svg{color:#fff;opacity:1}
.mob-nav .nav-badge{margin-right:auto;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;background:#fff;color:var(--ios-red)}
.mob-nav .grp{font-size:10.5px;color:var(--muted);padding:14px 14px 6px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}

.page{max-width:1560px;margin:0 auto;padding:26px 20px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;animation:slideUp .5s var(--ease) both}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.7px;line-height:1.15}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:6px}
.page-actions{display:flex;gap:9px;flex-wrap:wrap}

.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;animation:fadeIn .4s var(--ease) both}
.w-3{grid-column:span 3}.w-4{grid-column:span 4}.w-5{grid-column:span 5}
.w-6{grid-column:span 6}.w-7{grid-column:span 7}.w-8{grid-column:span 8}.w-12{grid-column:span 12}
@media (max-width:1200px){.w-3,.w-4,.w-5{grid-column:span 6}.w-7,.w-8{grid-column:span 12}}
@media (max-width:760px){.bento>*{grid-column:span 12!important}}

.widget{background:var(--glass-2);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--glass-highlight),var(--glass-shadow);animation:slideUp .55s var(--ease) both;position:relative;overflow:hidden;transition:all .35s var(--ease)}
.widget::before{content:'';position:absolute;top:0;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);opacity:.9;pointer-events:none}
.widget:hover{box-shadow:var(--glass-highlight),0 16px 40px -14px rgba(15,23,42,.2);border-color:var(--glass-border-2)}
.widget.hover-lift:hover{transform:translateY(-3px)}
.w-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.w-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px;letter-spacing:-.2px}
.w-title .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--grad-brand-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(0,122,255,.55)}
.w-title .ic svg{width:14px;height:14px}
.w-title.success .ic{background:var(--grad-success);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(52,199,89,.55)}
.w-title.warn .ic{background:var(--grad-warn);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(255,149,0,.55)}
.w-title.danger .ic{background:var(--grad-danger);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(255,59,48,.55)}
.w-title.info .ic{background:var(--grad-info);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(90,200,250,.55)}
.w-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.w-menu{width:30px;height:30px;border-radius:50%;color:var(--muted);display:grid;place-items:center;transition:all .25s var(--ease);flex-shrink:0;background:var(--glass-1);border:1px solid var(--glass-border)}
.w-menu:hover{background:var(--glass-2);color:var(--text);transform:rotate(90deg)}
.w-menu svg{width:15px;height:15px}

.hero{position:relative;background:var(--grad-brand);background-size:200% 200%;border-radius:var(--r-xl);padding:28px;color:#fff;overflow:hidden;animation:slideUp .55s var(--ease) both,gradShift 14s ease infinite;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 20px 50px -18px rgba(0,122,255,.6)}
.hero::before{content:'';position:absolute;top:-60%;right:-10%;width:70%;height:180%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 60%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-80%;left:-10%;width:60%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-bottom:8px}
.hero p{opacity:.92;font-size:13.5px;line-height:1.9;max-width:480px}
.hero-stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.hero-stat .k{font-size:11.5px;opacity:.8;margin-bottom:3px}
.hero-stat .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
.hero-stat .v small{font-size:11px;font-weight:500;opacity:.8;margin-right:3px}
.hero-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hero-quick button{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:100px;background:rgba(255,255,255,.2);color:#fff;font-size:12.5px;font-weight:600;backdrop-filter:blur(12px) saturate(1.8);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:all .28s var(--ease)}
.hero-quick button:hover{background:rgba(255,255,255,.3);transform:translateY(-2px) scale(1.03)}
.hero-quick button:active{transform:scale(.96)}
.hero-quick button svg{width:14px;height:14px}

.stat{display:flex;flex-direction:column;padding:18px;background:var(--glass-2);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--glass-highlight),var(--glass-shadow);transition:all .35s var(--ease);position:relative;overflow:hidden;animation:slideUp .55s var(--ease) both}
.stat::before{content:'';position:absolute;top:0;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);opacity:.9;pointer-events:none}
.stat:hover{transform:translateY(-4px);box-shadow:var(--glass-highlight),0 22px 44px -16px rgba(0,122,255,.3)}
.stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stat-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.stat-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-brand-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -8px rgba(0,122,255,.6)}
.stat-ic svg{width:17px;height:17px}
.stat.success .stat-ic{background:var(--grad-success)}
.stat.warn .stat-ic{background:var(--grad-warn)}
.stat.danger .stat-ic{background:var(--grad-danger)}
.stat.info .stat-ic{background:var(--grad-info)}
.stat-value{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.stat-value small{font-size:12px;font-weight:500;color:var(--muted);margin-right:5px}
.stat-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.stat-delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:100px}
.stat-delta.up{background:rgba(52,199,89,.14);color:#059669}
.stat-delta.down{background:rgba(255,59,48,.14);color:#dc2626}
.stat-delta svg{width:11px;height:11px}
.spark{width:80px;height:30px}

.ring-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:var(--surface-3)}
.ring .fg{stroke:url(#gradRing);stroke-dasharray:0 999;animation:ring 1.4s var(--ease) forwards;animation-delay:.15s}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center b{font-size:26px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring-center span{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.ring-list{flex:1;min-width:150px;display:flex;flex-direction:column;gap:12px}
.rl{display:flex;align-items:center;gap:10px;font-size:12.5px}
.rl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.rl b{margin-right:auto;font-variant-numeric:tabular-nums;font-weight:700}
.rl-bar{height:6px;border-radius:100px;background:var(--surface-3);flex:1;overflow:hidden;max-width:80px}
.rl-bar>div{height:100%;border-radius:100px;transform-origin:right;animation:barGrow .9s var(--ease) both}

.feed{display:flex;flex-direction:column;gap:2px}
.feed-item{display:flex;gap:12px;padding:11px;border-radius:14px;transition:all .25s var(--ease);cursor:pointer;animation:slideInLeft .45s var(--ease) both}
.feed-item:hover{background:var(--glass-1);transform:translateX(-3px)}
.feed-av{width:38px;height:38px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:var(--grad-brand-2);position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(0,122,255,.5)}
.feed-av.success{background:var(--grad-success)}
.feed-av.warn{background:var(--grad-warn)}
.feed-av.danger{background:var(--grad-danger)}
.feed-av .badge-mini{position:absolute;bottom:-2px;left:-2px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid var(--bg);background:var(--grad-brand)}
.feed-av .badge-mini svg{width:9px;height:9px}
.feed-body{flex:1;min-width:0}
.feed-title{font-size:13px;font-weight:600;line-height:1.55}
.feed-title b{color:var(--brand-1);font-weight:700}
.feed-title .tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10.5px;font-weight:700;margin:0 3px;background:var(--surface-3);color:var(--text-2)}
.feed-meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.feed-meta .m{display:inline-flex;align-items:center;gap:4px}
.feed-meta svg{width:11px;height:11px}

.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:15px;border-radius:var(--r-md);background:var(--glass-1);backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight);transition:all .3s var(--ease);text-align:right;position:relative;overflow:hidden}
.qa-btn:hover{transform:translateY(-3px) scale(1.02);background:var(--glass-2);box-shadow:var(--glass-highlight),0 14px 30px -12px rgba(0,122,255,.4)}
.qa-btn:active{transform:scale(.97)}
.qa-btn .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-brand-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -8px rgba(0,122,255,.6)}
.qa-btn .ic svg{width:18px;height:18px}
.qa-btn.alt-1 .ic{background:var(--grad-success)}
.qa-btn.alt-2 .ic{background:var(--grad-warn)}
.qa-btn.alt-3 .ic{background:var(--grad-info)}
.qa-btn b{font-size:12.5px;font-weight:700}
.qa-btn span{font-size:11px;color:var(--muted)}

.pipe{display:flex;flex-direction:column;gap:8px}
.pipe-step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--glass-1);border:1px solid var(--glass-border);transition:all .3s var(--ease)}
.pipe-step:hover{background:var(--glass-2);transform:translateX(-3px)}
.pipe-num{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--surface);color:var(--muted);border:1px solid var(--border);box-shadow:var(--glass-highlight)}
.pipe-step.active .pipe-num{background:var(--grad-brand);color:#fff;border-color:transparent}
.pipe-step.done .pipe-num{background:var(--grad-success);color:#fff;border-color:transparent}
.pipe-step .lbl{flex:1;font-size:12.5px;font-weight:600}
.pipe-step .lbl small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:1px}
.pipe-count{font-size:13px;font-weight:800;padding:4px 11px;border-radius:100px;background:var(--surface);border:1px solid var(--border);font-variant-numeric:tabular-nums}
.pipe-step.active .pipe-count{background:rgba(0,122,255,.12);color:var(--ios-blue);border-color:rgba(0,122,255,.25)}

.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.bar{width:100%;border-radius:8px 8px 3px 3px;background:var(--grad-brand-2);transform-origin:bottom;animation:barGrow .9s var(--ease) both;transition:all .25s var(--ease);min-height:5px;position:relative;cursor:pointer}
.bar:hover{filter:brightness(1.1);transform:scaleY(1.05)}
.bar-col:hover .bar-tip{opacity:1;transform:translate(-50%,-8px)}
.bar-tip{position:absolute;top:-4px;left:50%;transform:translate(-50%,0);background:var(--text);color:var(--bg);padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;opacity:0;transition:all .25s var(--ease);pointer-events:none;white-space:nowrap;z-index:2}
.bar-lbl{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.3}
.bar-col.success .bar{background:var(--grad-success)}
.bar-col.warn .bar{background:var(--grad-warn)}
.bar-col.info .bar{background:var(--grad-info)}

.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:4px}
.heat-cell{aspect-ratio:1;border-radius:5px;background:var(--surface-3);cursor:pointer;transition:all .25s var(--ease);animation:fadeIn .4s var(--ease) both;position:relative}
.heat-cell:hover{transform:scale(1.35);box-shadow:0 4px 12px -2px rgba(0,122,255,.5);z-index:1}
.heat-cell.l1{background:color-mix(in srgb,var(--brand-1) 22%,var(--surface-3))}
.heat-cell.l2{background:color-mix(in srgb,var(--brand-1) 42%,var(--surface-3))}
.heat-cell.l3{background:color-mix(in srgb,var(--brand-1) 68%,var(--surface-3))}
.heat-cell.l4{background:var(--brand-1)}
.heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--muted)}
.heat-legend .c{width:12px;height:12px;border-radius:4px}

.team{display:flex;flex-direction:column;gap:2px}
.team-row{display:flex;align-items:center;gap:11px;padding:10px;border-radius:14px;transition:all .25s var(--ease)}
.team-row:hover{background:var(--glass-1)}
.team-row .avatar{width:36px;height:36px;font-size:12px}
.team-info{flex:1;min-width:0}
.team-info b{display:block;font-size:12.5px;font-weight:700}
.team-info span{display:block;font-size:11px;color:var(--muted)}
.team-role{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:var(--glass-1);color:var(--text-2);border:1px solid var(--glass-border)}
.team-role.manager{background:rgba(175,82,222,.14);color:#7c3aed;border-color:rgba(175,82,222,.24)}
.team-role.admin{background:rgba(0,122,255,.14);color:var(--ios-blue);border-color:rgba(0,122,255,.24)}
.team-role.warehouse_officer{background:rgba(255,149,0,.14);color:#b45309;border-color:rgba(255,149,0,.24)}
.team-role.accountant{background:rgba(90,200,250,.14);color:#0369a1;border-color:rgba(90,200,250,.24)}
[data-theme="dark"] .team-role.manager{color:#c4b5fd}
[data-theme="dark"] .team-role.admin{color:#7dd3fc}
[data-theme="dark"] .team-role.warehouse_officer{color:#fbbf24}
[data-theme="dark"] .team-role.accountant{color:#38bdf8}

.top-list{display:flex;flex-direction:column;gap:14px}
.top-item{display:flex;align-items:center;gap:12px}
.top-rank{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border);font-variant-numeric:tabular-nums}
.top-item:nth-child(1) .top-rank{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;border-color:transparent}
.top-item:nth-child(2) .top-rank{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff;border-color:transparent}
.top-item:nth-child(3) .top-rank{background:linear-gradient(135deg,#fbbf24,#d97706);color:#fff;border-color:transparent}
.top-body{flex:1;min-width:0}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.top-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-name small{color:var(--muted);font-weight:500;font-family:monospace;font-size:11px;margin-right:5px}
.top-value{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
.top-bar{height:7px;background:var(--surface-3);border-radius:100px;overflow:hidden}
.top-bar>div{height:100%;border-radius:100px;background:var(--grad-brand-2);transform-origin:right;animation:barGrow .9s var(--ease) both}

.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:100px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.badge.pending_warehouse{background:rgba(255,149,0,.16);color:#b45309;border:1px solid rgba(255,149,0,.24)}
.badge.pending_accountant{background:rgba(90,200,250,.16);color:#0369a1;border:1px solid rgba(90,200,250,.24)}
.badge.pending_manager{background:rgba(175,82,222,.16);color:#6d28d9;border:1px solid rgba(175,82,222,.24)}
.badge.approved{background:rgba(52,199,89,.16);color:#047857;border:1px solid rgba(52,199,89,.24)}
.badge.rejected{background:rgba(255,59,48,.16);color:#b91c1c;border:1px solid rgba(255,59,48,.24)}
.badge.pending_warehouse .dot,.badge.pending_accountant .dot,.badge.pending_manager .dot{animation:pulse 1.6s ease-in-out infinite}
[data-theme="dark"] .badge.pending_warehouse{color:#fbbf24}

[data-theme="dark"] .badge.pending_manager{color:#c4b5fd}

.drawer-bd{position:fixed;inset:0;z-index:200;background:rgba(10,15,25,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadeIn .25s var(--ease) both}

.modal-bd{position:fixed;inset:0;z-index:300;background:rgba(10,15,25,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px;animation:fadeIn .22s var(--ease) both}

.cmd-bd{position:fixed;inset:0;z-index:400;background:rgba(10,15,25,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:start center;padding:80px 16px 16px;animation:fadeIn .18s var(--ease) both}

.celebrate{position:fixed;inset:0;z-index:1500;display:grid;place-items:center;background:rgba(10,15,25,.5);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);animation:fadeIn .25s var(--ease) both;overflow:hidden}

.celebrate-icon{position:relative;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-brand);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.15),0 30px 60px -20px rgba(0,122,255,.7);animation:circleGrow .6s var(--spring) both}
.celebrate-icon::before{content:'';position:absolute;inset:-2px;border-radius:50%;background:inherit;filter:blur(30px);opacity:.7;z-index:-1}
.celebrate-icon::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;opacity:0;animation:circleRing 1.6s ease-out .2s infinite}
.celebrate.success .celebrate-icon{background:var(--grad-success);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.15),0 30px 60px -20px rgba(52,199,89,.7)}
.celebrate.error .celebrate-icon{background:var(--grad-danger);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.15),0 30px 60px -20px rgba(255,59,48,.7)}
.celebrate.warn .celebrate-icon{background:var(--grad-warn);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.15),0 30px 60px -20px rgba(255,149,0,.7)}

.celebrate-icon svg{width:70px;height:70px;stroke-width:3}

.celebrate-text{max-width:420px}
.celebrate-title{font-size:26px;font-weight:800;letter-spacing:-.5px;color:#fff;margin-bottom:10px;text-shadow:0 4px 20px rgba(0,0,0,.35);animation:slideUp .5s var(--ease) .2s both}
.celebrate-desc{font-size:15px;color:rgba(255,255,255,.85);line-height:1.9;text-shadow:0 2px 10px rgba(0,0,0,.3);animation:slideUp .5s var(--ease) .35s both}

.dl-item .k{font-size:11.5px;color:var(--muted);font-weight:600}
.dl-item .v{font-size:13.5px;font-weight:700;word-break:break-word}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:100px;background:var(--glass-1);backdrop-filter:blur(12px);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight);font-size:12.5px;font-weight:500;color:var(--text-2);transition:all .28s var(--ease)}
.chip:hover{border-color:var(--glass-border-2);background:var(--glass-2);transform:translateY(-1px)}
.chip.active{background:var(--grad-brand);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 22px -8px rgba(0,122,255,.6)}
.chip .count{font-size:10.5px;padding:1px 7px;border-radius:100px;background:rgba(0,0,0,.08)}
.chip.active .count{background:rgba(255,255,255,.3)}
.search-input{position:relative;flex:1;min-width:200px;max-width:340px}
.search-input input{width:100%;height:40px;padding:0 40px 0 14px;background:var(--glass-1);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:100px;font-size:13px;box-shadow:var(--glass-highlight);transition:all .28s var(--ease)}
.search-input input:focus{border-color:var(--ios-blue);box-shadow:0 0 0 4px var(--ring),var(--glass-highlight);background:var(--glass-2)}
.search-input svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.avatar{width:36px;height:36px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;background:var(--grad-brand-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(0,122,255,.6);position:relative}
.avatar::after{content:'';position:absolute;bottom:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--ios-green);border:2px solid var(--bg)}

.tl{list-style:none;position:relative;padding-right:32px}
.tl::before{content:'';position:absolute;right:12px;top:14px;bottom:14px;width:2px;background:var(--border)}
.tl li{position:relative;padding:0 0 24px}
.tl li:last-child{padding-bottom:0}
.tl-node{position:absolute;right:-32px;top:2px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--border);display:grid;place-items:center;color:var(--muted);transition:all .3s var(--ease);z-index:1}
.tl-node svg{width:12px;height:12px}
.tl li.done .tl-node{background:var(--grad-success);border-color:transparent;color:#fff;box-shadow:0 0 0 4px rgba(52,199,89,.16)}
.tl li.active .tl-node{background:var(--grad-brand);border-color:transparent;color:#fff;box-shadow:0 0 0 4px rgba(0,122,255,.2);animation:pulse 1.8s ease-in-out infinite}
.tl li.rejected .tl-node{background:var(--grad-danger);border-color:transparent;color:#fff;box-shadow:0 0 0 4px rgba(255,59,48,.16)}
.tl-title{font-weight:700;font-size:13.5px;margin-bottom:3px}
.tl li:not(.done):not(.active):not(.rejected) .tl-title{color:var(--muted-2)}
.tl-meta{font-size:12px;color:var(--muted);line-height:1.75}
.tl-meta b{color:var(--text-2);font-weight:600}

.empty{padding:48px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;animation:fadeIn .4s var(--ease) both}
.empty svg{width:64px;height:64px;opacity:.3}
.empty b{font-size:15px;font-weight:700}
.empty p{font-size:12.5px;color:var(--muted);max-width:340px;line-height:1.9}
</style>

/* DB */
const DB_KEY='furniture_glass_v3',SESSION='furniture_glass_session_v3',PREFS='furniture_glass_prefs_v3';
function loadDB(){const r=localStorage.getItem(DB_KEY);if(!r)return{users:[],warehouses:[],products:[],stocks:[],transfers:[]};try{return JSON.parse(r)}catch{return{users:[],warehouses:[],products:[],stocks:[],transfers:[]}}}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function tcode(db){const d=new Date();const ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;const n=db.transfers.filter(t=>t.code.includes(ymd)).length+1;return `TR-${ymd}-${String(n).padStart(3,'0')}`}

function seed(){
  const central={id:uid(),name:'انبار مرکزی',type:'central',isActive:true};
  const paint={id:uid(),name:'رنگ‌کاری',type:'paint',isActive:true};
  const uph={id:uid(),name:'رویه‌کوبی',type:'upholstery',isActive:true};
  const store={id:uid(),name:'فروشگاه',type:'store',isActive:true};
  const customer={id:uid(),name:'مشتری',type:'customer',isActive:true};
  const users=[
    {id:uid(),name:'مدیر سیستم',username:'admin',password:'admin',role:'admin',isActive:true},
    {id:uid(),name:'مدیر عامل',username:'manager',password:'manager',role:'manager',isActive:true},
    {id:uid(),name:'حسابدار',username:'acc',password:'acc',role:'accountant',isActive:true},
    {id:uid(),name:'مسئول انبار',username:'wh',password:'wh',role:'warehouse_officer',isActive:true},
    {id:uid(),name:'علی رضایی',username:'ali',password:'ali',role:'warehouse_officer',isActive:true}
  ];
  const p1={id:uid(),name:'مبل مدل A',code:'MB-A',unit:'دست',createdAt:new Date().toISOString()};
  const p2={id:uid(),name:'مبل مدل B',code:'MB-B',unit:'دست',createdAt:new Date().toISOString()};
  const p3={id:uid(),name:'مبل مدل C',code:'MB-C',unit:'دست',createdAt:new Date().toISOString()};
  const now=new Date().toISOString();
  const ms=(pid,wid,q)=>({id:uid(),productId:pid,warehouseId:wid,quantity:q,reservedQty:0,updatedAt:now});
  const stocks=[ms(p1.id,central.id,20),ms(p1.id,paint.id,12),ms(p1.id,uph.id,8),ms(p1.id,store.id,5),ms(p2.id,central.id,15),ms(p2.id,paint.id,6),ms(p2.id,uph.id,4),ms(p2.id,store.id,3),ms(p3.id,central.id,30),ms(p3.id,uph.id,10),ms(p3.id,store.id,2)];
  const transfers=[];
  for(let i=0;i<12;i++){
    const d=new Date();d.setDate(d.getDate()-Math.floor(Math.random()*7));
    const st=['pending_warehouse','pending_accountant','pending_manager','approved','rejected'][i%5];
    const t={id:uid(),code:`TR-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(i+1).padStart(3,'0')}`,type:'warehouse',sourceWarehouseId:[central.id,paint.id,uph.id][i%3],destinationWarehouseId:[paint.id,uph.id,store.id][i%3],productId:[p1.id,p2.id,p3.id][i%3],quantity:2+Math.floor(Math.random()*6),description:'',status:st,createdBy:users[3].id,createdByName:users[3].name,createdAt:d.toISOString()};
    if(st!=='pending_warehouse')t.warehouseApproval={userId:users[3].id,userName:users[3].name,at:d.toISOString(),note:''};
    if(st==='pending_manager'||st==='approved'||st==='rejected')t.accountantApproval={userId:users[2].id,userName:users[2].name,at:d.toISOString(),note:''};
    if(st==='approved'){t.managerApproval={userId:users[1].id,userName:users[1].name,at:d.toISOString(),note:''};t.completedAt=d.toISOString()}
    if(st==='rejected')t.rejection={userId:users[2].id,userName:users[2].name,at:d.toISOString(),reason:'مغایرت در شمارش',stage:'accountant'};
    transfers.push(t);
  }
  return{warehouses:[central,paint,uph,store,customer],users,products:[p1,p2,p3],stocks,transfers};
}
if(!loadDB().users?.length)saveDB(seed());

/* STATE */
const State={user:null,route:{name:'dashboard',params:{}},theme:'light',prefs:JSON.parse(localStorage.getItem(PREFS)||'{}')};
State.theme=State.prefs.theme||'light';

function savePrefs(){localStorage.setItem(PREFS,JSON.stringify({theme:State.theme}))}
function curUser(){const id=localStorage.getItem(SESSION);if(!id)return null;return loadDB().users.find(u=>u.id===id)||null}

const ROLES={warehouse_officer:'مسئول انبار',accountant:'حسابدار',manager:'مدیر',admin:'مدیر سیستم'};
const STATUS={
  pending_warehouse:{label:'در انتظار تأیید انبار',tone:'pending_warehouse',step:1},
  pending_accountant:{label:'در انتظار تأیید حسابدار',tone:'pending_accountant',step:2},
  pending_manager:{label:'در انتظار تأیید مدیر',tone:'pending_manager',step:3},
  approved:{label:'انتقال انجام شد',tone:'approved',step:4},
  rejected:{label:'رد شد',tone:'rejected',step:-1}
};
const WH_COLOR={central:'#007AFF',paint:'#FF9500',upholstery:'#5AC8FA',store:'#34C759',customer:'#FF3B30'};

const canCreate=u=>u&&['warehouse_officer','admin','manager'].includes(u.role);
function canApprove(u,t){if(!u||!t||['approved','rejected'].includes(t.status))return false;if(t.status==='pending_warehouse')return['warehouse_officer','admin'].includes(u.role);if(t.status==='pending_accountant')return['accountant','admin'].includes(u.role);if(t.status==='pending_manager')return['manager','admin'].includes(u.role);return false}
function allowedDest(t){return{central:['paint'],paint:['upholstery'],upholstery:['store','customer']}[t]||[]}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const initials=n=>(n||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('');
function faDate(iso){if(!iso)return'—';try{return new Date(iso).toLocaleString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return iso}}
function relTime(iso){if(!iso)return'';const d=(Date.now()-new Date(iso))/1000;if(d<60)return'همین حالا';if(d<3600)return`${Math.floor(d/60)} دقیقه پیش`;if(d<86400)return`${Math.floor(d/3600)} ساعت پیش`;if(d<604800)return`${Math.floor(d/86400)} روز پیش`;return faDate(iso)}
const findStock=(db,pid,wid)=>db.stocks.find(s=>s.productId===pid&&s.warehouseId===wid);
const getWh=(db,id)=>db.warehouses.find(w=>w.id===id);
const getProd=(db,id)=>db.products.find(p=>p.id===id);

/* CELEBRATE */
function celebrate(title,desc='',type='success',duration=2100){
  $$('.celebrate').forEach(el=>el.remove());
  const overlay=document.createElement('div');
  overlay.className=`celebrate ${type}`;
  const icon=type==='success'?IC.check:type==='error'?IC.x:type==='warn'?IC.alert:IC.info;
  const hint=type==='success'?'عملیات با موفقیت انجام شد':type==='error'?'لطفاً دوباره تلاش کنید':type==='warn'?'نیاز به بررسی دارد':'اطلاع‌رسانی سیستم';
  overlay.innerHTML=`
    <div class="celebrate-card">
      <div class="celebrate-icon">${icon}</div>
      <div class="celebrate-text">
        <div class="celebrate-title">${esc(title)}</div>
        ${desc?`<div class="celebrate-desc">${esc(desc)}</div>`:''}
        <div class="celebrate-hint">${hint}</div>
      </div>
    </div>`;
  if(type==='success'){
    const colors=['#007AFF','#5856D6','#AF52DE','#34C759','#FF9500','#5AC8FA','#FF2D55','#FFCC00'];
    for(let i=0;i<90;i++){
      const c=document.createElement('div');c.className='confetti';
      const color=colors[Math.floor(Math.random()*colors.length)];
      const size=6+Math.random()*10;
      c.style.background=color;c.style.left=(Math.random()*100)+'%';
      c.style.width=size+'px';c.style.height=(size*1.4)+'px';
      c.style.borderRadius=Math.random()>.5?'50%':'2px';
      c.style.animationDuration=(1.6+Math.random()*1.2)+'s';
      c.style.animationDelay=(Math.random()*0.4)+'s';
      c.style.opacity='0';
      setTimeout(()=>{c.style.opacity='1'},100);
      overlay.appendChild(c);
    }
  }
  document.body.appendChild(overlay);
  clearTimeout(overlay._t);
  overlay._t=setTimeout(()=>{overlay.classList.add('exit');setTimeout(()=>overlay.remove(),500)},duration);
  overlay.addEventListener('click',()=>{clearTimeout(overlay._t);overlay.classList.add('exit');setTimeout(()=>overlay.remove(),500)});
}

/* MODAL / DRAWER / RIPPLE / COUNTUP */
function modal({title,desc,body,actions}){
  const bd=document.createElement('div');bd.className='modal-bd';
  bd.innerHTML=`<div class="modal"><h3>${esc(title)}</h3>${desc?`<div class="desc">${esc(desc)}</div>`:''}<div id="mb">${body||''}</div><div class="modal-actions"></div></div>`;
  const acts=bd.querySelector('.modal-actions');
  (actions||[]).forEach(a=>{const b=document.createElement('button');b.className=`btn ${a.cls||''}`;b.innerHTML=a.label;b.addEventListener('click',()=>a.onClick?.(bd));acts.appendChild(b)});
  bd.addEventListener('click',e=>{if(e.target===bd)close()});
  document.body.appendChild(bd);attachRippleAll(bd);
  function close(){bd.style.animation='fadeOut .2s forwards';setTimeout(()=>bd.remove(),200)}
  return{close,element:bd};
}
function drawer({title,body,foot}){
  closeDrawer();
  const bd=document.createElement('div');bd.className='drawer-bd';bd.id='drawer-bd';

function closeDrawer(){const bd=$('#drawer-bd'),dr=$('#drawer');if(bd){bd.style.animation='fadeOut .2s forwards';setTimeout(()=>bd.remove(),200)}if(dr){dr.style.animation='slideInLeft .3s reverse forwards';setTimeout(()=>dr.remove(),250)}}
function attachRipple(el){el.addEventListener('click',e=>{const r=el.getBoundingClientRect();const s=document.createElement('span');s.className='ripple';const sz=Math.max(r.width,r.height);s.style.width=s.style.height=sz+'px';s.style.left=(e.clientX-r.left-sz/2)+'px';s.style.top=(e.clientY-r.top-sz/2)+'px';el.appendChild(s);setTimeout(()=>s.remove(),700)})}
function attachRippleAll(root=document){$$('.btn',root).forEach(b=>{if(!b._rip){b._rip=true;attachRipple(b)}})}
function countUp(el,target,dur=800){const t0=performance.now();(function tick(now){const p=Math.min((now-t0)/dur,1);const e=1-Math.pow(1-p,3);el.textContent=Math.round(target*e).toLocaleString('fa-IR');if(p<1)requestAnimationFrame(tick)})(t0)}

function playShopOpening(user, done) {
  // Cleanup any lingering elements
  $$('.shop-open-overlay, .shop-open-badge').forEach(el => el.remove());

  const overlay = document.createElement('div');
  overlay.className = 'shop-open-overlay';

  overlay.appendChild(light);

  // Side rails
  const railL = document.createElement('div');

  overlay.appendChild(railL);
  const railR = document.createElement('div');
  railR.className = 'shop-open-rail right';

  document.body.appendChild(overlay);

  const badge = document.createElement('div');

    <div class="logo">${IC.sofa}</div>
    <h3>خوش آمدید ${esc(user.name)}</h3>
    <p>در حال باز کردن فروشگاه…</p>
  `;
  document.body.appendChild(badge);

  // Cleanup after animation
  setTimeout(() => {
    overlay.style.transition = 'opacity .3s ease';
    overlay.style.opacity = '0';
    badge.style.transition = 'opacity .3s ease';
    badge.style.opacity = '0';
    setTimeout(() => {
      overlay.remove();
      badge.remove();
      done();
    }, 300);
  }, 1400);
}

function openCmd(){
  if($('#cmd-bd'))return;
  const bd=document.createElement('div');bd.className='cmd-bd';bd.id='cmd-bd';
  const items=NAV.filter(i=>i.roles.includes(State.user?.role));
  bd.innerHTML=`<div class="cmd"><input id="cmd-input" placeholder="جستجو یا اجرای دستور…" autocomplete="off" /><div class="cmd-list" id="cmd-list"></div></div>`;
  document.body.appendChild(bd);
  const input=$('#cmd-input'),list=$('#cmd-list');let sel=0,cmds=[];
  function build(q=''){
    const query=q.toLowerCase().trim();
    const nav=items.map(i=>({label:i.label,icon:i.icon,kbd:'↵',run:()=>navigate(i.key),sec:'صفحه‌ها'}));
    const acts=[
      {label:'درخواست جابه‌جایی جدید',icon:IC.plus,run:()=>navigate('newTransfer'),sec:'اقدامات'},
      {label:'ارسال مستقیم به مشتری',icon:IC.truck,run:()=>navigate('directCustomer'),sec:'اقدامات'},
      {label:State.theme==='light'?'حالت تاریک':'حالت روشن',icon:State.theme==='light'?IC.moon:IC.sun,run:toggleTheme,sec:'تنظیمات'},
      {label:'خروج از حساب',icon:IC.logout,run:logout,sec:'تنظیمات'}
    ];
    cmds=[...nav,...acts];
    const f=query?cmds.filter(c=>c.label.toLowerCase().includes(query)):cmds;
    if(!f.length){list.innerHTML='<div class="cmd-empty">موردی یافت نشد</div>';return}
    let html='',ls=null;
    f.forEach((c,i)=>{if(c.sec&&c.sec!==ls){html+=`<div class="cmd-sec">${c.sec}</div>`;ls=c.sec}html+=`<div class="cmd-item ${i===sel?'sel':''}" data-i="${i}">${c.icon}<b>${c.label}</b>${c.kbd?`<span class="kbd">${c.kbd}</span>`:''}</div>`});
    list.innerHTML=html;list._f=f;
    $$('.cmd-item',list).forEach(el=>{el.addEventListener('click',()=>{closeCmd();f[+el.dataset.i].run()});el.addEventListener('mouseenter',()=>{sel=+el.dataset.i;render()})});
    function render(){$$('.cmd-item',list).forEach(el=>el.classList.toggle('sel',+el.dataset.i===sel))}
    list._r=render;
  }
  build('');input.focus();
  input.addEventListener('input',()=>{sel=0;build(input.value)});
  input.addEventListener('keydown',e=>{
    const f=list._f||[];
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,f.length-1);list._r?.()}
    if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);list._r?.()}
    if(e.key==='Enter'){e.preventDefault();const c=f[sel];if(c){closeCmd();c.run()}}
    if(e.key==='Escape')closeCmd();
  });
  bd.addEventListener('click',e=>{if(e.target===bd)closeCmd()});
}
function closeCmd(){$('#cmd-bd')?.remove()}
function toggleTheme(){State.theme=State.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',State.theme);savePrefs();const b=$('#theme-btn');if(b)b.innerHTML=State.theme==='light'?IC.moon:IC.sun;celebrate(State.theme==='light'?'حالت روشن فعال شد':'حالت تاریک فعال شد','','success',1400)}

function makeSpark(data,w,h){const max=Math.max(...data,1);const pts=data.map((v,i)=>({x:(i*(w))/(data.length-1),y:h-2-((v/max)*(h-4))}));return pts.map((p,i)=>`${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ')}
function emptyState(title,desc){return `<div class="empty">${IC.inbox}<b>${esc(title)}</b>${desc?`<p>${esc(desc)}</p>`:''}</div>`}
function transferItemHTML(db,t){
  const src=getWh(db,t.sourceWarehouseId),dst=getWh(db,t.destinationWarehouseId),p=getProd(db,t.productId);
  const st=STATUS[t.status];let stepsHTML='';
  for(let i=1;i<=4;i++){let cls='';if(t.status==='rejected'){const rStep={warehouse:1,accountant:2,manager:3}[t.rejection?.stage]||0;if(i<rStep)cls='done';else if(i===rStep)cls='rejected'}else{if(i<st.step)cls='done';else if(i===st.step)cls='active'}stepsHTML+=`<div class="t-step ${cls}"></div>`}
  return `<div class="t-item" data-tid="${t.id}"><div class="t-row1"><span class="t-code">${esc(t.code)}</span><span class="badge ${st.tone}"><span class="dot"></span>${st.label}</span><span class="small muted" style="margin-right:auto">${relTime(t.createdAt)}</span></div><div class="t-row2"><div class="t-route">${esc(src?.name||'')} ${IC.arrowL} ${esc(dst?.name||'')}</div><span>${esc(p?.name||'')}</span><span class="t-qty">${t.quantity} ${esc(p?.unit||'')}</span><div class="t-progress">${stepsHTML}</div></div></div>`;
}

function pageStock(page){
  const db=loadDB();
  const state={wh:'',pid:'',q:''};
  page.innerHTML=`
    <div class="page-head"><div><h1>موجودی انبارها</h1><div class="sub" id="stock-sub">مشاهده و فیلتر موجودی کالاها</div></div></div>
    <div class="table-card">
      <div class="table-toolbar">
        <div class="search-input" style="max-width:300px;flex:1">${IC.search}<input id="s-q" placeholder="جستجوی نام یا کد کالا…" /></div>
        <select class="chip" id="s-wh" style="height:40px;padding:0 36px 0 16px;appearance:none;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>&quot;);background-repeat:no-repeat;background-position:left 14px center;background-size:12px;border-radius:100px">
          <option value="">همه انبارها</option>${db.warehouses.filter(w=>w.type!=='customer').map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}
        </select>
        <select class="chip" id="s-pid" style="height:40px;padding:0 36px 0 16px;appearance:none;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>&quot;);background-repeat:no-repeat;background-position:left 14px center;background-size:12px;border-radius:100px">
          <option value="">همه کالاها</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
        </select>
      </div>
      <div class="table-scroll" id="s-table"></div>
    </div>`;
  const draw=()=>{
    const rows=db.stocks.filter(s=>{
      if(state.wh&&s.warehouseId!==state.wh)return false;
      if(state.pid&&s.productId!==state.pid)return false;
      if(state.q){const p=getProd(db,s.productId);if(!p)return false;const q=state.q.toLowerCase();if(!(p.name.toLowerCase().includes(q)||(p.code||'').toLowerCase().includes(q)))return false}
      return true;
    }).map(s=>({s,p:getProd(db,s.productId),w:getWh(db,s.warehouseId)})).filter(r=>r.p&&r.w&&r.w.type!=='customer');
    const tbl=$('#s-table');const sub=$('#stock-sub');
    if(sub)sub.textContent=`${rows.length} ردیف · ${db.warehouses.filter(w=>w.type!=='customer').length} انبار`;
    if(!rows.length){tbl.innerHTML=`<div class="table-empty">${IC.inbox}<b>موردی یافت نشد</b><p>فیلترها را تغییر دهید یا از بخش مقداردهی اولیه استفاده کنید</p></div>`;return}
    tbl.innerHTML=`
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:36%">کالا</th>
            <th style="width:18%">انبار</th>
            <th style="width:14%;text-align:left">موجودی</th>
            <th style="width:10%;text-align:left">رزرو</th>
            <th style="width:14%;text-align:left">قابل استفاده</th>
            <th style="width:12%" class="col-sm-hide">به‌روزرسانی</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td><div class="cell-product"><b>${esc(r.p.name)}</b>${r.p.code?`<span class="code-chip">${esc(r.p.code)}</span>`:''}</div></td>
              <td><div class="wh-cell"><span class="wh-dot" style="background:${WH_COLOR[r.w.type]||'#94a3b8'};color:${WH_COLOR[r.w.type]||'#94a3b8'}"></span><span>${esc(r.w.name)}</span></div></td>
              <td class="num">${r.s.quantity} <span class="unit">${esc(r.p.unit||'')}</span></td>
              <td class="num muted">${r.s.reservedQty||0}</td>
              <td class="num"><span class="qty-highlight">${r.s.quantity-(r.s.reservedQty||0)}</span></td>
              <td class="date-cell col-sm-hide">${relTime(r.s.updatedAt)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  };
  ['s-q','s-wh','s-pid'].forEach(id=>{$('#'+id).addEventListener('input',e=>{if(id==='s-q')state.q=e.target.value.trim();else if(id==='s-wh')state.wh=e.target.value;else state.pid=e.target.value;draw()})});
  draw();
}

  const db=loadDB();
  const stockable=db.warehouses.filter(w=>w.type!=='customer');
  page.innerHTML=`

    <div class="widget" style="max-width:760px">
      <form id="if" class="form-grid">
        <div class="field"><label>کالا <span class="req">*</span></label><select id="ip" required><option value="">انتخاب کنید…</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}${p.code?' — '+esc(p.code):''}</option>`).join('')}</select></div>
        <div class="field"><label>انبار <span class="req">*</span></label><select id="iw" required><option value="">انتخاب کنید…</option>${stockable.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div>
        <div class="field"><label>تعداد <span class="req">*</span></label><input id="iq" type="number" min="0" step="1" required placeholder="0" /></div>
        <div class="full row" style="justify-content:flex-end;margin-top:6px"><button class="btn primary" type="submit">${IC.check} ثبت موجودی</button></div>
      </form>
      <div style="height:1px;background:var(--border);margin:16px 0"></div>
      <div class="row" style="gap:10px;font-size:12.5px;color:var(--muted)">${IC.info}<span>مقدار وارد‌شده جایگزین موجودی می‌شود.</span></div>
    </div>`;
  $('#if').addEventListener('submit',e=>{
    e.preventDefault();
    const pid=$('#ip').value,wid=$('#iw').value,qty=parseInt($('#iq').value,10);
    if(!pid||!wid||isNaN(qty)||qty<0)return celebrate('اطلاعات ناقص','همه فیلدها را پر کنید','error',1600);
    const fresh=loadDB();let s=findStock(fresh,pid,wid);

}
