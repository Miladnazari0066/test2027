<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Furniture · سیستم مدیریت موجودی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ios-blue:#007AFF;--ios-green:#34C759;--ios-red:#FF3B30;--ios-orange:#FF9500;--ios-purple:#AF52DE;--ios-teal:#5AC8FA;
  --grad-brand:linear-gradient(135deg,#007AFF 0%,#5856D6 55%,#AF52DE 120%);
  --grad-brand-2:linear-gradient(135deg,#007AFF,#5856D6);
  --grad-brand-soft:linear-gradient(135deg,rgba(0,122,255,.15),rgba(175,82,222,.10));
  --grad-success:linear-gradient(135deg,#34C759,#00A14B);
  --grad-warn:linear-gradient(135deg,#FF9500,#E67E00);
  --grad-danger:linear-gradient(135deg,#FF3B30,#D70015);
  --grad-info:linear-gradient(135deg,#5AC8FA,#0EA5E9);
  --glass-1:rgba(255,255,255,.62);--glass-2:rgba(255,255,255,.78);--glass-3:rgba(255,255,255,.9);
  --glass-border:rgba(255,255,255,.7);
  --glass-highlight:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35);
  --glass-shadow:0 8px 32px -8px rgba(15,23,42,.12),0 2px 8px -2px rgba(15,23,42,.06);
  --bg:#eef2f9;--surface:#fff;--surface-2:#f6f8fc;--surface-3:#eef1f8;
  --border:rgba(15,23,42,.08);--border-2:rgba(15,23,42,.14);
  --text:#0a1220;--text-2:#334155;--muted:#64748b;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --nav:68px;
}
[data-theme="dark"]{
  --glass-1:rgba(30,35,50,.55);--glass-2:rgba(30,35,50,.72);--glass-3:rgba(30,35,50,.88);
  --glass-border:rgba(255,255,255,.09);
  --glass-highlight:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.3);
  --bg:#06070d;--surface:#0f1420;--surface-2:#161d2c;--surface-3:#1e2739;
  --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.14);
  --text:#eef2f8;--text-2:#cbd5e1;--muted:#94a3b8;
}
html,body{height:100%}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s var(--ease),color .3s var(--ease)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 12% -10%,rgba(0,122,255,.18),transparent 60%),radial-gradient(800px 500px at 95% 5%,rgba(175,82,222,.16),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(90,200,250,.14),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(100,116,139,.25);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--ios-blue);outline-offset:2px;border-radius:8px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes spinner{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes confettiFall{0%{transform:translateY(-20vh) rotate(0);opacity:1}100%{transform:translateY(120vh) rotate(720deg);opacity:0}}
@keyframes circleGrow{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes celebrateExit{to{opacity:0;transform:scale(1.15)}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes ripple{to{transform:scale(3);opacity:0}}
@keyframes shutterLift{0%{transform:translateY(0)}15%{transform:translateY(-4%)}100%{transform:translateY(-105%)}}
@keyframes railFade{to{opacity:0}}
@keyframes lightBurst{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
@keyframes badgeReveal{0%{opacity:0;transform:translate(-50%,-42%) scale(.55)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}40%{transform:translate(-50%,-50%) scale(1)}72%{opacity:1;transform:translate(-50%,-52%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(.9)}}
@keyframes notifSlideIn{from{opacity:0;transform:translateX(-100%)}to{opacity:1;transform:none}}
@keyframes notifOut{to{opacity:0;transform:translateX(-100%)}}
@keyframes notifCardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:100px;font-size:13.5px;font-weight:600;background:var(--glass-2);color:var(--text);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight),0 4px 14px -6px rgba(15,23,42,.14);transition:all .28s var(--ease);position:relative;overflow:hidden;white-space:nowrap;user-select:none;transform:translateZ(0)}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:var(--glass-highlight),0 12px 28px -10px rgba(15,23,42,.24);background:var(--glass-3)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px}
.btn.sm svg{width:13px;height:13px}
.btn.xs{height:28px;padding:0 11px;font-size:11.5px;border-radius:100px}
.btn.xs svg{width:12px;height:12px}
.btn.primary{background:var(--grad-brand);background-size:180% auto;color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.15),0 10px 24px -8px rgba(0,122,255,.65),0 4px 10px -2px rgba(88,86,214,.35)}
.btn.primary:hover{background-position:right center}
.btn.success{background:var(--grad-success);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(52,199,89,.65)}
.btn.danger{background:var(--grad-danger);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(255,59,48,.65)}
.btn.warn{background:var(--grad-warn);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -8px rgba(255,149,0,.65)}
.btn.ghost{background:transparent;border:1px solid var(--border-2);box-shadow:none}
.btn.ghost:hover{background:var(--glass-1)}
.btn.block{width:100%}
.btn .ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.65),rgba(255,255,255,0) 70%);transform:scale(0);pointer-events:none;animation:ripple .7s ease-out}
.btn:not(.primary):not(.success):not(.danger):not(.warn) .ripple{background:radial-gradient(circle,rgba(0,122,255,.35),rgba(0,122,255,0) 70%)}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:'';position:absolute;top:50%;left:50%;margin:-8px 0 0 -8px;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spinner .7s linear infinite}

.nav-icon,.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--glass-1);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight);transition:all .25s var(--ease);position:relative;cursor:pointer}
.nav-icon:hover,.icon-btn:hover{transform:translateY(-2px) scale(1.05);background:var(--glass-2);color:var(--text)}
.nav-icon:active,.icon-btn:active{transform:scale(.95)}
.nav-icon svg,.icon-btn svg{width:18px;height:18px}
.nav-icon .pulse{position:absolute;top:5px;left:5px;width:10px;height:10px;border-radius:50%;background:var(--ios-red);box-shadow:0 0 0 2px var(--bg)}
.nav-icon .pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--ios-red);animation:ping 1.8s ease-out infinite}

.nav-wrap{position:sticky;top:0;z-index:50;padding:12px 20px 0}
.navbar{height:var(--nav);max-width:1560px;margin:0 auto;background:var(--glass-2);backdrop-filter:blur(28px) saturate(1.9);-webkit-backdrop-filter:blur(28px) saturate(1.9);border:1px solid var(--glass-border);border-radius:100px;display:flex;align-items:center;gap:12px;padding:0 12px 0 20px;box-shadow:var(--glass-highlight),var(--glass-shadow);transition:box-shadow .35s var(--ease)}
.navbar.scrolled{box-shadow:var(--glass-highlight),0 12px 40px -14px rgba(15,23,42,.2)}
.nav-brand{display:flex;align-items:center;gap:11px;flex-shrink:0;padding-left:6px}
.brand-logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-brand);background-size:180% auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -8px rgba(0,122,255,.7);position:relative}
.brand-logo svg{width:21px;height:21px}
.brand-text{font-weight:800;font-size:14.5px;letter-spacing:-.3px;line-height:1.15}
.brand-text small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
@media (max-width:640px){.brand-text{display:none}}
.nav-pills{display:flex;align-items:center;gap:3px;background:var(--glass-1);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-border);border-radius:100px;padding:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-pills::-webkit-scrollbar{display:none}
.nav-pill{display:flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:100px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;flex-shrink:0;transition:all .3s var(--ease);position:relative;cursor:pointer}
.nav-pill svg{width:15px;height:15px;opacity:.8;transition:transform .3s var(--spring)}
.nav-pill:hover{color:var(--text);transform:translateY(-1px)}
.nav-pill:hover svg{transform:scale(1.12)}
.nav-pill.active{background:var(--grad-brand);background-size:180% auto;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px -8px rgba(0,122,255,.65)}
.nav-pill.active svg{opacity:1}
.nav-pill .kbd{font-size:10px;padding:1px 6px;border-radius:100px;background:rgba(15,23,42,.08);color:var(--muted)}
.nav-pill.active .kbd{background:rgba(255,255,255,.25);color:#fff}
.nav-pill .nav-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;background:#fff;color:var(--ios-red)}
.nav-pill.active .nav-badge{background:rgba(255,255,255,.95)}
@media (max-width:900px){.nav-pills{display:none}}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-trigger{display:flex;align-items:center;gap:9px;height:40px;padding:0 14px;background:var(--glass-1);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-border);border-radius:100px;color:var(--muted);font-size:12.5px;box-shadow:var(--glass-highlight);transition:all .25s var(--ease);min-width:220px;cursor:pointer}
.search-trigger:hover{border-color:var(--glass-border);color:var(--text-2);transform:translateY(-1px)}
.search-trigger svg{width:14px;height:14px}
.search-trigger kbd{margin-right:auto;font-family:inherit;font-size:10.5px;padding:2px 7px;border-radius:100px;background:rgba(15,23,42,.08);color:var(--muted)}
@media (max-width:1100px){.search-trigger{min-width:40px;padding:0;width:40px;justify-content:center}.search-trigger span,.search-trigger kbd{display:none}}
.user-btn{display:flex;align-items:center;gap:9px;height:44px;padding:3px 4px 3px 12px;border-radius:100px;background:var(--glass-1);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight);transition:all .25s var(--ease);cursor:pointer}
.user-btn:hover{transform:translateY(-1px);box-shadow:var(--glass-highlight),0 10px 22px -10px rgba(0,122,255,.4)}
.user-btn .avatar{width:34px;height:34px;font-size:12px}
.user-btn .avatar::after{display:none}
.user-btn svg{width:13px;height:13px;color:var(--muted)}
@media (max-width:520px){.user-btn{padding:3px}.user-btn .who-text,.user-btn > svg:last-child{display:none}}
.user-btn .who-text{display:none;text-align:right}
@media (min-width:900px){.user-btn .who-text{display:block}}
.user-btn .who-text b{display:block;font-size:12.5px;font-weight:700;line-height:1.2}
.user-btn .who-text span{display:block;font-size:10.5px;color:var(--muted)}
.mobile-menu-btn{display:none;width:40px;height:40px;border-radius:50%;background:var(--glass-1);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight);color:var(--text-2);place-items:center;transition:all .2s var(--ease);cursor:pointer}
.mobile-menu-btn:hover{background:var(--glass-2);color:var(--text)}
.mobile-menu-btn svg{width:20px;height:20px}
@media (max-width:900px){.mobile-menu-btn{display:grid}}

.mob-nav-bd{position:fixed;inset:0;z-index:100;background:rgba(10,15,25,.4);backdrop-filter:blur(8px);animation:fadeIn .25s var(--ease) both}
.mob-nav{position:fixed;top:0;right:0;bottom:0;z-index:101;width:min(340px,88vw);background:var(--glass-3);backdrop-filter:blur(30px) saturate(1.9);border-left:1px solid var(--glass-border);padding:22px;overflow-y:auto;animation:slideInLeft .36s var(--ease) both;box-shadow:-20px 0 60px -20px rgba(0,0,0,.4)}
.mob-nav-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.mob-nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:100px;color:var(--text-2);font-size:14px;font-weight:500;transition:all .25s var(--ease);margin-bottom:3px;cursor:pointer;text-decoration:none}
.mob-nav a svg{width:18px;height:18px;opacity:.85}
.mob-nav a:hover{background:var(--glass-1);color:var(--text)}
.mob-nav a.active{background:var(--grad-brand);color:#fff;font-weight:600}
.mob-nav a.active svg{color:#fff;opacity:1}
.mob-nav .grp{font-size:10.5px;color:var(--muted);padding:14px 14px 6px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}

.page{max-width:1560px;margin:0 auto;padding:26px 20px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;animation:slideUp .5s var(--ease) both}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.7px;line-height:1.15}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:6px}
.page-actions{display:flex;gap:9px;flex-wrap:wrap}

.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;animation:fadeIn .4s var(--ease) both}
.w-3{grid-column:span 3}.w-4{grid-column:span 4}.w-5{grid-column:span 5}
.w-6{grid-column:span 6}.w-7{grid-column:span 7}.w-8{grid-column:span 8}
@media (max-width:1200px){.w-3,.w-4,.w-5{grid-column:span 6}.w-7,.w-8{grid-column:span 12}}
@media (max-width:760px){.bento>*{grid-column:span 12!important}}

.widget{background:var(--glass-2);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--glass-border);border-radius:22px;padding:18px;box-shadow:var(--glass-highlight),var(--glass-shadow);animation:slideUp .55s var(--ease) both;position:relative;overflow:hidden;transition:all .35s var(--ease)}
.widget::before{content:'';position:absolute;top:0;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);opacity:.9;pointer-events:none}
.widget:hover{box-shadow:var(--glass-highlight),0 16px 40px -14px rgba(15,23,42,.2)}
.w-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.w-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px;letter-spacing:-.2px}
.w-title .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--grad-brand-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(0,122,255,.55)}
.w-title .ic svg{width:14px;height:14px}
.w-title.success .ic{background:var(--grad-success)}
.w-title.warn .ic{background:var(--grad-warn)}
.w-title.danger .ic{background:var(--grad-danger)}
.w-title.info .ic{background:var(--grad-info)}
.w-sub{font-size:11.5px;color:var(--muted);margin-top:3px}

.hero{position:relative;background:var(--grad-brand);background-size:200% 200%;border-radius:28px;padding:28px;color:#fff;overflow:hidden;animation:slideUp .55s var(--ease) both,gradShift 14s ease infinite;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 20px 50px -18px rgba(0,122,255,.6)}
.hero::before{content:'';position:absolute;top:-60%;right:-10%;width:70%;height:180%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 60%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-80%;left:-10%;width:60%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.6px;margin-bottom:8px}
.hero p{opacity:.92;font-size:13.5px;line-height:1.9;max-width:480px}
.hero-stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.hero-stat .k{font-size:11.5px;opacity:.8;margin-bottom:3px}
.hero-stat .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
.hero-stat .v small{font-size:11px;font-weight:500;opacity:.8;margin-right:3px}
.hero-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hero-quick button{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:100px;background:rgba(255,255,255,.2);color:#fff;font-size:12.5px;font-weight:600;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:all .28s var(--ease);cursor:pointer}
.hero-quick button:hover{background:rgba(255,255,255,.3);transform:translateY(-2px) scale(1.03)}
.hero-quick button svg{width:14px;height:14px}

.stat{display:flex;flex-direction:column;padding:18px;background:var(--glass-2);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--glass-border);border-radius:22px;box-shadow:var(--glass-highlight),var(--glass-shadow);transition:all .35s var(--ease);position:relative;overflow:hidden;animation:slideUp .55s var(--ease) both}
.stat::before{content:'';position:absolute;top:0;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);opacity:.9;pointer-events:none}
.stat:hover{transform:translateY(-4px);box-shadow:var(--glass-highlight),0 22px 44px -16px rgba(0,122,255,.3)}
.stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stat-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.stat-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-brand-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -8px rgba(0,122,255,.6)}
.stat-ic svg{width:17px;height:17px}
.stat.success .stat-ic{background:var(--grad-success)}
.stat.warn .stat-ic{background:var(--grad-warn)}
.stat.danger .stat-ic{background:var(--grad-danger)}
.stat.info .stat-ic{background:var(--grad-info)}
.stat-value{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.stat-value small{font-size:12px;font-weight:500;color:var(--muted);margin-right:5px}
.stat-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.stat-delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:100px}
.stat-delta.up{background:rgba(52,199,89,.14);color:#059669}
.stat-delta.down{background:rgba(255,59,48,.14);color:#dc2626}
.stat-delta svg{width:11px;height:11px}

.table-card{background:var(--glass-2);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--glass-border);border-radius:22px;box-shadow:var(--glass-highlight),var(--glass-shadow);overflow:hidden;animation:slideUp .5s var(--ease) both}

.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ios-blue);box-shadow:0 0 0 4px rgba(0,122,255,.24),var(--glass-highlight);background:var(--glass-2)}
.field input:disabled,.field select:disabled{opacity:.6;cursor:not-allowed}

.wiz-steps{display:flex;gap:0;margin-bottom:26px;position:relative}

.drawer-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0;background:var(--glass-1);backdrop-filter:blur(14px)}

var DB_KEY = 'furniture_app_v1';
var SESSION_KEY = 'furniture_session_v1';
var PREFS_KEY = 'furniture_prefs_v1';

function loadDB() {
  var r = null;
  try { r = localStorage.getItem(DB_KEY); } catch (e) {}
  if (!r) return { users: [], warehouses: [], products: [], stocks: [], transfers: [] };
  try {
    var d = JSON.parse(r);
    if (!d.users) d.users = [];
    if (!d.warehouses) d.warehouses = [];
    if (!d.products) d.products = [];
    if (!d.stocks) d.stocks = [];
    if (!d.transfers) d.transfers = [];
    return d;
  } catch (e) {
    return { users: [], warehouses: [], products: [], stocks: [], transfers: [] };
  }
}

function saveDB(db) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {}
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function todayCode() {
  var d = new Date();
  return '' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
}

function tcode(db) {
  var ymd = todayCode();
  var n = 1;
  for (var i = 0; i < db.transfers.length; i++) {
    if (db.transfers[i].code && db.transfers[i].code.indexOf('TR-' + ymd) === 0) n++;
  }
  return 'TR-' + ymd + '-' + ('00' + n).slice(-3);
}

function icode(db) {
  var ymd = todayCode();
  var n = 1;
  for (var i = 0; i < db.transfers.length; i++) {
    if (db.transfers[i].code && db.transfers[i].code.indexOf('IN-' + ymd) === 0) n++;
  }
  return 'IN-' + ymd + '-' + ('00' + n).slice(-3);
}

/* ============================================================
   SEED DATA
   ============================================================ */
function seed() {
  var central = { id: uid(), name: 'انبار مرکزی', type: 'central', isActive: true };
  var paint = { id: uid(), name: 'رنگ‌کاری', type: 'paint', isActive: true };
  var uph = { id: uid(), name: 'رویه‌کوبی', type: 'upholstery', isActive: true };
  var store = { id: uid(), name: 'فروشگاه', type: 'store', isActive: true };
  var customer = { id: uid(), name: 'مشتری', type: 'customer', isActive: true };

  var users = [
    { id: uid(), name: 'مدیر سیستم', username: 'admin', password: 'admin', role: 'admin', isActive: true },
    { id: uid(), name: 'مدیر عامل', username: 'manager', password: 'manager', role: 'manager', isActive: true },
    { id: uid(), name: 'حسابدار', username: 'acc', password: 'acc', role: 'accountant', isActive: true },
    { id: uid(), name: 'مسئول انبار', username: 'wh', password: 'wh', role: 'warehouse_officer', isActive: true }
  ];

  var p1 = { id: uid(), name: 'مبل مدل A', code: 'MB-A', unit: 'دست', createdAt: new Date().toISOString() };
  var p2 = { id: uid(), name: 'مبل مدل B', code: 'MB-B', unit: 'دست', createdAt: new Date().toISOString() };
  var p3 = { id: uid(), name: 'مبل مدل C', code: 'MB-C', unit: 'دست', createdAt: new Date().toISOString() };

  var now = new Date().toISOString();
  function mkStock(pid, wid, q) {
    return { id: uid(), productId: pid, warehouseId: wid, quantity: q, reservedQty: 0, updatedAt: now };
  }

  var stocks = [
    mkStock(p1.id, central.id, 20), mkStock(p1.id, paint.id, 12), mkStock(p1.id, uph.id, 8), mkStock(p1.id, store.id, 5),
    mkStock(p2.id, central.id, 15), mkStock(p2.id, paint.id, 6), mkStock(p2.id, uph.id, 4), mkStock(p2.id, store.id, 3),
    mkStock(p3.id, central.id, 30), mkStock(p3.id, uph.id, 10), mkStock(p3.id, store.id, 2)
  ];

  var transfers = [];

  // A few sample transfers
  for (var i = 0; i < 5; i++) {
    var d = new Date();
    d.setDate(d.getDate() - Math.floor(Math.random() * 7));
    var statuses = ['pending_warehouse', 'pending_accountant', 'pending_manager', 'approved', 'rejected'];
    var st = statuses[i % 5];
    var t = {
      id: uid(),
      code: 'TR-' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '-' + ('00' + (i + 1)).slice(-3),
      type: 'warehouse',
      sourceWarehouseId: [central.id, paint.id, uph.id][i % 3],
      destinationWarehouseId: [paint.id, uph.id, store.id][i % 3],
      productId: [p1.id, p2.id, p3.id][i % 3],
      quantity: 2 + Math.floor(Math.random() * 6),
      description: '',
      status: st,
      createdBy: users[3].id,
      createdByName: users[3].name,
      createdAt: d.toISOString()
    };
    if (st !== 'pending_warehouse') t.warehouseApproval = { userId: users[3].id, userName: users[3].name, at: d.toISOString(), note: '' };
    if (st === 'pending_manager' || st === 'approved' || st === 'rejected') t.accountantApproval = { userId: users[2].id, userName: users[2].name, at: d.toISOString(), note: '' };
    if (st === 'approved') {
      t.managerApproval = { userId: users[1].id, userName: users[1].name, at: d.toISOString(), note: '' };
      t.completedAt = d.toISOString();
    }
    if (st === 'rejected') {
      t.rejection = { userId: users[2].id, userName: users[2].name, at: d.toISOString(), reason: 'مغایرت در شمارش', stage: 'accountant' };
    }
    transfers.push(t);
  }

  // Sample inbound
  var inb1 = {
    id: uid(),
    code: 'IN-' + todayCode() + '-001',
    type: 'inbound',
    supplierName: 'چوب و مصنوعات پارس',
    invoiceNumber: 'INV-9841',
    productId: p1.id,
    quantity: 50,
    sourceWarehouseId: null,
    destinationWarehouseId: central.id,
    description: 'محموله کلاف خام پاییز',
    status: 'pending_warehouse',
    createdBy: users[3].id,
    createdByName: users[3].name,
    createdAt: new Date(Date.now() - 3600000).toISOString()
  };
  transfers.unshift(inb1);

  return {
    warehouses: [central, paint, uph, store, customer],
    users: users,
    products: [p1, p2, p3],
    stocks: stocks,
    transfers: transfers
  };
}

/* ============================================================
   PERMISSIONS
   ============================================================ */
function canCreate(u) {
  return u && ['warehouse_officer', 'admin', 'manager'].indexOf(u.role) >= 0;
}

function canApprove(u, t) {
  if (!u || !t) return false;
  if (t.status === 'approved' || t.status === 'rejected') return false;
  if (t.status === 'pending_warehouse') return ['warehouse_officer', 'admin'].indexOf(u.role) >= 0;
  if (t.status === 'pending_accountant') return ['accountant', 'admin'].indexOf(u.role) >= 0;
  if (t.status === 'pending_manager') return ['manager', 'admin'].indexOf(u.role) >= 0;
  return false;
}

function allowedDest(t) {
  if (t === 'central') return ['paint'];
  if (t === 'paint') return ['upholstery'];
  if (t === 'upholstery') return ['store', 'customer'];
  return [];
}

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    if (c === '&') return '&amp;';
    if (c === '<') return '&lt;';
    if (c === '>') return '&gt;';
    if (c === '"') return '&quot;';
    return '&#39;';
  });
}

function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

function initials(n) {
  return (n || '').split(' ').filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('');
}

function faDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return iso; }
}

function relTime(iso) {
  if (!iso) return '';
  var d = (Date.now() - new Date(iso)) / 1000;
  if (d < 60) return 'همین حالا';
  if (d < 3600) return Math.floor(d / 60) + ' دقیقه پیش';
  if (d < 86400) return Math.floor(d / 3600) + ' ساعت پیش';
  if (d < 604800) return Math.floor(d / 86400) + ' روز پیش';
  return faDate(iso);
}

function findStock(db, pid, wid) {
  for (var i = 0; i < db.stocks.length; i++) {
    if (db.stocks[i].productId === pid && db.stocks[i].warehouseId === wid) return db.stocks[i];
  }
  return null;
}

function getWh(db, id) {
  for (var i = 0; i < db.warehouses.length; i++) {
    if (db.warehouses[i].id === id) return db.warehouses[i];
  }
  return null;
}

function getProd(db, id) {
  for (var i = 0; i < db.products.length; i++) {
    if (db.products[i].id === id) return db.products[i];
  }
  return null;
}

function celebrate(title, desc, type, duration) {
  desc = desc || '';

  duration = duration || 2100;

  $$('.celebrate').forEach(function (el) { el.remove(); });

  var overlay = document.createElement('div');
  overlay.className = 'celebrate ' + type;

  var icon = type === 'success' ? IC.check : type === 'error' ? IC.x : type === 'warn' ? IC.alert : IC.info;
  var hint = type === 'success' ? 'عملیات با موفقیت انجام شد'
    : type === 'error' ? 'لطفاً دوباره تلاش کنید'
    : type === 'warn' ? 'نیاز به بررسی دارد'
    : 'اطلاع‌رسانی سیستم';

  overlay.innerHTML =
    '<div class="celebrate-card">' +
      '<div class="celebrate-icon">' + icon + '</div>' +
      '<div class="celebrate-text">' +
        '<div class="celebrate-title">' + esc(title) + '</div>' +
        (desc ? '<div class="celebrate-desc">' + esc(desc) + '</div>' : '') +
        '<div class="celebrate-hint">' + hint + '</div>' +
      '</div>' +
    '</div>';

  if (type === 'success') {
    var colors = ['#007AFF', '#5856D6', '#AF52DE', '#34C759', '#FF9500', '#5AC8FA', '#FF2D55', '#FFCC00'];
    for (var i = 0; i < 80; i++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      var color = colors[Math.floor(Math.random() * colors.length)];
      var size = 6 + Math.random() * 10;
      c.style.background = color;
      c.style.left = (Math.random() * 100) + '%';
      c.style.width = size + 'px';
      c.style.height = (size * 1.4) + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      c.style.opacity = '0';
      setTimeout((function (el) { return function () { el.style.opacity = '1'; }; })(c), 100);
      overlay.appendChild(c);
    }
  }

  document.body.appendChild(overlay);

  var tm = setTimeout(function () {
    overlay.classList.add('exit');
    setTimeout(function () { overlay.remove(); }, 500);
  }, duration);

  overlay.addEventListener('click', function () {
    clearTimeout(tm);
    overlay.classList.add('exit');
    setTimeout(function () { overlay.remove(); }, 500);
  });
}

/* ============================================================
   MODAL / DRAWER / RIPPLE / COUNTUP
   ============================================================ */
function openModal(opts) {
  var bd = document.createElement('div');
  bd.className = 'modal-bd';
  var bodyHTML = opts.body || '';
  bd.innerHTML =
    '<div class="modal">' +
      '<h3>' + esc(opts.title) + '</h3>' +
      (opts.desc ? '<div class="desc">' + esc(opts.desc) + '</div>' : '') +
      '<div>' + bodyHTML + '</div>' +
      '<div class="modal-actions"></div>' +
    '</div>';

  var acts = bd.querySelector('.modal-actions');
  (opts.actions || []).forEach(function (a) {
    var b = document.createElement('button');
    b.className = 'btn ' + (a.cls || '');
    b.innerHTML = a.label;
    b.addEventListener('click', function () { if (a.onClick) a.onClick(bd); });
    acts.appendChild(b);
  });

  function close() {
    bd.style.animation = 'fadeOut .2s forwards';
    setTimeout(function () { bd.remove(); }, 200);
  }

  bd.addEventListener('click', function (e) { if (e.target === bd) close(); });
  document.body.appendChild(bd);
  attachRippleAll(bd);
  return { close: close, element: bd };
}

function openDrawer(opts) {
  closeDrawer();
  var bd = document.createElement('div');
  bd.className = 'drawer-bd';
  bd.id = 'drawer-bd';
  var dr = document.createElement('div');
  dr.className = 'drawer';
  dr.id = 'drawer';
  dr.innerHTML =
    '<div class="drawer-head">' +
      '<h3>' + opts.title + '</h3>' +
      '<button class="icon-btn" id="drawer-close">' + IC.close + '</button>' +
    '</div>' +
    '<div class="drawer-body">' + opts.body + '</div>' +
    (opts.foot ? '<div class="drawer-foot">' + opts.foot + '</div>' : '');
  document.body.appendChild(bd);
  document.body.appendChild(dr);
  bd.addEventListener('click', closeDrawer);
  var dc = $('#drawer-close');
  if (dc) dc.addEventListener('click', closeDrawer);
  attachRippleAll(dr);
  return dr;
}

function closeDrawer() {
  var bd = $('#drawer-bd');
  var dr = $('#drawer');
  if (bd) { bd.style.animation = 'fadeOut .2s forwards'; setTimeout(function () { bd.remove(); }, 200); }
  if (dr) { dr.style.animation = 'slideInLeft .3s reverse forwards'; setTimeout(function () { dr.remove(); }, 250); }
}

function attachRipple(el) {
  if (el._rip) return;
  el._rip = true;
  el.addEventListener('click', function (e) {
    var r = el.getBoundingClientRect();
    var s = document.createElement('span');
    s.className = 'ripple';
    var sz = Math.max(r.width, r.height);
    s.style.width = s.style.height = sz + 'px';
    s.style.left = (e.clientX - r.left - sz / 2) + 'px';
    s.style.top = (e.clientY - r.top - sz / 2) + 'px';
    el.appendChild(s);
    setTimeout(function () { s.remove(); }, 700);
  });
}

function attachRippleAll(root) {
  $$('.btn', root || document).forEach(function (b) { attachRipple(b); });
}

function countUp(el, target, dur) {
  dur = dur || 800;
  var t0 = performance.now();
  function tick(now) {
    var p = Math.min((now - t0) / dur, 1);
    var e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e).toLocaleString('fa-IR');
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function notifApprove(id) {
  openModal({
    title: 'تأیید مرحله',
    desc: 'آیا از تأیید این مرحله مطمئن هستید؟',
    body: '<div class="field"><label>یادداشت (اختیاری)</label><textarea id="ap-note" placeholder="..."></textarea></div>',
    actions: [
      { label: 'انصراف', cls: 'ghost', onClick: function (c) { c.remove(); } },
      { label: IC.check + ' تأیید', cls: 'success', onClick: function (c) {
        var btn = c.querySelector('button.success');
        if (btn) btn.classList.add('loading');
        var noteBox = $('#ap-note', c);
        var note = noteBox ? noteBox.value.trim() : '';
        setTimeout(function () {
          try {
            var db = loadDB();
            var t = null;
            for (var i = 0; i < db.transfers.length; i++) {
              if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
            }
            if (!t) { c.remove(); return; }
            if (!canApprove(State.user, t)) { c.remove(); celebrate('دسترسی ندارید', '', 'error', 1800); return; }
            var step = { userId: State.user.id, userName: State.user.name, at: new Date().toISOString(), note: note };

            if (t.type === 'inbound') {
              if (t.status === 'pending_warehouse') { t.warehouseApproval = step; t.status = 'pending_accountant'; }
              else if (t.status === 'pending_accountant') { t.accountantApproval = step; t.status = 'pending_manager'; }
              else if (t.status === 'pending_manager') {
                t.managerApproval = step;
                var ds = findStock(db, t.productId, t.destinationWarehouseId);
                if (!ds) {
                  ds = { id: uid(), productId: t.productId, warehouseId: t.destinationWarehouseId, quantity: 0, reservedQty: 0, updatedAt: new Date().toISOString() };
                  db.stocks.push(ds);
                }
                ds.quantity += t.quantity;
                ds.updatedAt = new Date().toISOString();
                t.status = 'approved';
                t.completedAt = new Date().toISOString();
              }
            } else {
              if (t.status === 'pending_warehouse') { t.warehouseApproval = step; t.status = 'pending_accountant'; }
              else if (t.status === 'pending_accountant') { t.accountantApproval = step; t.status = 'pending_manager'; }
              else if (t.status === 'pending_manager') {
                t.managerApproval = step;
                var srcStock = findStock(db, t.productId, t.sourceWarehouseId);
                if (!srcStock || srcStock.quantity < t.quantity) {
                  c.remove();
                  celebrate('موجودی کافی نیست', 'امکان تأیید نهایی وجود ندارد', 'error', 2000);
                  return;
                }
                srcStock.quantity -= t.quantity;
                srcStock.reservedQty = Math.max(0, (srcStock.reservedQty || 0) - t.quantity);
                srcStock.updatedAt = new Date().toISOString();
                var dstW = getWh(db, t.destinationWarehouseId);
                if (dstW && dstW.type !== 'customer') {
                  var ds2 = findStock(db, t.productId, t.destinationWarehouseId);
                  if (!ds2) {
                    ds2 = { id: uid(), productId: t.productId, warehouseId: t.destinationWarehouseId, quantity: 0, reservedQty: 0, updatedAt: new Date().toISOString() };
                    db.stocks.push(ds2);
                  }
                  ds2.quantity += t.quantity;
                  ds2.updatedAt = new Date().toISOString();
                }
                t.status = 'approved';
                t.completedAt = new Date().toISOString();
              }
            }

            saveDB(db);
            c.remove();

            if (t.status === 'approved') {
              celebrate(
                t.type === 'inbound' ? 'ورود کالا ثبت شد ✓' : 'انتقال قطعی شد ✓',
                t.type === 'inbound' ? 'موجودی انبار مرکزی افزایش یافت' : 'موجودی مبدأ و مقصد به‌روزرسانی شد',
                'success', 2000
              );
            } else {
              celebrate('تأیید شد', 'به مرحله بعد منتقل شد', 'success', 1600);
            }

            setTimeout(function () { openNotifPanel(); render(); }, 300);
          } catch (err) {
            c.remove();
            celebrate('خطا', err.message || 'عملیات ناموفق', 'error', 2000);
          }
        }, 450);
      } }
    ]
  });
}

            var stageMap = { pending_warehouse: 'warehouse', pending_accountant: 'accountant', pending_manager: 'manager' };
            var stage = stageMap[t.status];

            if (t.type !== 'inbound') {
              var srcStock = findStock(db, t.productId, t.sourceWarehouseId);
              if (srcStock) {
                srcStock.reservedQty = Math.max(0, (srcStock.reservedQty || 0) - t.quantity);
                srcStock.updatedAt = new Date().toISOString();
              }
            }

            t.rejection = { userId: State.user.id, userName: State.user.name, at: new Date().toISOString(), reason: reason, stage: stage };
            t.status = 'rejected';
            saveDB(db);
            c.remove();
            celebrate('درخواست رد شد', t.type === 'inbound' ? '' : 'رزرو موجودی آزاد شد', 'error', 1900);
            setTimeout(function () { openNotifPanel(); render(); }, 300);
          } catch (err) {
            c.remove();
            celebrate('خطا', err.message || 'عملیات ناموفق', 'error', 2000);
          }
        }, 400);
      } }
    ]
  });
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
function openCmd() {
  if ($('#cmd-bd')) return;
  var bd = document.createElement('div');
  bd.className = 'cmd-bd';
  bd.id = 'cmd-bd';
  var items = NAV.filter(function (i) { return i.roles.indexOf(State.user.role) >= 0; });
  bd.innerHTML = '<div class="cmd"><input id="cmd-input" placeholder="جستجو یا اجرای دستور..." autocomplete="off" /><div class="cmd-list" id="cmd-list"></div></div>';
  document.body.appendChild(bd);

  var input = $('#cmd-input');
  var list = $('#cmd-list');
  var sel = 0;
  var cmds = [];

  function build(q) {
    q = q || '';
    var query = q.toLowerCase().trim();
    var navItems = items.map(function (i) {
      return { label: i.label, icon: i.icon, kbd: '↵', run: function () { navigate(i.key); }, sec: 'صفحه‌ها' };
    });
    var acts = [
      { label: 'درخواست جابه‌جایی جدید', icon: IC.plus, run: function () { navigate('newTransfer'); }, sec: 'اقدامات' },
      { label: 'ثبت ورود کالا', icon: IC.factory, run: function () { navigate('newInbound'); }, sec: 'اقدامات' },
      { label: 'مرکز اعلان‌ها', icon: IC.bell, run: function () { openNotifPanel(); }, sec: 'اقدامات' },
      { label: State.theme === 'light' ? 'حالت تاریک' : 'حالت روشن', icon: State.theme === 'light' ? IC.moon : IC.sun, run: toggleTheme, sec: 'تنظیمات' },
      { label: 'خروج از حساب', icon: IC.logout, run: doLogout, sec: 'تنظیمات' }
    ];
    cmds = navItems.concat(acts);
    var f = query ? cmds.filter(function (c) { return c.label.toLowerCase().indexOf(query) >= 0; }) : cmds;
    if (!f.length) {
      list.innerHTML = '<div class="cmd-empty">موردی یافت نشد</div>';
      return;
    }
    var html = '';
    var lastSec = null;
    f.forEach(function (c, i) {
      if (c.sec && c.sec !== lastSec) {
        html += '<div class="cmd-sec">' + c.sec + '</div>';
        lastSec = c.sec;
      }
      html += '<div class="cmd-item ' + (i === sel ? 'sel' : '') + '" data-i="' + i + '">' + c.icon + '<b>' + c.label + '</b>' + (c.kbd ? '<span class="kbd">' + c.kbd + '</span>' : '') + '</div>';
    });
    list.innerHTML = html;
    list._f = f;
    $$('.cmd-item', list).forEach(function (el) {
      el.addEventListener('click', function () { closeCmd(); f[+el.dataset.i].run(); });
      el.addEventListener('mouseenter', function () {
        sel = +el.dataset.i;
        $$('.cmd-item', list).forEach(function (x) { x.classList.toggle('sel', +x.dataset.i === sel); });
      });
    });
  }

  build('');
  input.focus();
  input.addEventListener('input', function () { sel = 0; build(input.value); });
  input.addEventListener('keydown', function (e) {
    var f = list._f || [];
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, f.length - 1); $$('.cmd-item', list).forEach(function (x) { x.classList.toggle('sel', +x.dataset.i === sel); }); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); $$('.cmd-item', list).forEach(function (x) { x.classList.toggle('sel', +x.dataset.i === sel); }); }
    if (e.key === 'Enter') { e.preventDefault(); var c = f[sel]; if (c) { closeCmd(); c.run(); } }
    if (e.key === 'Escape') closeCmd();
  });
  bd.addEventListener('click', function (e) { if (e.target === bd) closeCmd(); });
}

function closeCmd() {
  var x = $('#cmd-bd');
  if (x) x.remove();
}

function toggleTheme() {

}

function doLogin(username, password) {
  var users = loadDB().users;
  for (var i = 0; i < users.length; i++) {
    var u = users[i];
    if (u.username === username && u.password === password && u.isActive) {
      try { localStorage.setItem(SESSION_KEY, u.id); } catch (e) {}
      State.user = u;
      return u;
    }
  }
  return null;
}

function doLogout() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  State.user = null;
  navigate('dashboard');
  celebrate('خارج شدید', 'به امید دیدار', 'info', 1600);
}

function makeSpark(data, w, h) {
  var max = Math.max.apply(null, data.concat([1]));
  var pts = [];
  for (var i = 0; i < data.length; i++) {
    pts.push({ x: (i * w) / (data.length - 1), y: h - 2 - ((data[i] / max) * (h - 4)) });
  }
  return pts.map(function (p, i) { return (i === 0 ? 'M' : 'L') + ' ' + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join(' ');
}

function emptyState(title, desc) {

function transferItemHTML(db, t) {
  var st = stFor(t);
  var isInbound = t.type === 'inbound';
  var p = getProd(db, t.productId);
  var src = getWh(db, t.sourceWarehouseId);
  var dst = getWh(db, t.destinationWarehouseId);

  var stepsHTML = '';
  for (var i = 1; i <= 4; i++) {
    var cls = '';
    if (t.status === 'rejected') {
      var rStepMap = { warehouse: 1, accountant: 2, manager: 3 };
      var rStep = t.rejection ? rStepMap[t.rejection.stage] : 0;
      if (i < rStep) cls = 'done';
      else if (i === rStep) cls = 'rejected';
    } else {
      if (i < st.step) cls = 'done';
      else if (i === st.step) cls = 'active';
    }
    stepsHTML += '<div class="t-step ' + cls + '"></div>';
  }

  var routeHTML = isInbound
    ? '<div class="t-route" style="color:#0369a1">' + IC.factory + ' ' + esc(t.supplierName || '—') + ' ' + IC.arrowL + ' ' + esc((dst && dst.name) || '—') + '</div>'
    : '<div class="t-route">' + esc((src && src.name) || '—') + ' ' + IC.arrowL + ' ' + esc((dst && dst.name) || '—') + '</div>';

  return '<div class="t-item" data-tid="' + t.id + '">' +
    '<div class="t-row1">' +
      '<span class="t-code">' + esc(t.code) + '</span>' +
      '<span class="badge ' + st.tone + '"><span class="dot"></span>' + st.label + '</span>' +
      (isInbound ? '<span class="badge inbound">' + IC.inbound + ' ورود</span>' : '') +
      '<span class="small muted" style="margin-right:auto">' + relTime(t.createdAt) + '</span>' +
    '</div>' +
    '<div class="t-row2">' +
      routeHTML +
      '<span>' + esc((p && p.name) || '') + '</span>' +
      '<span class="t-qty">' + t.quantity + ' ' + esc((p && p.unit) || '') + '</span>' +
      '<div class="t-progress">' + stepsHTML + '</div>' +
    '</div>' +
  '</div>';
}

  function draw() {
    var rows = db.stocks.filter(function (s) {
      if (state.wh && s.warehouseId !== state.wh) return false;
      if (state.pid && s.productId !== state.pid) return false;
      if (state.q) {
        var p = getProd(db, s.productId);
        if (!p) return false;
        var q = state.q.toLowerCase();
        if (p.name.toLowerCase().indexOf(q) < 0 && (p.code || '').toLowerCase().indexOf(q) < 0) return false;
      }
      return true;
    }).map(function (s) {
      return { s: s, p: getProd(db, s.productId), w: getWh(db, s.warehouseId) };
    }).filter(function (r) { return r.p && r.w && r.w.type !== 'customer'; });

    var tbl = $('#s-table');
    var sub = $('#stock-sub');
    if (sub) sub.textContent = rows.length + ' ردیف · ' + db.warehouses.filter(function (w) { return w.type !== 'customer'; }).length + ' انبار';

    if (!rows.length) {
      tbl.innerHTML = '<div class="table-empty">' + IC.inbox + '<b>موردی یافت نشد</b><p>فیلترها را تغییر دهید یا از بخش مقداردهی اولیه استفاده کنید</p></div>';
      return;
    }

    tbl.innerHTML =
      '<table class="data-table">' +
        '<thead><tr>' +
          '<th style="width:36%">کالا</th>' +
          '<th style="width:18%">انبار</th>' +
          '<th style="width:14%;text-align:left">موجودی</th>' +
          '<th style="width:10%;text-align:left">رزرو</th>' +
          '<th style="width:14%;text-align:left">قابل استفاده</th>' +
          '<th style="width:12%" class="col-sm-hide">به‌روزرسانی</th>' +
        '</tr></thead>' +
        '<tbody>' +
          rows.map(function (r) {
            return '<tr>' +
              '<td><div class="cell-product"><b>' + esc(r.p.name) + '</b>' + (r.p.code ? '<span class="code-chip">' + esc(r.p.code) + '</span>' : '') + '</div></td>' +
              '<td><div class="wh-cell"><span class="wh-dot" style="background:' + (WH_COLOR[r.w.type] || '#94a3b8') + ';color:' + (WH_COLOR[r.w.type] || '#94a3b8') + '"></span><span>' + esc(r.w.name) + '</span></div></td>' +
              '<td class="num">' + r.s.quantity + ' <span class="unit">' + esc(r.p.unit || '') + '</span></td>' +
              '<td class="num muted">' + (r.s.reservedQty || 0) + '</td>' +
              '<td class="num"><span class="qty-highlight">' + (r.s.quantity - (r.s.reservedQty || 0)) + '</span></td>' +
              '<td class="date-cell col-sm-hide">' + relTime(r.s.updatedAt) + '</td>' +
            '</tr>';
          }).join('') +
        '</tbody>' +
      '</table>';
  }

  ['s-q', 's-wh', 's-pid'].forEach(function (id) {
    $('#' + id).addEventListener('input', function (e) {
      if (id === 's-q') state.q = e.target.value.trim();
      else if (id === 's-wh') state.wh = e.target.value;
      else state.pid = e.target.value;
      draw();
    });
  });

  draw();
}

function pageStockInit(page) {
  var db = loadDB();

  page.innerHTML =
    '<div class="page-head"><div><h1>مقداردهی اولیه</h1><div class="sub">ثبت یا جایگزینی موجودی کالا (بدون تأیید — فقط برای راه‌اندازی)</div></div></div>' +
    '<div class="widget" style="max-width:760px">' +
      '<form id="if" class="form-grid">' +
        '<div class="field"><label>کالا <span class="req">*</span></label><select id="ip" required><option value="">انتخاب کنید...</option>' +
          db.products.map(function (p) { return '<option value="' + p.id + '">' + esc(p.name) + (p.code ? ' — ' + esc(p.code) : '') + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>انبار <span class="req">*</span></label><select id="iw" required><option value="">انتخاب کنید...</option>' +

        '</select></div>' +
        '<div class="field"><label>تعداد <span class="req">*</span></label><input id="iq" type="number" min="0" step="1" required placeholder="0" /></div>' +
        '<div class="full row" style="justify-content:flex-end;margin-top:6px"><button class="btn primary" type="submit">' + IC.check + ' ثبت موجودی</button></div>' +
      '</form>' +
      '<div style="height:1px;background:var(--border);margin:16px 0"></div>' +
      '<div class="row" style="gap:10px;font-size:12.5px;color:var(--muted)">' + IC.info + '<span>این بخش بدون تأیید است — برای ورود کالا از تأمین‌کننده از «ثبت ورود» استفاده کنید.</span></div>' +
    '</div>';

  $('#if').addEventListener('submit', function (e) {
    e.preventDefault();
    var pid = $('#ip').value;
    var wid = $('#iw').value;

    var fresh = loadDB();
    var s = findStock(fresh, pid, wid);
    if (s) { s.quantity = qty; s.updatedAt = new Date().toISOString(); }
    else { fresh.stocks.push({ id: uid(), productId: pid, warehouseId: wid, quantity: qty, reservedQty: 0, updatedAt: new Date().toISOString() }); }
    saveDB(fresh);
    celebrate('موجودی ثبت شد', 'موجودی با موفقیت به‌روزرسانی شد', 'success', 1700);
    navigate('stock');
  });

  attachRippleAll();
}

/* ============================================================
   DRAWER: TRANSFER DETAILS
   ============================================================ */
function openTransferDrawer(id) {
  var db = loadDB();
  var t = null;
  for (var i = 0; i < db.transfers.length; i++) {
    if (db.transfers[i].id === id) { t = db.transfers[i]; break; }
  }
  if (!t) { celebrate('درخواست یافت نشد', '', 'error', 1600); return; }

  var st = stFor(t);
  var isInbound = t.type === 'inbound';
  var p = getProd(db, t.productId);
  var src = getWh(db, t.sourceWarehouseId);
  var dst = getWh(db, t.destinationWarehouseId);

  var steps = [
    { title: 'ثبت درخواست', done: true, at: t.createdAt, user: t.createdByName, icon: IC.plus },
    { title: 'تأیید مسئول انبار', step: t.warehouseApproval, key: 'warehouse', icon: IC.package },
    { title: 'تأیید حسابدار', step: t.accountantApproval, key: 'accountant', icon: IC.shield },
    { title: 'تأیید مدیر', step: t.managerApproval, key: 'manager', icon: IC.users },
    { title: isInbound ? 'ورود قطعی' : 'انتقال قطعی', done: !!t.completedAt, at: t.completedAt, icon: IC.check }
  ];

  var rMap = { warehouse: 1, accountant: 2, manager: 3 };
  var rStep = t.rejection ? rMap[t.rejection.stage] : -1;

  var tlHTML = steps.map(function (s, i) {
    var cls = '';
    if (i === 0 || i === 4) {
      cls = s.done ? 'done' : '';
    } else {
      if (s.step) cls = 'done';
      else if (i === rStep) cls = 'rejected';
      else if (i === (st.step - 1)) cls = 'active';
    }
    var meta = [];
    if (s.at) meta.push('<b>' + esc(s.user || '') + '</b> · ' + faDate(s.at));
    if (s.step) meta.push('<b>' + esc(s.step.userName) + '</b> · ' + faDate(s.step.at));
    if (i === rStep && t.rejection) {
      meta.push('<span style="color:#FF3B30">رد شد توسط <b>' + esc(t.rejection.userName) + '</b><br>دلیل: ' + esc(t.rejection.reason) + '<br>' + faDate(t.rejection.at) + '</span>');
    }
    var icon = cls === 'done' ? IC.check : cls === 'rejected' ? IC.x : cls === 'active' ? IC.clock : s.icon;
    return '<li class="' + cls + '"><div class="tl-node">' + icon + '</div><div class="tl-title">' + s.title + '</div>' + (meta.length ? '<div class="tl-meta">' + meta.join('<br>') + '</div>' : '') + '</li>';
  }).join('');

  var headerBadges = isInbound
    ? '<span class="badge inbound">' + IC.inbound + ' ورود کالا</span><span class="badge ' + st.tone + '"><span class="dot"></span>' + st.label + '</span>'
    : '<span class="badge ' + st.tone + '"><span class="dot"></span>' + st.label + '</span>';

  var body =
    '<div class="dl" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));display:grid;gap:1px;margin-bottom:16px">' +
      '<div class="dl-item"><div class="k">وضعیت</div><div class="v"><div style="display:flex;gap:6px;flex-wrap:wrap">' + headerBadges + '</div></div></div>' +
      '<div class="dl-item"><div class="k">نوع</div><div class="v">' + (isInbound ? 'ورود از تأمین‌کننده' : (t.type === 'direct-customer' ? 'ارسال مستقیم' : 'انتقال انبار')) + '</div></div>' +
      (isInbound
        ? '<div class="dl-item"><div class="k">تأمین‌کننده</div><div class="v">' + esc(t.supplierName || '—') + '</div></div>' +
          '<div class="dl-item"><div class="k">انبار مقصد</div><div class="v">' + esc((dst && dst.name) || '—') + '</div></div>'
        : '<div class="dl-item"><div class="k">مبدأ</div><div class="v">' + esc((src && src.name) || '—') + '</div></div>' +
          '<div class="dl-item"><div class="k">مقصد</div><div class="v">' + esc((dst && dst.name) || '—') + '</div></div>') +
      '<div class="dl-item"><div class="k">کالا</div><div class="v">' + esc((p && p.name) || '—') + (p && p.code ? ' <span class="small muted">(' + esc(p.code) + ')</span>' : '') + '</div></div>' +
      '<div class="dl-item"><div class="k">تعداد</div><div class="v">' + t.quantity + ' ' + esc((p && p.unit) || '') + '</div></div>' +
      (isInbound && t.invoiceNumber ? '<div class="dl-item"><div class="k">شماره فاکتور</div><div class="v" style="font-family:monospace;font-size:12.5px">' + esc(t.invoiceNumber) + '</div></div>' : '') +
    '</div>' +
    (t.customerName ? '<div class="dl" style="grid-template-columns:1fr 1fr;display:grid;gap:1px;margin-bottom:16px"><div class="dl-item"><div class="k">مشتری</div><div class="v">' + esc(t.customerName) + '</div></div><div class="dl-item"><div class="k">تماس</div><div class="v">' + esc(t.customerPhone || '—') + '</div></div></div>' : '') +
    (t.description ? '<div class="dl" style="margin-bottom:16px"><div class="dl-item"><div class="k">توضیحات</div><div class="v" style="font-weight:400">' + esc(t.description) + '</div></div></div>' : '') +
    '<div style="font-size:13.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px"><span style="width:4px;height:14px;border-radius:3px;background:var(--grad-brand)"></span>مراحل تأیید</div>' +
    '<ul class="tl">' + tlHTML + '</ul>';

  var foot = '';
  if (canApprove(State.user, t)) {
    foot = '<button class="btn success" id="d-approve" style="flex:1">' + IC.check + ' تأیید</button><button class="btn danger" id="d-reject">' + IC.x + ' رد</button>';
  } else {
    foot = '<div class="muted small" style="text-align:center;width:100%">اقدامی برای شما در دسترس نیست</div>';
  }

  openDrawer({
    title: '<span style="font-family:monospace;font-size:13px;color:var(--muted)">' + esc(t.code) + '</span>',
    body: body,
    foot: foot
  });

  var ap = $('#d-approve');
  if (ap) ap.addEventListener('click', function () { closeDrawer(); notifApprove(t.id); });
  var rj = $('#d-reject');
  if (rj) rj.addEventListener('click', function () { closeDrawer(); notifReject(t.id); });
}

/* ============================================================
   PAGE: NEW TRANSFER
   ============================================================ */
function pageNewTransfer(page) {
  var db = loadDB();
  var sources = db.warehouses.filter(function (w) { return ['central', 'paint', 'upholstery'].indexOf(w.type) >= 0; });
  var state = { step: 1, src: '', dst: '', pid: '', qty: 0, desc: '' };

  page.innerHTML =
    '<div class="page-head"><div><h1>درخواست جابه‌جایی</h1><div class="sub">انتقال کالا بین انبارهای داخلی با سه مرحله تأیید</div></div></div>' +
    '<div class="widget" style="max-width:760px;margin:0 auto">' +
      '<div class="wiz-steps">' +
        '<div class="wiz-line"><div class="wiz-line-fill" id="wiz-fill"></div></div>' +
        '<div class="wiz-step active"><div class="num">۱</div><div class="lbl">مسیر</div></div>' +
        '<div class="wiz-step"><div class="num">۲</div><div class="lbl">کالا و تعداد</div></div>' +
        '<div class="wiz-step"><div class="num">۳</div><div class="lbl">تأیید نهایی</div></div>' +
      '</div>' +
      '<div id="wiz-body"></div>' +
      '<div style="display:flex;gap:10px;margin-top:22px;justify-content:space-between">' +
        '<button class="btn ghost" id="wiz-back">' + IC.arrowR + ' قبلی</button>' +
        '<button class="btn primary" id="wiz-next">بعدی ' + IC.arrowL + '</button>' +
      '</div>' +
    '</div>';

  function updateSteps() {
    $$('.wiz-step').forEach(function (el, i) {
      el.classList.toggle('active', i + 1 === state.step);
      el.classList.toggle('done', i + 1 < state.step);
    });
    $('#wiz-fill').style.width = ((state.step - 1) / 2 * 100) + '%';
  }

  function draw() {
    updateSteps();
    var body = $('#wiz-body');
    var back = $('#wiz-back');
    var next = $('#wiz-next');
    back.style.visibility = state.step === 1 ? 'hidden' : 'visible';
    next.innerHTML = state.step === 3 ? (IC.check + ' ثبت نهایی') : ('بعدی ' + IC.arrowL);

    if (state.step === 1) {
      var srcW = null;
      for (var i = 0; i < sources.length; i++) { if (sources[i].id === state.src) { srcW = sources[i]; break; } }
      var allowed = state.src ? allowedDest(srcW && srcW.type) : [];
      var dests = db.warehouses.filter(function (w) { return allowed.indexOf(w.type) >= 0; });

      body.innerHTML = '<div class="form-grid">' +
        '<div class="field"><label>انبار مبدأ <span class="req">*</span></label><select id="w-src"><option value="">انتخاب کنید...</option>' +
          sources.map(function (w) { return '<option value="' + w.id + '" ' + (state.src === w.id ? 'selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>انبار مقصد <span class="req">*</span></label><select id="w-dst" ' + (!state.src ? 'disabled' : '') + '><option value="">' + (state.src ? 'انتخاب کنید...' : 'ابتدا مبدأ') + '</option>' +
          dests.map(function (w) { return '<option value="' + w.id + '" ' + (state.dst === w.id ? 'selected' : '') + '>' + esc(w.name) + '</option>'; }).join('') +
        '</select></div>' +
      '</div>' +
      '<div style="margin-top:16px" class="muted small">مسیر مجاز: مرکزی ← رنگ‌کاری ← رویه‌کوبی ← فروشگاه / مشتری</div>';

      $('#w-src').addEventListener('change', function (e) { state.src = e.target.value; state.dst = ''; draw(); });
      $('#w-dst').addEventListener('change', function (e) { state.dst = e.target.value; });
    } else if (state.step === 2) {
      var stock = findStock(db, state.pid, state.src);
      var avail = stock ? stock.quantity - (stock.reservedQty || 0) : 0;

      body.innerHTML = '<div class="form-grid">' +
        '<div class="field"><label>کالا <span class="req">*</span></label><select id="w-pid"><option value="">انتخاب کنید...</option>' +
          db.products.map(function (p) { return '<option value="' + p.id + '" ' + (state.pid === p.id ? 'selected' : '') + '>' + esc(p.name) + (p.code ? ' — ' + esc(p.code) : '') + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>تعداد <span class="req">*</span></label><input id="w-qty" type="number" min="1" step="1" value="' + (state.qty || '') + '" placeholder="0" /></div>' +
        '<div class="full field"><label>توضیحات</label><textarea id="w-desc" placeholder="...">' + esc(state.desc) + '</textarea></div>' +
        (state.pid && state.src ? '<div class="full"><div style="padding:14px 18px;background:var(--grad-brand-soft);border:1px solid rgba(0,122,255,.2);border-radius:20px;font-size:12.5px">موجودی قابل استفاده: <b style="color:#007AFF;font-size:16px">' + avail + '</b> <span class="muted">(کل ' + (stock ? stock.quantity : 0) + ' — رزرو ' + (stock ? (stock.reservedQty || 0) : 0) + ')</span></div></div>' : '') +
      '</div>';

      $('#w-pid').addEventListener('change', function (e) { state.pid = e.target.value; state.qty = 0; draw(); });
      $('#w-qty').addEventListener('input', function (e) { state.qty = +e.target.value; });
      $('#w-desc').addEventListener('input', function (e) { state.desc = e.target.value; });
    } else {
      var srcW2 = getWh(db, state.src);
      var dstW = getWh(db, state.dst);
      var p2 = getProd(db, state.pid);

      body.innerHTML = '<div class="dl" style="grid-template-columns:1fr 1fr;display:grid;gap:1px">' +
        '<div class="dl-item"><div class="k">مبدأ</div><div class="v">' + esc((srcW2 && srcW2.name) || '') + '</div></div>' +
        '<div class="dl-item"><div class="k">مقصد</div><div class="v">' + esc((dstW && dstW.name) || '') + '</div></div>' +
        '<div class="dl-item"><div class="k">کالا</div><div class="v">' + esc((p2 && p2.name) || '') + '</div></div>' +
        '<div class="dl-item"><div class="k">تعداد</div><div class="v">' + state.qty + ' ' + esc((p2 && p2.unit) || '') + '</div></div>' +
        (state.desc ? '<div class="dl-item" style="grid-column:1/-1"><div class="k">توضیحات</div><div class="v" style="font-weight:400">' + esc(state.desc) + '</div></div>' : '') +
      '</div>' +
      '<div style="height:1px;background:var(--border);margin:16px 0"></div>' +
      '<div class="row" style="gap:10px;font-size:12.5px;color:var(--muted)">' + IC.info + '<span>پس از ثبت، درخواست در انتظار تأیید مسئول انبار قرار می‌گیرد.</span></div>';
    }
  }

  $('#wiz-back').addEventListener('click', function () { if (state.step > 1) { state.step--; draw(); } });

  $('#wiz-next').addEventListener('click', function () {
    if (state.step === 1) {
      if (!state.src || !state.dst) { celebrate('اطلاعات ناقص', 'ابتدا مبدأ و مقصد را انتخاب کنید', 'warn', 1600); return; }
      state.step = 2; draw();
    } else if (state.step === 2) {
      if (!state.pid || !state.qty || state.qty <= 0) { celebrate('اطلاعات ناقص', 'کالا و تعداد را وارد کنید', 'warn', 1600); return; }
      var stock = findStock(db, state.pid, state.src);
      var avail = stock ? stock.quantity - (stock.reservedQty || 0) : 0;
      if (state.qty > avail) { celebrate('موجودی کافی نیست', 'قابل استفاده: ' + avail, 'error', 1900); return; }
      state.step = 3; draw();
    } else {
      var btn = $('#wiz-next');
      btn.classList.add('loading');
      setTimeout(function () {
        var fresh = loadDB();
        var srcStock = findStock(fresh, state.pid, state.src);
        if (!srcStock) { btn.classList.remove('loading'); celebrate('کالا یافت نشد', '', 'error', 1600); return; }
        var avail2 = srcStock.quantity - (srcStock.reservedQty || 0);
        if (state.qty > avail2) { btn.classList.remove('loading'); celebrate('موجودی کافی نیست', '', 'error', 1800); return; }
        srcStock.reservedQty = (srcStock.reservedQty || 0) + state.qty;
        srcStock.updatedAt = new Date().toISOString();

        var dstW = getWh(fresh, state.dst);
        var t = {
          id: uid(),
          code: tcode(fresh),
          type: dstW.type === 'customer' ? 'direct-customer' : 'warehouse',
          sourceWarehouseId: state.src,
          destinationWarehouseId: state.dst,
          productId: state.pid,
          quantity: state.qty,
          description: state.desc,
          status: 'pending_warehouse',
          createdBy: State.user.id,
          createdByName: State.user.name,
          createdAt: new Date().toISOString()
        };
        fresh.transfers.unshift(t);
        saveDB(fresh);
        celebrate('درخواست ثبت شد', 'در انتظار تأیید مسئول انبار', 'success', 1900);
        navigate('transfers');
      }, 450);
    }
  });

  draw();
  attachRippleAll();
}

/* ============================================================
   PAGE: DIRECT CUSTOMER
   ============================================================ */
function pageDirectCustomer(page) {
  var db = loadDB();
  var uph = db.warehouses.filter(function (w) { return w.type === 'upholstery'; })[0];

  page.innerHTML =
    '<div class="page-head"><div><h1>ارسال مستقیم به مشتری</h1><div class="sub">ثبت خروج مبل از انبار رویه‌کوبی</div></div></div>' +
    '<div class="widget" style="max-width:760px">' +
      '<form id="dcf" class="form-grid">' +
        '<div class="field"><label>کالا <span class="req">*</span></label><select id="dp" required><option value="">انتخاب کنید...</option>' +
          db.products.map(function (p) { return '<option value="' + p.id + '">' + esc(p.name) + (p.code ? ' — ' + esc(p.code) : '') + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>تعداد <span class="req">*</span></label><input id="dq" type="number" min="1" step="1" required placeholder="0" /></div>' +
        '<div class="field"><label>نام مشتری <span class="req">*</span></label><input id="dn" required placeholder="آقای احمدی" /></div>' +
        '<div class="field"><label>شماره تماس</label><input id="dph" placeholder="0912..." /></div>' +
        '<div class="full field"><label>توضیحات</label><textarea id="dd" placeholder="آدرس، سفارش خاص..."></textarea></div>' +
        '<div class="full" id="dav"></div>' +
        '<div class="full row" style="justify-content:flex-end;margin-top:6px">' +
          '<button class="btn ghost" type="button" id="cancel-btn">انصراف</button>' +
          '<button class="btn primary" type="submit">' + IC.truck + ' ثبت درخواست</button>' +
        '</div>' +
      '</form>' +
    '</div>';

  function upd() {
    var pid = $('#dp').value;
    var box = $('#dav');
    if (!pid) { box.innerHTML = ''; return; }
    var s = findStock(db, pid, uph.id);
    if (!s) {
      box.innerHTML = '<div style="padding:14px 18px;background:rgba(255,59,48,.1);border:1px solid rgba(255,59,48,.22);border-radius:20px;color:#FF3B30;font-size:12.5px">این کالا در رویه‌کوبی موجود نیست</div>';
      return;
    }
    var avail = s.quantity - (s.reservedQty || 0);
    box.innerHTML = '<div style="padding:14px 18px;background:var(--grad-brand-soft);border:1px solid rgba(0,122,255,.2);border-radius:20px;font-size:12.5px">موجودی قابل استفاده: <b style="color:#007AFF;font-size:16px">' + avail + '</b></div>';
  }

  $('#dp').addEventListener('change', upd);
  var cb = $('#cancel-btn'); if (cb) cb.addEventListener('click', function () { navigate('transfers'); });

  $('#dcf').addEventListener('submit', function (e) {
    e.preventDefault();
    var pid = $('#dp').value;
    var qty = +$('#dq').value;
    var name = $('#dn').value.trim();
    var phone = $('#dph').value.trim();
    var desc = $('#dd').value.trim();
    if (!pid || !qty || qty <= 0 || !name) { celebrate('اطلاعات ناقص', 'همه فیلدهای لازم را پر کنید', 'warn', 1600); return; }

    var fresh = loadDB();
    var customer = fresh.warehouses.filter(function (w) { return w.type === 'customer'; })[0];
    var uphW = fresh.warehouses.filter(function (w) { return w.type === 'upholstery'; })[0];
    var s = findStock(fresh, pid, uphW.id);
    var avail = s ? s.quantity - (s.reservedQty || 0) : 0;
    if (!s || qty > avail) { celebrate('موجودی کافی نیست', 'قابل استفاده: ' + avail, 'error', 1900); return; }

    s.reservedQty = (s.reservedQty || 0) + qty;
    s.updatedAt = new Date().toISOString();

    var t = {
      id: uid(),
      code: tcode(fresh),
      type: 'direct-customer',
      sourceWarehouseId: uphW.id,
      destinationWarehouseId: customer.id,
      productId: pid,
      quantity: qty,
      customerName: name,
      customerPhone: phone,
      description: desc,
      status: 'pending_warehouse',
      createdBy: State.user.id,
      createdByName: State.user.name,
      createdAt: new Date().toISOString()
    };
    fresh.transfers.unshift(t);
    saveDB(fresh);
    celebrate('درخواست ارسال ثبت شد', 'در انتظار تأیید مسئول انبار', 'success', 1900);
    navigate('transfers');
  });

  attachRippleAll();
}

        (db.products.length
          ? '<table class="data-table"><thead><tr><th style="width:50px">#</th><th style="width:38%">نام کالا</th><th style="width:18%">کد</th><th style="width:14%">واحد</th><th style="width:20%" class="col-sm-hide">تاریخ ثبت</th><th style="width:60px"></th></tr></thead><tbody>' +

              return '<tr>' +
                '<td><span class="row-num">' + (i + 1) + '</span></td>' +
                '<td><b style="color:var(--text);font-weight:700">' + esc(p.name) + '</b></td>' +
                '<td>' + (p.code ? '<span class="code-chip">' + esc(p.code) + '</span>' : '<span class="muted small">—</span>') + '</td>' +
                '<td>' + esc(p.unit || '—') + '</td>' +
                '<td class="date-cell col-sm-hide">' + faDate(p.createdAt) + '</td>' +
                '<td class="actions-cell"><button class="btn xs danger" data-del="' + p.id + '" title="حذف">' + IC.trash + '</button></td>' +
              '</tr>';
            }).join('') +
            '</tbody></table>'
          : '<div class="table-empty">' + IC.inbox + '<b>کالایی ثبت نشده</b><p>با فرم بالا اولین کالا را اضافه کنید</p></div>') +
      '</div>' +
    '</div>';

  $('#pf').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('#pn').value.trim();
    var code = $('#pc').value.trim();
    var unit = $('#pu').value.trim() || 'دست';
    if (!name) return;
    var fresh = loadDB();
    fresh.products.push({ id: uid(), name: name, code: code, unit: unit, createdAt: new Date().toISOString() });
    saveDB(fresh);
    celebrate('کالا افزوده شد', '«' + name + '» به لیست اضافه شد', 'success', 1700);
    render();
  });

  $$('[data-del]').forEach(function (b) {
    b.addEventListener('click', function () {
      var id = b.dataset.del;
      var fresh = loadDB();
      var used = fresh.stocks.some(function (s) { return s.productId === id && s.quantity > 0; })
        || fresh.transfers.some(function (t) { return t.productId === id; });
      if (used) { celebrate('قابل حذف نیست', 'این کالا در موجودی یا انتقال‌ها استفاده شده', 'error', 2000); return; }
      openModal({
        title: 'حذف کالا', desc: 'آیا مطمئنید؟',
        actions: [
          { label: 'انصراف', cls: 'ghost', onClick: function (c) { c.remove(); } },
          { label: 'حذف', cls: 'danger', onClick: function (c) {
            var f = loadDB();
            f.products = f.products.filter(function (p) { return p.id !== id; });
            f.stocks = f.stocks.filter(function (s) { return s.productId !== id; });
            saveDB(f);
            c.remove();
            celebrate('کالا حذف شد', '', 'success', 1600);
            render();
          } }
        ]
      });
    });
  });

  attachRippleAll();
}

                '<td>' + ROLES[u.role] + '</td>' +
                '<td>' + (u.isActive ? '<span class="status-pill on"><span class="dot"></span>فعال</span>' : '<span class="status-pill off"><span class="dot"></span>غیرفعال</span>') + '</td>' +
                '<td class="actions-cell">' + (u.id === State.user.id ? '<span class="muted small">(شما)</span>' : '<button class="btn xs ' + (u.isActive ? 'warn' : 'success') + '" data-tog="' + u.id + '">' + (u.isActive ? 'غیرفعال' : 'فعال') + '</button>') + '</td>' +
              '</tr>';
            }).join('') +
          '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';

  $('#uf').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('#un').value.trim();
    var username = $('#uu').value.trim();
    var password = $('#up').value;
    var role = $('#ur').value;
    if (!name || !username || !password) return;
    var fresh = loadDB();
    if (fresh.users.some(function (u) { return u.username === username; })) {
      celebrate('نام کاربری تکراری', 'این نام کاربری قبلاً استفاده شده است', 'error', 1900);
      return;
    }
    fresh.users.push({ id: uid(), name: name, username: username, password: password, role: role, isActive: true });
    saveDB(fresh);
    celebrate('کاربر افزوده شد', '«' + name + '» به سیستم اضافه شد', 'success', 1800);
    render();
  });

  $$('[data-tog]').forEach(function (b) {
    b.addEventListener('click', function () {
      var fresh = loadDB();
      var u = fresh.users.filter(function (x) { return x.id === b.dataset.tog; })[0];
      if (!u) return;
      u.isActive = !u.isActive;
      saveDB(fresh);
      celebrate(u.isActive ? 'کاربر فعال شد' : 'کاربر غیرفعال شد', u.name, 'success', 1500);
      render();
    });
  });

  attachRippleAll();
}

/* ============================================================
   GLOBAL KEYS
   ============================================================ */
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openCmd();
  }
  if (e.key === 'Escape') {
    closeCmd();
    closeDrawer();
    closeNotifPanel();
    var m = document.querySelector('.modal-bd'); if (m) m.remove();
    var mn = document.querySelector('.mob-nav-bd'); if (mn) mn.remove();
    var mn2 = document.querySelector('.mob-nav'); if (mn2) mn2.remove();
    var us = document.querySelector('.userm'); if (us) us.remove();
    $$('.celebrate').forEach(function (el) { el.remove(); });
  }
  if (!e.target.matches('input,textarea,select') && !e.metaKey && !e.ctrlKey && State.user) {
    var map = { '1': 'dashboard', '2': 'stock', '3': 'transfers', '4': 'inbounds' };
    if (map[e.key] && NAV.filter(function (n) { return n.key === map[e.key] && n.roles.indexOf(State.user.role) >= 0; }).length) {
      navigate(map[e.key]);
    }
  }
});

window.navigate = navigate;

/* ============================================================
   BOOT
   ============================================================ */
try {
  render();
} catch (err) {
  var e = document.getElementById('err');
  if (e) {
    e.style.display = 'block';
    e.textContent = 'BOOT ERROR: ' + (err.message || err) + '\n' + (err.stack || '');
  }
}

})();
</script>
</body>
</html>
