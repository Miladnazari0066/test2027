<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Furniture · سیستم مدیریت موجودی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ios-blue:#007AFF;--ios-green:#34C759;--ios-red:#FF3B30;--ios-orange:#FF9500;--ios-purple:#AF52DE;--ios-teal:#5AC8FA;
  --brand-1:#007AFF;--brand-2:#5856D6;
  --grad-brand:linear-gradient(135deg,#007AFF 0%,#5856D6 55%,#AF52DE 120%);
  --grad-brand-2:linear-gradient(135deg,#007AFF,#5856D6);
  --grad-brand-soft:linear-gradient(135deg,rgba(0,122,255,.15),rgba(175,82,222,.10));
  --grad-success:linear-gradient(135deg,#34C759,#00A14B);
  --grad-warn:linear-gradient(135deg,#FF9500,#E67E00);
  --grad-danger:linear-gradient(135deg,#FF3B30,#D70015);
  --grad-info:linear-gradient(135deg,#5AC8FA,#0EA5E9);
  --glass-1:rgba(255,255,255,0.62);--glass-2:rgba(255,255,255,0.78);--glass-3:rgba(255,255,255,0.9);
  --glass-border:rgba(255,255,255,0.7);--glass-border-2:rgba(255,255,255,0.9);
  --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.95),inset 0 -1px 0 rgba(255,255,255,0.35);
  --glass-shadow:0 8px 32px -8px rgba(15,23,42,0.12),0 2px 8px -2px rgba(15,23,42,0.06);
  --bg:#eef2f9;--surface:#fff;--surface-2:#f6f8fc;--surface-3:#eef1f8;
  --border:rgba(15,23,42,0.08);--border-2:rgba(15,23,42,0.14);
  --text:#0a1220;--text-2:#334155;--muted:#64748b;--muted-2:#94a3b8;
  --ring:rgba(0,122,255,.24);
  --r:14px;--r-md:18px;--r-lg:22px;--r-xl:28px;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --nav:68px;
}
[data-theme="dark"]{
  --glass-1:rgba(30,35,50,0.55);--glass-2:rgba(30,35,50,0.72);--glass-3:rgba(30,35,50,0.88);
  --glass-border:rgba(255,255,255,0.09);--glass-border-2:rgba(255,255,255,0.16);
  --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.08),inset 0 -1px 0 rgba(0,0,0,0.3);
  --glass-shadow:0 8px 32px -8px rgba(0,0,0,0.5);
  --bg:#06070d;--surface:#0f1420;--surface-2:#161d2c;--surface-3:#1e2739;
  --border:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.14);
  --text:#eef2f8;--text-2:#cbd5e1;--muted:#94a3b8;--muted-2:#64748b;
  --ring:rgba(0,122,255,.35);
}
html,body{height:100%}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 12% -10%,rgba(0,122,255,.18),transparent 60%),radial-gradient(800px 500px at 95% 5%,rgba(175,82,222,.16),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(90,200,250,.14),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(100,116,139,.25);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--ios-blue);outline-offset:2px;border-radius:8px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
@keyframes spinner{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes confettiFall{0%{transform:translateY(-20vh) rotate(0);opacity:1}100%{transform:translateY(120vh) rotate(720deg);opacity:0}}
@keyframes circleGrow{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes celebrateExit{to{opacity:0;transform:scale(1.15)}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes ripple{to{transform:scale(3);opacity:0}}
@keyframes shutterLift{0%{transform:translateY(0)}15%{transform:translateY(-4%)}100%{transform:translateY(-105%)}}
@keyframes railFade{to{opacity:0}}
@keyframes lightBurst{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
@keyframes badgeReveal{0%{opacity:0;transform:translate(-50%,-42%) scale(.55)}100%{opacity:0;transform:translate(-50%,-62%) scale(.9)}}
@keyframes notifSlideIn{from{opacity:0;transform:translateX(-100%)}to{opacity:1;transform:none}}
@keyframes notifOut{to{opacity:0;transform:translateX(-100%)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:100px;font-size:13.5px;font-weight:600;background:var(--glass-2);color:var(--text);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight),0 4px 14px -6px rgba(15,23,42,.14);transition:all .28s var(--ease);position:relative;overflow:hidden;white-space:nowrap;cursor:pointer}
.btn:hover{transform:translateY(-2px) scale(1.02);background:var(--glass-3)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px}
.btn.xs{height:28px;padding:0 11px;font-size:11.5px}
.btn.primary{background:var(--grad-brand);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -8px rgba(0,122,255,.65)}
.btn.success{background:var(--grad-success);color:#fff;border-color:transparent}
.btn.danger{background:var(--grad-danger);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border:1px solid var(--border-2);box-shadow:none}
.btn.ghost:hover{background:var(--glass-1)}
.btn.block{width:100%}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading::after{content:'';position:absolute;top:50%;left:50%;margin:-8px 0 0 -8px;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spinner .7s linear infinite}

.nav-icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--glass-1);border:1px solid var(--glass-border);box-shadow:var(--glass-highlight);position:relative;cursor:pointer}
.nav-icon:hover{background:var(--glass-2);color:var(--text)}
.nav-icon svg{width:18px;height:18px}
.nav-icon .pulse{position:absolute;top:5px;left:5px;width:10px;height:10px;border-radius:50%;background:var(--ios-red);box-shadow:0 0 0 2px var(--bg)}

.nav-wrap{position:sticky;top:0;z-index:50;padding:12px 20px 0}
.navbar{height:var(--nav);max-width:1560px;margin:0 auto;background:var(--glass-2);border:1px solid var(--glass-border);border-radius:100px;display:flex;align-items:center;gap:12px;padding:0 12px 0 20px;box-shadow:var(--glass-highlight),var(--glass-shadow)}
.nav-brand{display:flex;align-items:center;gap:11px;flex-shrink:0;padding-left:6px}
.brand-logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-brand);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -8px rgba(0,122,255,.7)}
.brand-logo svg{width:21px;height:21px}
.brand-text{font-weight:800;font-size:14.5px;line-height:1.15}
.brand-text small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
@media (max-width:640px){.brand-text{display:none}}
.nav-pills{display:flex;align-items:center;gap:3px;background:var(--glass-1);border:1px solid var(--glass-border);border-radius:100px;padding:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-pills::-webkit-scrollbar{display:none}
.nav-pill{display:flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:100px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;flex-shrink:0;cursor:pointer}
.nav-pill svg{width:15px;height:15px;opacity:.8}
.nav-pill.active{background:var(--grad-brand);color:#fff}
.nav-pill.active svg{opacity:1}
.nav-pill .kbd{font-size:10px;padding:1px 6px;border-radius:100px;background:rgba(15,23,42,.08);color:var(--muted)}
.nav-pill.active .kbd{background:rgba(255,255,255,.25);color:#fff}
.nav-pill .nav-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;background:#fff;color:var(--ios-red)}
@media (max-width:900px){.nav-pills{display:none}}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.search-trigger{display:flex;align-items:center;gap:9px;height:40px;padding:0 14px;background:var(--glass-1);border:1px solid var(--glass-border);border-radius:100px;color:var(--muted);font-size:12.5px;cursor:pointer;min-width:220px}
.search-trigger svg{width:14px;height:14px}
.search-trigger kbd{margin-right:auto;font-family:inherit;font-size:10.5px;padding:2px 7px;border-radius:100px;background:rgba(15,23,42,.08);color:var(--muted)}
@media (max-width:1100px){.search-trigger{min-width:40px;padding:0;width:40px;justify-content:center}.search-trigger span,.search-trigger kbd{display:none}}
.user-btn{display:flex;align-items:center;gap:9px;height:44px;padding:3px 4px 3px 12px;border-radius:100px;background:var(--glass-1);border:1px solid var(--glass-border);cursor:pointer}
.user-btn .avatar{width:34px;height:34px;font-size:12px}
.user-btn .avatar::after{display:none}
.user-btn svg{width:13px;height:13px;color:var(--muted)}
@media (max-width:520px){.user-btn{padding:3px}.user-btn .who-text,.user-btn > svg:last-child{display:none}}
.user-btn .who-text{display:none;text-align:right}
@media (min-width:900px){.user-btn .who-text{display:block}}
.user-btn .who-text b{display:block;font-size:12.5px;font-weight:700;line-height:1.2}
.user-btn .who-text span{display:block;font-size:10.5px;color:var(--muted)}
.mobile-menu-btn{display:none;width:40px;height:40px;border-radius:50%;background:var(--glass-1);border:1px solid var(--glass-border);color:var(--text-2);place-items:center;cursor:pointer}
.mobile-menu-btn svg{width:20px;height:20px}
@media (max-width:900px){.mobile-menu-btn{display:grid}}

.page{max-width:1560px;margin:0 auto;padding:26px 20px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:26px;font-weight:800;line-height:1.15}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:6px}
.page-actions{display:flex;gap:9px;flex-wrap:wrap}

.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.w-3{grid-column:span 3}.w-4{grid-column:span 4}.w-5{grid-column:span 5}
.w-6{grid-column:span 6}.w-7{grid-column:span 7}.w-8{grid-column:span 8}
@media (max-width:1200px){.w-3,.w-4,.w-5{grid-column:span 6}.w-7,.w-8{grid-column:span 12}}
@media (max-width:760px){.bento>*{grid-column:span 12!important}}

.widget{background:var(--glass-2);border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--glass-highlight),var(--glass-shadow);position:relative;overflow:hidden}
.w-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.w-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.w-title .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--grad-brand-2)}
.w-title .ic svg{width:14px;height:14px}
.w-title.success .ic{background:var(--grad-success)}
.w-title.warn .ic{background:var(--grad-warn)}
.w-title.danger .ic{background:var(--grad-danger)}
.w-title.info .ic{background:var(--grad-info)}
.w-sub{font-size:11.5px;color:var(--muted);margin-top:3px}

.hero{position:relative;background:var(--grad-brand);background-size:200% 200%;border-radius:var(--r-xl);padding:28px;color:#fff;overflow:hidden;animation:gradShift 14s ease infinite;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 20px 50px -18px rgba(0,122,255,.6)}
.hero h2{font-size:24px;font-weight:800;margin-bottom:8px}
.hero p{opacity:.92;font-size:13.5px;line-height:1.9;max-width:480px}
.hero-stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.hero-stat .k{font-size:11.5px;opacity:.8;margin-bottom:3px}
.hero-stat .v{font-size:22px;font-weight:800}
.hero-stat .v small{font-size:11px;font-weight:500;opacity:.8;margin-right:3px}
.hero-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.hero-quick button{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:100px;background:rgba(255,255,255,.2);color:#fff;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.3);cursor:pointer}
.hero-quick button:hover{background:rgba(255,255,255,.3)}
.hero-quick button svg{width:14px;height:14px}

.stat{display:flex;flex-direction:column;padding:18px;background:var(--glass-2);border:1px solid var(--glass-border);border-radius:var(--r-lg)}
.stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stat-title{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.stat-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-brand-2)}
.stat-ic svg{width:17px;height:17px}
.stat.success .stat-ic{background:var(--grad-success)}
.stat.warn .stat-ic{background:var(--grad-warn)}
.stat.info .stat-ic{background:var(--grad-info)}
.stat-value{font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.stat-delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:100px}
.stat-delta.up{background:rgba(52,199,89,.14);color:#059669}
.stat-delta.down{background:rgba(255,59,48,.14);color:#dc2626}
.stat-delta svg{width:11px;height:11px}
.spark{width:80px;height:30px}

.ring-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:var(--surface-3)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center b{font-size:26px;font-weight:800}
.ring-center span{font-size:11px;color:var(--muted);font-weight:600}
.ring-list{flex:1;min-width:150px;display:flex;flex-direction:column;gap:12px}
.rl{display:flex;align-items:center;gap:10px;font-size:12.5px}
.rl-dot{width:10px;height:10px;border-radius:3px}
.rl b{margin-right:auto;font-weight:700}
.rl-bar{height:6px;border-radius:100px;background:var(--surface-3);flex:1;overflow:hidden;max-width:80px}
.rl-bar>div{height:100%;border-radius:100px}

.feed{display:flex;flex-direction:column;gap:2px}
.feed-item{display:flex;gap:12px;padding:11px;border-radius:14px;cursor:pointer}
.feed-item:hover{background:var(--glass-1)}
.feed-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:var(--grad-brand-2);position:relative}
.feed-av.success{background:var(--grad-success)}
.feed-av.warn{background:var(--grad-warn)}
.feed-av.danger{background:var(--grad-danger)}
.feed-av.info{background:var(--grad-info)}
.feed-av .badge-mini{position:absolute;bottom:-2px;left:-2px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2px solid var(--bg);background:var(--grad-brand)}
.feed-av .badge-mini svg{width:9px;height:9px}
.feed-body{flex:1;min-width:0}
.feed-title{font-size:13px;font-weight:600;line-height:1.55}
.feed-title b{color:var(--brand-1);font-weight:700}
.feed-title .tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10.5px;font-weight:700;margin:0 3px;background:var(--surface-3);color:var(--text-2)}
.feed-meta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.feed-meta svg{width:11px;height:11px}

.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:15px;border-radius:var(--r-md);background:var(--glass-1);border:1px solid var(--glass-border);text-align:right;cursor:pointer}
.qa-btn .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad-brand-2)}
.qa-btn .ic svg{width:18px;height:18px}
.qa-btn.alt-1 .ic{background:var(--grad-success)}
.qa-btn.alt-2 .ic{background:var(--grad-warn)}
.qa-btn.alt-3 .ic{background:var(--grad-info)}
.qa-btn b{font-size:12.5px;font-weight:700}
.qa-btn span{font-size:11px;color:var(--muted)}

.pipe{display:flex;flex-direction:column;gap:8px}
.pipe-step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--glass-1);border:1px solid var(--glass-border)}
.pipe-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.pipe-step.active .pipe-num{background:var(--grad-brand);color:#fff;border-color:transparent}
.pipe-step.done .pipe-num{background:var(--grad-success);color:#fff;border-color:transparent}
.pipe-step .lbl{flex:1;font-size:12.5px;font-weight:600}
.pipe-step .lbl small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.pipe-count{font-size:13px;font-weight:800;padding:4px 11px;border-radius:100px;background:var(--surface);border:1px solid var(--border)}

.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.bar{width:100%;border-radius:8px 8px 3px 3px;background:var(--grad-brand-2);min-height:5px}
.bar-lbl{font-size:10.5px;color:var(--muted);text-align:center}
.bar-col.success .bar{background:var(--grad-success)}
.bar-col.warn .bar{background:var(--grad-warn)}
.bar-col.info .bar{background:var(--grad-info)}

.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.heat-cell{aspect-ratio:1;border-radius:5px;background:var(--surface-3)}
.heat-cell.l1{background:rgba(0,122,255,.22)}
.heat-cell.l2{background:rgba(0,122,255,.42)}
.heat-cell.l3{background:rgba(0,122,255,.68)}
.heat-cell.l4{background:var(--brand-1)}
.heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--muted)}
.heat-legend .c{width:12px;height:12px;border-radius:4px}

.team{display:flex;flex-direction:column;gap:2px}
.team-row{display:flex;align-items:center;gap:11px;padding:10px;border-radius:14px}
.team-info{flex:1;min-width:0}
.team-info b{display:block;font-size:12.5px;font-weight:700}
.team-info span{display:block;font-size:11px;color:var(--muted)}
.team-role{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:100px;background:var(--glass-1);color:var(--text-2);border:1px solid var(--glass-border)}

.top-list{display:flex;flex-direction:column;gap:14px}
.top-item{display:flex;align-items:center;gap:12px}
.top-rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.top-body{flex:1;min-width:0}

.notif-card{background:var(--glass-2);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:14px 16px}

.demo{margin-top:26px;padding:16px;background:var(--glass-1);border:1px solid var(--glass-border);border-radius:22px}

.tl li{position:relative;padding:0 0 24px}
.tl-node{position:absolute;right:-32px;top:2px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--border);display:grid;place-items:center;color:var(--muted)}
.tl-node svg{width:12px;height:12px}
.tl li.done .tl-node{background:var(--grad-success);border-color:transparent;color:#fff}
.tl li.active .tl-node{background:var(--grad-brand);border-color:transparent;color:#fff}
.tl li.rejected .tl-node{background:var(--grad-danger);border-color:transparent;color:#fff}
.tl-title{font-weight:700;font-size:13.5px;margin-bottom:3px}
.tl-meta{font-size:12px;color:var(--muted);line-height:1.75}
.empty{padding:48px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:64px;height:64px;opacity:.3}
.empty b{font-size:15px;font-weight:700}

.wiz-steps{display:flex;gap:0;margin-bottom:26px;position:relative}
.wiz-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.wiz-step .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass-1);color:var(--muted);font-weight:700;font-size:13px;border:1px solid var(--glass-border)}
.wiz-step .lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-align:center}
.wiz-step.active .num{background:var(--grad-brand);color:#fff;border-color:transparent}
.wiz-step.active .lbl{color:var(--ios-blue)}
.wiz-step.done .num{background:var(--grad-success);color:#fff;border-color:transparent}
.wiz-line{position:absolute;top:20px;right:0;left:0;height:3px;background:var(--surface-3);border-radius:100px;overflow:hidden}
.wiz-line-fill{position:absolute;top:0;right:0;height:100%;background:var(--grad-brand);width:0;transition:width .6s var(--ease);border-radius:100px}

#err{position:fixed;top:0;left:0;right:0;z-index:99999;background:#ff3b30;color:#fff;padding:12px 20px;font-family:monospace;font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap;display:none}

function loadDB(){
  try{
    var r=localStorage.getItem(DB_KEY);
    if(!r)return {users:[],warehouses:[],products:[],stocks:[],transfers:[]};
    var d=JSON.parse(r);
    if(!d.users)d.users=[];
    if(!d.warehouses)d.warehouses=[];
    if(!d.products)d.products=[];
    if(!d.stocks)d.stocks=[];
    if(!d.transfers)d.transfers=[];
    return d;
  }catch(e){return {users:[],warehouses:[],products:[],stocks:[],transfers:[]}}
}
function saveDB(db){try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function todayStr(){var d=new Date();return ''+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)}
function tcode(db){var ymd=todayStr();var n=db.transfers.filter(function(t){return t.code&&t.code.indexOf('TR-'+ymd)===0}).length+1;return 'TR-'+ymd+'-'+('00'+n).slice(-3)}
function icode(db){var ymd=todayStr();var n=db.transfers.filter(function(t){return t.code&&t.code.indexOf('IN-'+ymd)===0}).length+1;return 'IN-'+ymd+'-'+('00'+n).slice(-3)}

function canCreate(u){return u&&['warehouse_officer','admin','manager'].indexOf(u.role)>=0}
function canApprove(u,t){
  if(!u||!t)return false;
  if(t.status==='approved'||t.status==='rejected')return false;
  if(t.status==='pending_warehouse')return ['warehouse_officer','admin'].indexOf(u.role)>=0;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){if(c==='&')return '&amp;';if(c==='<')return '&lt;';if(c==='>')return '&gt;';if(c==='"')return '&quot;';return '&#39;'})}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function initials(n){return (n||'').split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0]}).join('')}
function faDate(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString('fa-IR')}catch(e){return iso}}
function relTime(iso){if(!iso)return '';var d=(Date.now()-new Date(iso))/1000;if(d<60)return 'همین حالا';if(d<3600)return Math.floor(d/60)+' دقیقه پیش';if(d<86400)return Math.floor(d/3600)+' ساعت پیش';if(d<604800)return Math.floor(d/86400)+' روز پیش';return faDate(iso)}

function celebrate(title,desc,type,duration){
  desc=desc||'';type=type||'success';duration=duration||2100;
  $$('.celebrate').forEach(function(el){el.remove()});
  var overlay=document.createElement('div');
  overlay.className='celebrate '+type;
  var icon=type==='success'?IC.check:type==='error'?IC.x:type==='warn'?IC.alert:IC.info;
  var hint=type==='success'?'عملیات با موفقیت انجام شد':type==='error'?'لطفاً دوباره تلاش کنید':type==='warn'?'نیاز به بررسی دارد':'اطلاع‌رسانی سیستم';
  overlay.innerHTML='<div class="celebrate-card"><div class="celebrate-icon">'+icon+'</div><div><div class="celebrate-title">'+esc(title)+'</div>'+(desc?'<div class="celebrate-desc">'+esc(desc)+'</div>':'')+'<div class="celebrate-hint">'+hint+'</div></div></div>';
  if(type==='success'){
    var colors=['#007AFF','#5856D6','#AF52DE','#34C759','#FF9500','#5AC8FA','#FF2D55','#FFCC00'];
    for(var i=0;i<80;i++){
      var c=document.createElement('div');c.className='confetti';
      var color=colors[Math.floor(Math.random()*colors.length)];
      var size=6+Math.random()*10;
      c.style.background=color;c.style.left=(Math.random()*100)+'%';
      c.style.width=size+'px';c.style.height=(size*1.4)+'px';
      c.style.animationDuration=(1.6+Math.random()*1.2)+'s';
      c.style.animationDelay=(Math.random()*0.4)+'s';
      overlay.appendChild(c);
    }
  }
  document.body.appendChild(overlay);
  var tm=setTimeout(function(){overlay.classList.add('exit');setTimeout(function(){overlay.remove()},500)},duration);
  overlay.addEventListener('click',function(){clearTimeout(tm);overlay.classList.add('exit');setTimeout(function(){overlay.remove()},500)});
}

function modal(opts){
  var bd=document.createElement('div');
  bd.className='modal-bd';
  var bodyHTML=opts.body||'';
  bd.innerHTML='<div class="modal"><h3>'+esc(opts.title)+'</h3>'+(opts.desc?'<div class="desc">'+esc(opts.desc)+'</div>':'')+'<div>'+bodyHTML+'</div><div class="modal-actions"></div></div>';
  var acts=bd.querySelector('.modal-actions');
  (opts.actions||[]).forEach(function(a){
    var b=document.createElement('button');
    b.className='btn '+(a.cls||'');
    b.innerHTML=a.label;
    b.addEventListener('click',function(){if(a.onClick)a.onClick(bd)});
    acts.appendChild(b);
  });
  function close(){bd.style.animation='fadeOut .2s forwards';setTimeout(function(){bd.remove()},200)}
  bd.addEventListener('click',function(e){if(e.target===bd)close()});
  document.body.appendChild(bd);
  attachRippleAll(bd);
  return {close:close,element:bd};
}

function closeDrawer(){
  var bd=$('#drawer-bd'),dr=$('#drawer');
  if(bd){bd.style.animation='fadeOut .2s forwards';setTimeout(function(){bd.remove()},200)}
  if(dr){dr.style.animation='slideInLeft .3s reverse forwards';setTimeout(function(){dr.remove()},250)}
}
function attachRipple(el){
  el.addEventListener('click',function(e){
    var r=el.getBoundingClientRect();
    var s=document.createElement('span');
    s.style.position='absolute';
    s.style.borderRadius='50%';
    s.style.background='radial-gradient(circle,rgba(255,255,255,.65),rgba(255,255,255,0) 70%)';
    s.style.transform='scale(0)';
    s.style.pointerEvents='none';
    s.style.animation='ripple .7s ease-out';
    var sz=Math.max(r.width,r.height);
    s.style.width=s.style.height=sz+'px';
    s.style.left=(e.clientX-r.left-sz/2)+'px';
    s.style.top=(e.clientY-r.top-sz/2)+'px';
    el.appendChild(s);
    setTimeout(function(){s.remove()},700);
  });
}
function attachRippleAll(root){
  $$('.btn',root||document).forEach(function(b){
    if(!b._rip){b._rip=true;attachRipple(b)}
  });
}
function countUp(el,target,dur){
  dur=dur||800;
  var t0=performance.now();
  function tick(now){
    var p=Math.min((now-t0)/dur,1);
    var e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e).toLocaleString('fa-IR');
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function notifApprove(id){
  modal({
    title:'تأیید مرحله',desc:'آیا از تأیید این مرحله مطمئن هستید؟',
    body:'<div class="field"><label>یادداشت (اختیاری)</label><textarea id="ap-note" placeholder="..."></textarea></div>',
    actions:[
      {label:'انصراف',cls:'ghost',onClick:function(c){c.remove()}},
      {label:IC.check+' تأیید',cls:'success',onClick:function(c){
        var btn=c.querySelector('button.success');if(btn)btn.classList.add('loading');
        var noteBox=$('#ap-note',c);
        var note=noteBox?noteBox.value.trim():'';
        setTimeout(function(){
          try{
            var db=loadDB();
            var t=null;
            for(var i=0;i<db.transfers.length;i++){if(db.transfers[i].id===id){t=db.transfers[i];break}}
            if(!t){c.remove();return}
            if(!canApprove(State.user,t)){c.remove();celebrate('دسترسی ندارید','','error',1800);return}
            var step={userId:State.user.id,userName:State.user.name,at:new Date().toISOString(),note:note};
            if(t.type==='inbound'){
              if(t.status==='pending_warehouse'){t.warehouseApproval=step;t.status='pending_accountant'}
              else if(t.status==='pending_accountant'){t.accountantApproval=step;t.status='pending_manager'}
              else if(t.status==='pending_manager'){
                t.managerApproval=step;
                var ds=findStock(db,t.productId,t.destinationWarehouseId);
                if(!ds){ds={id:uid(),productId:t.productId,warehouseId:t.destinationWarehouseId,quantity:0,reservedQty:0,updatedAt:new Date().toISOString()};db.stocks.push(ds)}
                ds.quantity+=t.quantity;
                ds.updatedAt=new Date().toISOString();
                t.status='approved';t.completedAt=new Date().toISOString();
              }
            }else{
              if(t.status==='pending_warehouse'){t.warehouseApproval=step;t.status='pending_accountant'}
              else if(t.status==='pending_accountant'){t.accountantApproval=step;t.status='pending_manager'}
              else if(t.status==='pending_manager'){
                t.managerApproval=step;
                var srcStock=findStock(db,t.productId,t.sourceWarehouseId);
                if(!srcStock||srcStock.quantity<t.quantity){c.remove();celebrate('موجودی کافی نیست','','error',2000);return}
                srcStock.quantity-=t.quantity;
                srcStock.reservedQty=Math.max(0,(srcStock.reservedQty||0)-t.quantity);
                srcStock.updatedAt=new Date().toISOString();
                var dstW=getWh(db,t.destinationWarehouseId);
                if(dstW&&dstW.type!=='customer'){
                  var ds2=findStock(db,t.productId,t.destinationWarehouseId);
                  if(!ds2){ds2={id:uid(),productId:t.productId,warehouseId:t.destinationWarehouseId,quantity:0,reservedQty:0,updatedAt:new Date().toISOString()};db.stocks.push(ds2)}
                  ds2.quantity+=t.quantity;
                  ds2.updatedAt=new Date().toISOString();
                }
                t.status='approved';t.completedAt=new Date().toISOString();
              }
            }
            saveDB(db);
            c.remove();
            if(t.status==='approved'){
              celebrate(t.type==='inbound'?'ورود کالا ثبت شد':'انتقال قطعی شد',t.type==='inbound'?'موجودی انبار مرکزی افزایش یافت':'موجودی به‌روزرسانی شد','success',2000);
            }else{
              celebrate('تأیید شد','به مرحله بعد منتقل شد','success',1600);
            }
            setTimeout(function(){openNotifPanel();render()},300);
          }catch(err){
            c.remove();
            celebrate('خطا',err.message||'عملیات ناموفق','error',2000);
          }
        },400);
      }}
    ]
  });
}

function notifReject(id){
  modal({
    title:'رد درخواست',desc:'دلیل رد را وارد کنید.',
    body:'<div class="field"><label>دلیل <span class="req">*</span></label><textarea id="rj-reason" placeholder="..."></textarea></div>',
    actions:[
      {label:'انصراف',cls:'ghost',onClick:function(c){c.remove()}},
      {label:IC.x+' ثبت رد',cls:'danger',onClick:function(c){
        var reasonBox=$('#rj-reason',c);
        var reason=reasonBox?reasonBox.value.trim():'';
        if(!reason){celebrate('دلیل الزامی است','','warn',1600);return}
        var btn=c.querySelector('button.danger');if(btn)btn.classList.add('loading');
        setTimeout(function(){
          try{
            var db=loadDB();
            var t=null;
            for(var i=0;i<db.transfers.length;i++){if(db.transfers[i].id===id){t=db.transfers[i];break}}
            if(!t){c.remove();return}
            if(!canApprove(State.user,t)){c.remove();celebrate('دسترسی ندارید','','error',1800);return}
            var stageMap={pending_warehouse:'warehouse',pending_accountant:'accountant',pending_manager:'manager'};
            var stage=stageMap[t.status];
            if(t.type!=='inbound'){
              var srcStock=findStock(db,t.productId,t.sourceWarehouseId);
              if(srcStock){
                srcStock.reservedQty=Math.max(0,(srcStock.reservedQty||0)-t.quantity);
                srcStock.updatedAt=new Date().toISOString();
              }
            }
            t.rejection={userId:State.user.id,userName:State.user.name,at:new Date().toISOString(),reason:reason,stage:stage};
            t.status='rejected';
            saveDB(db);
            c.remove();
            celebrate('درخواست رد شد','','error',1900);
            setTimeout(function(){openNotifPanel();render()},300);
          }catch(err){
            c.remove();
            celebrate('خطا',err.message||'عملیات ناموفق','error',2000);
          }
        },400);
      }}
    ]
  });
}

function openCmd(){
  if($('#cmd-bd'))return;
  var bd=document.createElement('div');
  bd.className='cmd-bd';bd.id='cmd-bd';
  var items=NAV.filter(function(i){return i.roles.indexOf(State.user.role)>=0});
  bd.innerHTML='<div class="cmd"><input id="cmd-input" placeholder="جستجو یا اجرای دستور..." autocomplete="off" /><div class="cmd-list" id="cmd-list"></div></div>';
  document.body.appendChild(bd);
  var input=$('#cmd-input'),list=$('#cmd-list');
  var sel=0;
  function build(q){
    q=q||'';
    var query=q.toLowerCase().trim();
    var nav=items.map(function(i){return {label:i.label,icon:i.icon,kbd:'↵',run:function(){navigate(i.key)},sec:'صفحه‌ها'}});
    var acts=[
      {label:'درخواست جابه‌جایی جدید',icon:IC.plus,run:function(){navigate('newTransfer')},sec:'اقدامات'},
      {label:'ثبت ورود کالا',icon:IC.factory,run:function(){navigate('newInbound')},sec:'اقدامات'},
      {label:'مرکز اعلان‌ها',icon:IC.bell,run:function(){openNotifPanel()},sec:'اقدامات'},
      {label:State.theme==='light'?'حالت تاریک':'حالت روشن',icon:State.theme==='light'?IC.moon:IC.sun,run:toggleTheme,sec:'تنظیمات'},
      {label:'خروج از حساب',icon:IC.logout,run:logout,sec:'تنظیمات'}
    ];
    var cmds=nav.concat(acts);
    var f=query?cmds.filter(function(c){return c.label.toLowerCase().indexOf(query)>=0}):cmds;
    if(!f.length){list.innerHTML='<div class="cmd-empty">موردی یافت نشد</div>';return}
    var html='',lastSec=null;
    f.forEach(function(c,i){
      if(c.sec&&c.sec!==lastSec){html+='<div class="cmd-sec">'+c.sec+'</div>';lastSec=c.sec}
      html+='<div class="cmd-item '+(i===sel?'sel':'')+'" data-i="'+i+'">'+c.icon+'<b>'+c.label+'</b>'+(c.kbd?'<span class="kbd">'+c.kbd+'</span>':'')+'</div>';
    });
    list.innerHTML=html;
    list._f=f;
    $$('.cmd-item',list).forEach(function(el){
      el.addEventListener('click',function(){closeCmd();f[+el.dataset.i].run()});
      el.addEventListener('mouseenter',function(){
        sel=+el.dataset.i;
        $$('.cmd-item',list).forEach(function(x){x.classList.toggle('sel',+x.dataset.i===sel)});
      });
    });
  }
  build('');
  input.focus();
  input.addEventListener('input',function(){sel=0;build(input.value)});
  input.addEventListener('keydown',function(e){
    var f=list._f||[];
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,f.length-1);$$('.cmd-item',list).forEach(function(x){x.classList.toggle('sel',+x.dataset.i===sel)})}
    if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);$$('.cmd-item',list).forEach(function(x){x.classList.toggle('sel',+x.dataset.i===sel)})}
    if(e.key==='Enter'){e.preventDefault();var c=f[sel];if(c){closeCmd();c.run()}}
    if(e.key==='Escape')closeCmd();
  });
  bd.addEventListener('click',function(e){if(e.target===bd)closeCmd()});
}

function makeSpark(data,w,h){
  var max=Math.max.apply(null,data.concat([1]));
  var pts=[];
  for(var i=0;i<data.length;i++){pts.push({x:(i*w)/(data.length-1),y:h-2-((data[i]/max)*(h-4))})}
  return pts.map(function(p,i){return (i===0?'M':'L')+' '+p.x.toFixed(1)+' '+p.y.toFixed(1)}).join(' ');
}

function transferItemHTML(db,t){
  var st=stFor(t);
  var isInbound=t.type==='inbound';
  var p=getProd(db,t.productId);
  var src=getWh(db,t.sourceWarehouseId);
  var dst=getWh(db,t.destinationWarehouseId);
  var stepsHTML='';
  for(var i=1;i<=4;i++){
    var cls='';
    if(t.status==='rejected'){
      var rStepMap={warehouse:1,accountant:2,manager:3};
      var rStep=t.rejection?rStepMap[t.rejection.stage]:0;
      if(i<rStep)cls='done';else if(i===rStep)cls='rejected';
    }else{
      if(i<st.step)cls='done';else if(i===st.step)cls='active';
    }
    stepsHTML+='<div class="t-step '+cls+'"></div>';
  }
  var routeHTML=isInbound
    ?'<div class="t-route" style="color:#0369a1">'+IC.factory+' '+esc(t.supplierName||'—')+' '+IC.arrowL+' '+esc((dst&&dst.name)||'—')+'</div>'
    :'<div class="t-route">'+esc((src&&src.name)||'—')+' '+IC.arrowL+' '+esc((dst&&dst.name)||'—')+'</div>';
  return '<div class="t-item" data-tid="'+t.id+'">'+
    '<div class="t-row1">'+
      '<span class="t-code">'+esc(t.code)+'</span>'+
      '<span class="badge '+st.tone+'"><span class="dot"></span>'+st.label+'</span>'+
      (isInbound?'<span class="badge inbound">'+IC.inbound+' ورود</span>':'')+
      '<span class="small muted" style="margin-right:auto">'+relTime(t.createdAt)+'</span>'+
    '</div>'+
    '<div class="t-row2">'+
      routeHTML+
      '<span>'+esc((p&&p.name)||'')+'</span>'+
      '<span class="t-qty">'+t.quantity+'</span>'+
      '<div class="t-progress">'+stepsHTML+'</div>'+
    '</div>'+
  '</div>';
}

function openTransferDrawer(id){
  var db=loadDB();
  var t=null;
  for(var i=0;i<db.transfers.length;i++){if(db.transfers[i].id===id){t=db.transfers[i];break}}
  if(!t){celebrate('یافت نشد','','error',1600);return}
  var st=stFor(t);
  var isInbound=t.type==='inbound';
  var p=getProd(db,t.productId);
  var src=getWh(db,t.sourceWarehouseId);
  var dst=getWh(db,t.destinationWarehouseId);
  var steps=[
    {title:'ثبت درخواست',done:true,at:t.createdAt,user:t.createdByName,icon:IC.plus},
    {title:'تأیید مسئول انبار',step:t.warehouseApproval,key:'warehouse',icon:IC.package},
    {title:'تأیید حسابدار',step:t.accountantApproval,key:'accountant',icon:IC.shield},
    {title:'تأیید مدیر',step:t.managerApproval,key:'manager',icon:IC.users},
    {title:isInbound?'ورود قطعی':'انتقال قطعی',done:!!t.completedAt,at:t.completedAt,icon:IC.check}
  ];
  var rMap={warehouse:1,accountant:2,manager:3};
  var rStep=t.rejection?rMap[t.rejection.stage]:-1;
  var tlHTML=steps.map(function(s,i){
    var cls='';
    if(i===0||i===4){cls=s.done?'done':''}
    else{if(s.step)cls='done';else if(i===rStep)cls='rejected';else if(i===(st.step-1))cls='active'}
    var meta=[];
    if(s.at)meta.push('<b>'+esc(s.user||'')+'</b> · '+faDate(s.at));
    if(s.step)meta.push('<b>'+esc(s.step.userName)+'</b> · '+faDate(s.step.at));
    if(i===rStep&&t.rejection)meta.push('<span style="color:var(--ios-red)">رد توسط <b>'+esc(t.rejection.userName)+'</b><br>دلیل: '+esc(t.rejection.reason)+'</span>');
    var icon=cls==='done'?IC.check:cls==='rejected'?IC.x:cls==='active'?IC.clock:s.icon;
    return '<li class="'+cls+'"><div class="tl-node">'+icon+'</div><div class="tl-title">'+s.title+'</div>'+(meta.length?'<div class="tl-meta">'+meta.join('<br>')+'</div>':'')+'</li>';
  }).join('');
  var body=
    '<div class="dl" style="grid-template-columns:repeat(2,1fr);display:grid;gap:1px;margin-bottom:16px">'+
      '<div class="dl-item"><div class="k">وضعیت</div><div class="v"><span class="badge '+st.tone+'"><span class="dot"></span>'+st.label+'</span>'+(isInbound?' <span class="badge inbound">'+IC.inbound+'</span>':'')+'</div></div>'+
      '<div class="dl-item"><div class="k">نوع</div><div class="v">'+(isInbound?'ورود از تأمین‌کننده':(t.type==='direct-customer'?'ارسال مستقیم':'انتقال انبار'))+'</div></div>'+
      (isInbound?'<div class="dl-item"><div class="k">تأمین‌کننده</div><div class="v">'+esc(t.supplierName||'—')+'</div></div><div class="dl-item"><div class="k">مقصد</div><div class="v">'+esc((dst&&dst.name)||'—')+'</div></div>':'<div class="dl-item"><div class="k">مبدأ</div><div class="v">'+esc((src&&src.name)||'—')+'</div></div><div class="dl-item"><div class="k">مقصد</div><div class="v">'+esc((dst&&dst.name)||'—')+'</div></div>')+
      '<div class="dl-item"><div class="k">کالا</div><div class="v">'+esc((p&&p.name)||'—')+'</div></div>'+
      '<div class="dl-item"><div class="k">تعداد</div><div class="v">'+t.quantity+'</div></div>'+
      (isInbound&&t.invoiceNumber?'<div class="dl-item"><div class="k">شماره فاکتور</div><div class="v" style="font-family:monospace">'+esc(t.invoiceNumber)+'</div></div>':'')+
    '</div>'+

  else foot='<div class="muted small" style="text-align:center;width:100%">اقدامی برای شما در دسترس نیست</div>';

function pageNewTransfer(page){
  var db=loadDB();
  var sources=db.warehouses.filter(function(w){return ['central','paint','upholstery'].indexOf(w.type)>=0});
  var state={step:1,src:'',dst:'',pid:'',qty:0,desc:''};
  page.innerHTML=
    '<div class="page-head"><div><h1>درخواست جابه‌جایی</h1></div></div>'+
    '<div class="widget" style="max-width:760px;margin:0 auto">'+
      '<div class="wiz-steps">'+
        '<div class="wiz-line"><div class="wiz-line-fill" id="wiz-fill"></div></div>'+
        '<div class="wiz-step active"><div class="num">۱</div><div class="lbl">مسیر</div></div>'+
        '<div class="wiz-step"><div class="num">۲</div><div class="lbl">کالا</div></div>'+
        '<div class="wiz-step"><div class="num">۳</div><div class="lbl">تأیید</div></div>'+
      '</div>'+
      '<div id="wiz-body"></div>'+
      '<div style="display:flex;gap:10px;margin-top:22px;justify-content:space-between">'+
        '<button class="btn ghost" id="wiz-back">قبلی</button>'+
        '<button class="btn primary" id="wiz-next">بعدی</button>'+
      '</div>'+
    '</div>';
  function updateSteps(){
    $$('.wiz-step').forEach(function(el,i){
      el.classList.toggle('active',i+1===state.step);
      el.classList.toggle('done',i+1<state.step);
    });
    $('#wiz-fill').style.width=((state.step-1)/2*100)+'%';
  }
  function draw(){
    updateSteps();
    var body=$('#wiz-body'),back=$('#wiz-back'),next=$('#wiz-next');
    back.style.visibility=state.step===1?'hidden':'visible';
    next.innerHTML=state.step===3?(IC.check+' ثبت نهایی'):('بعدی '+IC.arrowL);
    if(state.step===1){
      var srcW=sources.filter(function(w){return w.id===state.src})[0];
      var allowed=state.src?allowedDest(srcW&&srcW.type):[];
      var dests=db.warehouses.filter(function(w){return allowed.indexOf(w.type)>=0});
      body.innerHTML='<div class="form-grid">'+
        '<div class="field"><label>انبار مبدأ <span class="req">*</span></label><select id="w-src"><option value="">انتخاب کنید...</option>'+sources.map(function(w){return '<option value="'+w.id+'" '+(state.src===w.id?'selected':'')+'>'+esc(w.name)+'</option>'}).join('')+'</select></div>'+
        '<div class="field"><label>انبار مقصد <span class="req">*</span></label><select id="w-dst" '+(!state.src?'disabled':'')+'><option value="">'+(state.src?'انتخاب کنید...':'ابتدا مبدأ')+'</option>'+dests.map(function(w){return '<option value="'+w.id+'" '+(state.dst===w.id?'selected':'')+'>'+esc(w.name)+'</option>'}).join('')+'</select></div>'+
      '</div>';
      $('#w-src').addEventListener('change',function(e){state.src=e.target.value;state.dst='';draw()});
      $('#w-dst').addEventListener('change',function(e){state.dst=e.target.value});
    }else if(state.step===2){
      var stock=findStock(db,state.pid,state.src);
      var avail=stock?stock.quantity-(stock.reservedQty||0):0;
      body.innerHTML='<div class="form-grid">'+
        '<div class="field"><label>کالا <span class="req">*</span></label><select id="w-pid"><option value="">انتخاب کنید...</option>'+db.products.map(function(p){return '<option value="'+p.id+'" '+(state.pid===p.id?'selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select></div>'+
        '<div class="field"><label>تعداد <span class="req">*</span></label><input id="w-qty" type="number" min="1" value="'+(state.qty||'')+'" /></div>'+
        '<div class="full field"><label>توضیحات</label><textarea id="w-desc">'+esc(state.desc)+'</textarea></div>'+
        (state.pid&&state.src?'<div class="full"><div style="padding:14px 18px;background:var(--grad-brand-soft);border-radius:20px;font-size:12.5px">موجودی قابل استفاده: <b style="color:var(--brand-1)">'+avail+'</b></div></div>':'')+
      '</div>';
      $('#w-pid').addEventListener('change',function(e){state.pid=e.target.value;state.qty=0;draw()});
      $('#w-qty').addEventListener('input',function(e){state.qty=+e.target.value});
      $('#w-desc').addEventListener('input',function(e){state.desc=e.target.value});
    }else{
      var srcW2=getWh(db,state.src),dstW=getWh(db,state.dst),p=getProd(db,state.pid);
      body.innerHTML='<div class="dl" style="grid-template-columns:1fr 1fr;display:grid;gap:1px">'+
        '<div class="dl-item"><div class="k">مبدأ</div><div class="v">'+esc((srcW2&&srcW2.name)||'')+'</div></div>'+
        '<div class="dl-item"><div class="k">مقصد</div><div class="v">'+esc((dstW&&dstW.name)||'')+'</div></div>'+
        '<div class="dl-item"><div class="k">کالا</div><div class="v">'+esc((p&&p.name)||'')+'</div></div>'+
        '<div class="dl-item"><div class="k">تعداد</div><div class="v">'+state.qty+'</div></div>'+
      '</div>';
    }
  }
  $('#wiz-back').addEventListener('click',function(){if(state.step>1){state.step--;draw()}});
  $('#wiz-next').addEventListener('click',function(){
    if(state.step===1){
      if(!state.src||!state.dst){celebrate('اطلاعات ناقص','مبدأ و مقصد را انتخاب کنید','warn',1600);return}
      state.step=2;draw();
    }else if(state.step===2){
      if(!state.pid||!state.qty||state.qty<=0){celebrate('اطلاعات ناقص','کالا و تعداد','warn',1600);return}
      var stock=findStock(db,state.pid,state.src);
      var avail=stock?stock.quantity-(stock.reservedQty||0):0;
      if(state.qty>avail){celebrate('موجودی کافی نیست','قابل استفاده: '+avail,'error',1900);return}
      state.step=3;draw();
    }else{
      var btn=$('#wiz-next');btn.classList.add('loading');
      setTimeout(function(){
        var fresh=loadDB();
        var srcStock=findStock(fresh,state.pid,state.src);
        if(!srcStock){btn.classList.remove('loading');celebrate('کالا یافت نشد','','error',1600);return}
        var avail2=srcStock.quantity-(srcStock.reservedQty||0);
        if(state.qty>avail2){btn.classList.remove('loading');celebrate('موجودی کافی نیست','','error',1800);return}
        srcStock.reservedQty=(srcStock.reservedQty||0)+state.qty;
        srcStock.updatedAt=new Date().toISOString();
        var dstW=getWh(fresh,state.dst);
        var t={id:uid(),code:tcode(fresh),type:dstW.type==='customer'?'direct-customer':'warehouse',sourceWarehouseId:state.src,destinationWarehouseId:state.dst,productId:state.pid,quantity:state.qty,description:state.desc,status:'pending_warehouse',createdBy:State.user.id,createdByName:State.user.name,createdAt:new Date().toISOString()};
        fresh.transfers.unshift(t);
        saveDB(fresh);
        celebrate('درخواست ثبت شد','در انتظار تأیید','success',1900);
        navigate('transfers');
      },400);
    }
  });
  draw();
  attachRippleAll();
}

          }).join('')+'</tbody></table>'
          :'<div class="table-empty">'+IC.inbox+'<b>کالایی ثبت نشده</b></div>')+
      '</div>'+
    '</div>';
  $('#pf').addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('#pn').value.trim(),code=$('#pc').value.trim(),unit=$('#pu').value.trim()||'دست';
    if(!name)return;
    var fresh=loadDB();
    fresh.products.push({id:uid(),name:name,code:code,unit:unit,createdAt:new Date().toISOString()});
    saveDB(fresh);
    celebrate('کالا افزوده شد','','success',1700);
    render();
  });
  $$('[data-del]').forEach(function(b){
    b.addEventListener('click',function(){
      var id=b.dataset.del;
      var fresh=loadDB();
      var used=fresh.stocks.some(function(s){return s.productId===id&&s.quantity>0})||fresh.transfers.some(function(t){return t.productId===id});
      if(used){celebrate('قابل حذف نیست','','error',2000);return}
      var f=loadDB();
      f.products=f.products.filter(function(p){return p.id!==id});
      f.stocks=f.stocks.filter(function(s){return s.productId!==id});
      saveDB(f);
      celebrate('حذف شد','','success',1600);
      render();
    });
  });
  attachRippleAll();
}

document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd()}
  if(e.key==='Escape'){
    closeCmd();closeDrawer();closeNotifPanel();
    var m=document.querySelector('.modal-bd');if(m)m.remove();
    var mn=document.querySelector('.notif-bd');if(mn)mn.remove();
    var mn2=document.querySelector('.notif-panel');if(mn2)mn2.remove();
    var us=document.querySelector('.userm');if(us)us.remove();
    $$('.celebrate').forEach(function(el){el.remove()});
  }
  if(!e.target.matches('input,textarea,select')&&!e.metaKey&&!e.ctrlKey&&State.user){
    var map={'1':'dashboard','2':'stock','3':'transfers','4':'inbounds'};
    if(map[e.key]&&NAV.filter(function(n){return n.key===map[e.key]&&n.roles.indexOf(State.user.role)>=0}).length){
      navigate(map[e.key]);
    }
  }
});

window.navigate=navigate;

  if(e){e.style.display='block';e.textContent='BOOT ERROR: '+(err.message||err)+'\n'+(err.stack||'')}
}

})();
